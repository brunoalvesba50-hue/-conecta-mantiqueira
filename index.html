async function saveMeta(obj){const meta={...(me?.user_metadata||{}),name:obj.name,city:obj.city,bio:obj.bio,photo:obj.photo,cover:obj.cover,interests:obj.interests,links:obj.links,whatsapp:obj.whatsapp||'',highlights:obj.highlights,aboutPublic:obj.aboutPublic!==false};const {data,error}=await sb.auth.updateUser({data:meta});if(error)return alert(error.message);me=data.user;closeModal();go('profile')}
const SUPPORT_OWNER_EMAIL='brunoalves.ba50@gmail.com';
function isSupportOwner(){return !!me?.email&&me.email.toLowerCase()===SUPPORT_OWNER_EMAIL.toLowerCase()}
async function submitSupport(){
  const err=document.getElementById('supportError'),btn=document.getElementById('supportSend');
  try{
    if(err)err.textContent='';
    const message=(document.getElementById('supportMessage')?.value||'').trim(),file=document.getElementById('supportScreenshot')?.files?.[0];
    if(!message&&!file){if(err)err.textContent='Escreva o problema ou envie um print para continuar.';return}
    if(btn){btn.disabled=true;btn.textContent='Enviando...'}
    let screenshot_url='';
    if(file){
      if(!file.type.startsWith('image/'))throw new Error('O print precisa ser uma imagem.');
      const prepared=await prepareMedia(file,'support');
      const path=`${me?.id||'anonymous'}/support/${Date.now()}-${Math.random().toString(36).slice(2)}.webp`;
      const up=await sb.storage.from('conecta-media').upload(path,prepared.blob,{contentType:prepared.type,upsert:false,cacheControl:'31536000'});
      if(up.error){
        if(prepared.blob.size<=620*1024)screenshot_url=await blobToData(prepared.blob);
        else throw new Error('Não foi possível enviar o print. Tente outro print ou uma imagem menor.');
      }else screenshot_url=sb.storage.from('conecta-media').getPublicUrl(path)?.data?.publicUrl||'';
    }
    const p=profileData();
    const payload={user_id:me?.id||null,user_name:p.name||'',user_email:me?.email||'',message,screenshot_url,page:window.cmCurrentPage||'desconhecida',user_agent:navigator.userAgent,created_at:new Date().toISOString(),status:'open'};
    const {error}=await sb.from('support_requests').insert(payload);if(error)throw error;
    openModal(`<div class="modalHead"><h2>Ajuda enviada ✅</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Recebemos sua mensagem e o print. A equipe do Conecta Mantiqueira poderá analisar o problema e corrigir o que for necessário.</div><button class="primary" style="width:100%;margin-top:16px" onclick="settingsScreen()">Voltar</button>`);
  }catch(e){if(err)err.textContent=String(e?.message||e||'Não foi possível enviar o pedido de ajuda.');}
  finally{if(btn){btn.disabled=false;btn.textContent='Enviar problema'}}
}
function supportScreen(){openModal(`<div class="modalHead"><h2>🆘 Ajuda e suporte</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Encontrou um erro? Escreva o que aconteceu e, se quiser, envie um print da tela. O sistema registra automaticamente seu usuário, a página e o navegador para facilitar a correção.</div><textarea id="supportMessage" class="textarea" placeholder="Conte o que aconteceu, o que você esperava e o que apareceu na tela..."></textarea><label class="photoAdd" style="display:block;text-align:center;cursor:pointer" for="supportScreenshot">📸 Adicionar print do problema</label><input id="supportScreenshot" class="hidden" type="file" accept="image/*" onchange="previewSupportShot(this)"><div id="supportPreview" class="small" style="margin-top:10px"></div><div id="supportError" class="error"></div><button id="supportSend" class="primary" style="width:100%;margin-top:12px" onclick="submitSupport()">Enviar problema</button></div>`)}
function previewSupportShot(input){const f=input?.files?.[0],el=document.getElementById('supportPreview');if(!el)return;if(!f){el.textContent='';return}el.innerHTML=`📎 ${esc(f.name)} • ${Math.round(f.size/1024)} KB`}
async function supportInbox(){if(!isSupportOwner())return alert('Acesso restrito ao responsável pelo Conecta Mantiqueira.');const {data,error}=await sb.from('support_requests').select('*').order('created_at',{ascending:false}).limit(100);if(error)return alert('Não foi possível carregar os pedidos de ajuda: '+error.message);openModal(`<div class="modalHead"><h2>📥 Pedidos de ajuda</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Relatos enviados pelos usuários do Conecta Mantiqueira.</div><div class="list">${(data||[]).map(x=>`<article class="card" style="margin-bottom:10px"><b>${esc(x.user_name||'Usuário')}</b><div class="small">${esc(x.user_email||'')} • ${esc(x.page||'')} • ${new Date(x.created_at).toLocaleString('pt-BR')}</div><p>${esc(x.message||'Sem mensagem.')}</p>${x.screenshot_url?`<img src="${esc(x.screenshot_url)}" style="width:100%;max-height:420px;object-fit:contain;border-radius:14px;margin-top:8px" onclick="openImage('${encodeURIComponent(x.screenshot_url)}')">`:''}<div class="small" style="margin-top:8px">${esc(x.user_agent||'')}</div></article>`).join('')||`<div class="empty">Nenhum pedido de ajuda ainda.</div>`}</div>`)}
function settingsScreen(){const dark=!document.body.classList.contains('lightTheme'),notif=localStorage.getItem('cm_notifications')!=='off';openModal(`<div class="modalHead"><h2>Configurações</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Personalize sua experiência no Conecta Mantiqueira.</div><div class="settingsGrid"><div class="settingRow"><span><b>Notificações</b><small>Receber avisos de mensagens, interações e novidades.</small></span><button type="button" class="switch ${notif?'on':''}" onclick="enableNotifications()"><i></i></button></div><div class="settingRow"><span><b>Tema escuro</b><small>Alternar entre tema escuro e claro.</small></span><button type="button" class="switch ${dark?'on':''}" onclick="toggleSetting(this,'theme')"><i></i></button></div></div><button class="primary" style="width:100%;margin-top:16px" onclick="changePasswordModal()">🔐 Alterar senha</button><button class="secondary" style="width:100%;margin-top:10px" onclick="supportScreen()">🆘 Ajuda e suporte</button>${isSupportOwner()?'<button class="secondary" style="width:100%;margin-top:10px" onclick="supportInbox()">📥 Ver pedidos de ajuda</button>':''}<button class="secondary" style="width:100%;margin-top:10px" onclick="closeModal()">Fechar</button><button class="secondary" style="width:100%;margin-top:8px;color:#ff9aa1;border-color:#7d3440" onclick="logout()">Sair do aplicativo</button>`) }
function changePasswordModal(){openModal(`<div class="modalHead"><h2>Alterar senha</h2><button class="close" onclick="settingsScreen()">×</button></div><div class="sub">Crie uma nova senha para sua conta do Conecta Mantiqueira.</div><div class="passwordWrap"><input id="newPassword" class="field" type="password" placeholder="Nova senha" autocomplete="new-password"><button type="button" class="showPass" onclick="togglePassword('newPassword',this)">👁 Mostrar</button></div><div class="passwordWrap"><input id="confirmNewPassword" class="field" type="password" placeholder="Confirmar nova senha" autocomplete="new-password"><button type="button" class="showPass" onclick="togglePassword('confirmNewPassword',this)">👁 Mostrar</button></div><div id="passwordError" class="error"></div><button class="primary" style="width:100%" onclick="changePassword()">Salvar nova senha</button></div>`)}
async function changePassword(){const err=document.getElementById('passwordError');try{err.textContent='';const a=document.getElementById('newPassword')?.value||'',b=document.getElementById('confirmNewPassword')?.value||'';if(a.length<6){err.textContent='A nova senha precisa ter pelo menos 6 caracteres.';return}if(a!==b){err.textContent='As senhas não coincidem. Digite a mesma senha nos dois campos.';return}const {error}=await sb.auth.updateUser({password:a});if(error)throw error;openModal(`<div class="modalHead"><h2>Senha alterada</h2><button class="close" onclick="settingsScreen()">×</button></div><div class="sub">Sua nova senha foi salva com sucesso.</div><button class="primary" style="width:100%;margin-top:16px" onclick="settingsScreen()">Continuar</button></div>`)}catch(e){err.textContent=authErrorPt(e)}}
function toggleSetting(btn,type){btn.classList.toggle('on');if(type==='notifications')localStorage.setItem('cm_notifications',btn.classList.contains('on')?'on':'off');if(type==='theme'){document.body.classList.toggle('lightTheme',!btn.classList.contains('on'));localStorage.setItem('cm_theme',btn.classList.contains('on')?'dark':'light')}}

function getStories(){return Array.isArray(storiesCache)?storiesCache:[]}
async function loadStories(){if(!me?.id)return [];try{const {data,error}=await sb.from('stories').select('id,user_id,media_url,media_type,caption,music,link_url,created_at,expires_at').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});if(error)throw error;const ids=[...new Set((data||[]).map(x=>x.user_id))];let profiles=[];if(ids.length){const r=await sb.from('profiles').select('id,name,photo').in('id',ids);profiles=r.data||[]}const map=new Map(profiles.map(x=>[x.id,x]));storiesCache=(data||[]).map(x=>{const p=map.get(x.user_id)||{};return {id:x.id,owner:x.user_id===me.id?'me':x.user_id,name:p.name||'Usuário',photo:p.photo||avatar(p.name||'Usuário'),image:x.media_url,type:x.media_type,text:x.caption||'',link:x.link_url||'',music:x.music||'',created:new Date(x.created_at).getTime(),user_id:x.user_id}});return storiesCache}catch(_){return storiesCache}}
async function newStory(){openModal(`<div class="modalHead"><h2>Novo status</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Escolha uma foto ou vídeo. Depois edite como quiser e publique.</div><div class="storyToolsRow"><button class="storyTool" onclick="document.getElementById('storyCamera').click()">📷 Câmera</button><button class="storyTool" onclick="document.getElementById('storyGallery').click()">🖼 Galeria</button></div><input id="storyCamera" class="hidden" type="file" accept="image/*,video/*" capture="environment" onchange="storyFilePicked(this)"><input id="storyGallery" class="hidden" type="file" accept="image/*,video/*" onchange="storyFilePicked(this)"><div id="storyPreviewWrap" class="hidden"><img id="storyPreview" class="storyPreview" alt="Prévia do status"></div><div id="storyFileName" class="small">Nenhuma mídia escolhida</div><div class="storyToolsRow"><button class="storyTool" onclick="toggleStoryOption('text')">Aa Texto</button><button class="storyTool" onclick="openMusicPicker()">🎵 Música</button><button class="storyTool" onclick="toggleStoryOption('link')">🔗 Link</button><button class="storyTool" onclick="toggleStoryOption('emoji')">😊 Emoji</button><button class="storyTool" onclick="toggleStoryOption('gif')">GIF</button></div><input id="storyText" class="field hidden" placeholder="Escreva algo..." autocomplete="off"><input id="storyLink" class="field hidden" placeholder="Link clicável" inputmode="url" autocomplete="off"><input id="storyEmoji" class="field hidden" placeholder="Digite ou cole um emoji 😊" autocomplete="off"><input id="storyGif" class="field hidden" placeholder="Cole o link de um GIF" inputmode="url" autocomplete="off"><input id="storyMusic" class="hidden" value=""><div id="storyMusicChoice" class="small hidden"></div><div class="storyPublish"><button class="primary" onclick="saveStory()">Publicar novo status</button></div>`)}
function storyFilePicked(input){const file=input.files?.[0];const camera=document.getElementById('storyCamera'),gallery=document.getElementById('storyGallery');if(file){if(camera&&input!==camera)camera.value='';if(gallery&&input!==gallery)gallery.value='';}const el=document.getElementById('storyFileName');if(el)el.textContent=file?.name||'Nenhuma mídia escolhida';const wrap=document.getElementById('storyPreviewWrap'),img=document.getElementById('storyPreview');if(file&&wrap&&img){const r=new FileReader();r.onload=()=>{if(file.type.startsWith('video/')){img.style.display='none';wrap.classList.remove('hidden')}else{img.src=r.result;img.style.display='block';wrap.classList.remove('hidden')}};r.readAsDataURL(file)}}
function toggleStoryOption(which){const id=which==='text'?'storyText':which==='link'?'storyLink':which==='emoji'?'storyEmoji':'storyGif';const el=document.getElementById(id);if(!el)return;el.classList.toggle('hidden');if(!el.classList.contains('hidden'))el.focus()}
const storyMusicList=[['Amanhecer na Serra','Conecta Music','https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3'],['Caminho da Montanha','Conecta Music','https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a734e5.mp3'],['Horizonte','Conecta Music','https://cdn.pixabay.com/download/audio/2022/10/25/audio_9467b0e2c4.mp3'],['Fim de Tarde','Conecta Music','https://cdn.pixabay.com/download/audio/2022/08/23/audio_3f5c7f5f64.mp3']];
function openMusicPicker(){openModal(`<div class="modalHead"><h2>🎵 Escolher música</h2><button class="close" onclick="closeModal();newStory()">×</button></div><div class="sub">Escolha uma faixa da playlist disponível para o status.</div>${storyMusicList.map((m,i)=>`<div class="settingRow" style="margin:8px 0"><span><b>${esc(m[0])}</b><small>${esc(m[1])}</small></span><button class="secondary" onclick="selectStoryMusic(${i})">Adicionar</button></div>`).join('')}<button class="secondary" style="width:100%;margin-top:10px" onclick="closeModal()">Cancelar</button>`)}
function selectStoryMusic(i){const m=storyMusicList[i];closeModal();const choice=document.getElementById('storyMusicChoice');const input=document.getElementById('storyMusic');if(input)input.value=m[0]+'|'+m[2];if(choice){choice.textContent='🎵 '+m[0]+' adicionada ao status';choice.classList.remove('hidden')}}
async function saveStory(){try{const file=document.getElementById('storyCamera').files[0]||document.getElementById('storyGallery').files[0];if(!file)return alert('Escolha uma foto ou vídeo para o status.');const media=await uploadMedia(file,'stories','story'),payload={user_id:me.id,media_url:media,media_type:file.type.startsWith('video/')?'video':'image',caption:document.getElementById('storyText').value.trim(),link_url:document.getElementById('storyLink').value.trim(),music:document.getElementById('storyMusic').value.trim(),expires_at:new Date(Date.now()+86400000).toISOString()};const {error}=await sb.from('stories').insert(payload);if(error)throw error;await loadStories();closeModal();go('home')}catch(e){alert(e.message||'Não foi possível publicar o status.')}}

function viewMyStory(){const s=getStories().filter(x=>x.owner==='me').pop();if(s)viewStoryData(s)}
function viewStoryData(s){const old=document.getElementById('storyViewer');if(old)old.remove();const media=s.type==='video'?`<video src="${esc(s.image)}" controls autoplay playsinline style="width:min(520px,100%);max-height:72vh;border-radius:20px;background:#000"></video>`:`<img src="${esc(s.image)}">`;document.body.insertAdjacentHTML('beforeend',`<div id="storyViewer" class="storyViewer"><button class="storyClose" onclick="this.parentElement.remove()">×</button><div style="width:min(520px,100%);text-align:center">${media}<h2>${esc(s.name||'Status')}</h2>${s.text?`<p>${esc(s.text)}</p>`:''}${s.link?`<a class="linkBtn" href="${esc(s.link)}" target="_blank" rel="noopener">🔗 Abrir link</a>`:''}${s.music?`<p class="small">🎵 Música adicionada</p>`:''}</div></div>`)}
function viewStory(id,name,photo){viewStoryData({name:decodeURIComponent(name),image:photo,type:'image',text:'Status da região 🌿'})}
function addGroup(){openModal(`<div class="modalHead"><h2>Criar grupo</h2><button class="close" onclick="closeModal()">×</button></div><input id="gName" class="field" placeholder="Nome do grupo"><input id="gSubtitle" class="field" placeholder="Subtítulo"><textarea id="gDesc" class="textarea" placeholder="Descrição do grupo"></textarea><textarea id="gRules" class="textarea" placeholder="Regras do grupo"></textarea><input id="gCover" class="field" placeholder="Link da foto/capa"><div class="sub" style="margin:8px 0 14px">Depois de criar, você poderá adicionar somente pessoas cadastradas no Conecta Mantiqueira.</div><button class="primary" onclick="saveGroup()">Criar grupo</button>`)}
function getGroups(){try{const raw=localStorage.getItem('cm_groups');const a=raw?JSON.parse(raw):[];return Array.isArray(a)?a.map(g=>({...g,members:Array.isArray(g.members)?g.members:[],blockedMembers:Array.isArray(g.blockedMembers)?g.blockedMembers:[],posts:Array.isArray(g.posts)?g.posts:[]})):[]}catch(_){return []}}
function saveGroup(){const members=[...document.querySelectorAll('.gMember:checked')].map(x=>x.value);const p=profileData();const g={id:Date.now().toString(),name:document.getElementById('gName').value.trim(),subtitle:document.getElementById('gSubtitle').value.trim(),desc:document.getElementById('gDesc').value.trim(),rules:document.getElementById('gRules').value.trim(),cover:document.getElementById('gCover').value.trim()||'mantiqueira-hero.jpg',members,ownerId:me?.id||'',owner:p.name,blockedMembers:[],posts:[]};if(!g.name)return alert('Coloque um nome para o grupo.');const a=getGroups();a.push(g);localStorage.setItem('cm_groups',JSON.stringify(a));closeModal();currentGroup=g;go('group')}
function groupPreview(){const a=getGroups();if(!a.length)return `<div class="empty">Ainda não há grupos criados. <button class="link" onclick="addGroup()">Criar o primeiro</button></div>`;return a.slice(0,2).map(g=>`<button class="card" style="width:100%;text-align:left;color:white" onclick="openGroup('${g.id}')"><div class="groupCover" style="background-image:url('${esc(g.cover)}')"></div><div class="groupMeta"><div><b>${esc(g.name)}</b><div class="small">${esc(g.subtitle||'Grupo da região')} • ${g.members.length} membros</div></div></div></button>`).join('')}
function groups(){return screen(`<button class="ghost" onclick="go('home')">← Voltar</button><div class="sectionHead"><div><h1>Grupos da região</h1><div class="sub">Comunidades da Serra da Mantiqueira para conversar, publicar e compartilhar.</div></div><button class="followBtn" onclick="addGroup()">＋ Criar</button></div>${getGroups().length?getGroups().map(g=>`<button class="card" style="width:100%;text-align:left;color:white" onclick="openGroup('${g.id}')"><div class="groupCover" style="background-image:url('${esc(g.cover)}')"></div><div class="groupMeta"><div><b>${esc(g.name)}</b><div class="small">${esc(g.subtitle||'Grupo da região')} • ${g.members.length} membros</div></div></div><p class="sub">${esc(g.desc||'Sem descrição.')}</p></button>`).join(''):`<div class="empty">Nenhum grupo criado ainda.<br><button class="primary" onclick="addGroup()">＋ Criar meu primeiro grupo</button></div>`}`,'home')}
function openGroup(id){currentGroup=getGroups().find(g=>g.id===id);go('group')}
function isGroupOwner(g){return !!g&&(!!g.ownerId&&g.ownerId===me?.id || !g.ownerId&&g.owner===profileData().name)}
function personById(id){return getPublicPeople().find(p=>p.id===id)||null}
function saveGroups(a){localStorage.setItem('cm_groups',JSON.stringify(a))}
function manageGroup(){const g=currentGroup;if(!g||!isGroupOwner(g))return alert('Somente o responsável pelo grupo pode gerenciar esta comunidade.');openModal(`<div class="modalHead"><h2>Gerenciar grupo</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Você é o responsável por este grupo. Aqui você pode editar a página, bloquear pessoas ou excluir o grupo.</div><input id="mgName" class="field" value="${esc(g.name)}" placeholder="Nome do grupo"><input id="mgSubtitle" class="field" value="${esc(g.subtitle||'')}" placeholder="Subtítulo"><textarea id="mgDesc" class="textarea" placeholder="Descrição">${esc(g.desc||'')}</textarea><textarea id="mgRules" class="textarea" placeholder="Regras">${esc(g.rules||'')}</textarea><input id="mgCover" class="field" value="${esc(g.cover||'')}" placeholder="Link da capa"><button class="primary" onclick="saveGroupEdit()">Salvar alterações</button><h3 style="margin-top:22px">Membros e bloqueios</h3>${g.members.map(id=>{const p=personById(id);const name=p?.name||id;const blocked=(g.blockedMembers||[]).includes(id);return `<div class="memberRow"><img class="avatar" src="${esc(p?.photo||avatar(name))}"><span style="flex:1"><b>${esc(name)}</b><small class="sub">${esc(p?.city||'')}</small></span><button class="secondary" onclick="toggleGroupBlock('${esc(id)}')">${blocked?'Desbloquear':'Bloquear'}</button></div>`}).join('')}<button class="secondary" style="width:100%;margin-top:12px;color:#ff9aa1;border-color:#7d3440" onclick="deleteGroup()">Excluir grupo</button>`)}
function saveGroupEdit(){const g=currentGroup;if(!g||!isGroupOwner(g))return;const a=getGroups(),x=a.find(q=>q.id===g.id);if(!x)return;x.name=document.getElementById('mgName').value.trim()||x.name;x.subtitle=document.getElementById('mgSubtitle').value.trim();x.desc=document.getElementById('mgDesc').value.trim();x.rules=document.getElementById('mgRules').value.trim();x.cover=document.getElementById('mgCover').value.trim()||'mantiqueira-hero.jpg';x.ownerId=x.ownerId||me?.id||'';saveGroups(a);currentGroup=x;closeModal();go('group')}
function toggleGroupBlock(id){const g=currentGroup;if(!g||!isGroupOwner(g)||id===me?.id)return;const a=getGroups(),x=a.find(q=>q.id===g.id);x.blockedMembers=x.blockedMembers||[];x.blockedMembers=x.blockedMembers.includes(id)?x.blockedMembers.filter(v=>v!==id):[...x.blockedMembers,id];saveGroups(a);currentGroup=x;manageGroup()}
function deleteGroup(){const g=currentGroup;if(!g||!isGroupOwner(g))return;if(!confirm('Excluir este grupo? Esta ação não pode ser desfeita.'))return;saveGroups(getGroups().filter(x=>x.id!==g.id));currentGroup=null;closeModal();go('groups')}
function profileTab(i){const p=profileData();if(i===2&&!p.showcaseEnabled)return;const el=document.getElementById('profilePages');if(el)el.scrollTo({left:el.clientWidth*i,behavior:'smooth'});document.querySelectorAll('.tabs .tab').forEach((b,n)=>b.classList.toggle('active',n===i))}
function groupScreen(){const g=currentGroup;if(!g)return groups();const owner=isGroupOwner(g);const blocked=(g.blockedMembers||[]).includes(me?.id);return screen(`<button class="ghost" onclick="go('groups')">← Grupos</button><div class="card"><div class="groupCover" style="background-image:url('${esc(g.cover)}')"></div><h1>${esc(g.name)}</h1><div class="sub">${esc(g.subtitle||'Grupo da região')}</div><p>${esc(g.desc||'')}</p><span class="pill">${g.members.length} membros</span><span class="pill">Comunidade Mantiqueira</span>${owner?`<div class="profileActions"><button class="followBtn" onclick="manageGroup()">⚙ Gerenciar grupo</button><button class="secondary" onclick="addGroupMember()">＋ Adicionar pessoas</button><button class="secondary" onclick="newGroupPost()">＋ Publicar</button></div>`:blocked?`<div class="empty">Você foi bloqueado neste grupo pelo responsável.</div>`:`<div class="profileActions"><button class="secondary" onclick="newGroupPost()">＋ Publicar</button></div>`}</div><div class="tabs"><button class="tab active" onclick="groupTab(0)">Publicações</button><button class="tab" onclick="groupTab(1)">Sobre</button></div><div id="groupPages" class="tabPages"><div class="tabPage">${g.posts.length?g.posts.slice().reverse().map(x=>`<article class="card post"><div class="postTop"><img class="avatar" src="${esc(x.photo)}"><div><b>${esc(x.name)}</b><span>no grupo</span></div></div>${x.text?`<p>${esc(x.text)}</p>`:''}${x.image?`<img src="${esc(x.image)}">`:''}<div class="postActions"><button class="action">♥ ${x.likes||0}</button><button class="action">💬 Comentar</button></div></article>`).join(''):`<div class="empty">O grupo ainda não tem publicações. Seja o primeiro.</div>`}</div><div class="tabPage"><div class="card"><h3>Sobre o grupo</h3><p class="sub">${esc(g.desc||'Sem descrição.')}</p><h3>Regras</h3>${(g.rules||'Respeite os outros membros.').split('\n').filter(Boolean).map((r,i)=>`<div class="rule"><b>${i+1}.</b> ${esc(r)}</div>`).join('')}<h3>Membros</h3>${g.members.map(id=>{const p=personById(id);const isBlocked=(g.blockedMembers||[]).includes(id);return `<div class="memberRow"><img class="avatar" src="${esc(p?.photo||avatar(p?.name||id))}"><span>${esc(p?.name||id)}${isBlocked?'<small style="display:block;color:#ff9aa1">Bloqueado</small>':`<small class="sub">${esc(p?.city||'')}</small>`}</span></div>`}).join('')}</div></div></div>`,'home')}
function groupTab(i){const el=document.getElementById('groupPages');if(el)el.scrollTo({left:el.clientWidth*i,behavior:'smooth'});document.querySelectorAll('.tabs .tab').forEach((b,n)=>b.classList.toggle('active',n===i))}
function addGroupMember(){const g=currentGroup;if(!g||!isGroupOwner(g))return alert('Somente o responsável pelo grupo pode adicionar pessoas.');const blocked=g.blockedMembers||[];const people=getPublicPeople().filter(p=>p.id!==me?.id&&!blocked.includes(p.id));openModal(`<div class="modalHead"><h2>Adicionar pessoas</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Escolha pessoas cadastradas no Conecta Mantiqueira.</div>${people.map(p=>`<label class="memberRow"><input type="checkbox" class="gmMember" value="${esc(p.id)}" ${g.members.includes(p.id)?'checked disabled':''}><img class="avatar" src="${esc(p.photo||avatar(p.name))}"><span>${esc(p.name)}<small class="sub">${esc(p.city||'')}</small></span></label>`).join('')||'<div class="empty">Nenhuma pessoa disponível ainda.</div>'}<button class="primary" onclick="saveGroupMembers()">Adicionar selecionadas</button>`)}
function saveGroupMembers(){const ids=[...document.querySelectorAll('.gmMember:checked:not(:disabled)')].map(x=>x.value);const a=getGroups(),g=a.find(x=>x.id===currentGroup.id);g.members=[...new Set([...g.members,...ids])];localStorage.setItem('cm_groups',JSON.stringify(a));currentGroup=g;closeModal();go('group')}
function newGroupPost(){openModal(`<div class="modalHead"><h2>Publicar no grupo</h2><button class="close" onclick="closeModal()">×</button></div><textarea id="gpText" class="textarea" placeholder="O que você quer compartilhar?"></textarea><input id="gpFile" class="fileInput" type="file" accept="image/*"><input id="gpImage" class="field" placeholder="Ou cole o link da foto"><button class="primary" onclick="saveGroupPost()">Publicar no grupo</button>`)}
async function saveGroupPost(){const g=currentGroup;if((g?.blockedMembers||[]).includes(me?.id))return alert('Você está bloqueado neste grupo.');const file=document.getElementById('gpFile').files[0],url=document.getElementById('gpImage').value.trim(),text=document.getElementById('gpText').value.trim();if(!text&&!file&&!url)return alert('Adicione texto ou foto.');const p=profileData(),image=file?await fileToData(file):url;const a=getGroups(),x=a.find(q=>q.id===g.id);x.posts=x.posts||[];x.posts.push({id:Date.now().toString(),ownerId:me?.id||'',name:p.name,photo:p.photo,text,image,likes:0});saveGroups(a);currentGroup=x;closeModal();go('group')}
function extractNewsImage(x){const raw=String(x.content||x.description||'');const m=raw.match(/<img[^>]+src=[\"\']([^\"\']+)[\"\']/i);return x.enclosure?.link||m?.[1]||x.thumbnail||''}
function newsImageUrl(src){if(!src)return '';if(/^data:/i.test(src))return src;if(/^https?:\/\//i.test(src))return 'https://images.weserv.nl/?url='+encodeURIComponent(src)+'&w=1200&h=700&fit=cover&output=jpg';return src}
function newsFallbackImage(n){if(!n?.url)return '';return 'https://api.microlink.io/?url='+encodeURIComponent(n.url)+'&meta=true&embed=image.url'}
function renderNews(list=news){const box=document.getElementById('newsList');if(!box)return;box.innerHTML=list.length?list.map(n=>{const original=n.image||'';const primary=original?newsImageUrl(original):newsFallbackImage(n);const fallback=newsFallbackImage(n);return `<a class="news" href="${esc(n.url)}" target="_blank" rel="noopener">${primary?`<img class="newsImage" src="${esc(primary)}" data-original="${esc(original)}" data-fallback="${esc(fallback)}" alt="Imagem da notícia: ${esc(n.title)}" onerror="if(this.dataset.original && this.src!==this.dataset.original){this.src=this.dataset.original;this.dataset.original=''}else if(this.dataset.fallback && this.src!==this.dataset.fallback){this.src=this.dataset.fallback;this.dataset.fallback=''}else{this.outerHTML='<div class=\"newsNoImage\">Imagem da fonte indisponível</div>'}">`:`<div class="newsNoImage">Imagem da fonte indisponível</div>`}<div class="newsBody"><div class="newsTop"><span class="newsSource">${esc(n.source||'Fonte regional')}</span><span class="newsDate">${esc(n.date||'Agora')}</span></div><b>${esc(n.title)}</b><span class="newsSummary">${esc(n.summary||'Veja os detalhes na matéria original.')}</span><div class="newsMeta"><span>📍 ${esc(n.city||'Mantiqueira')}</span><span class="newsRead">Ler matéria completa ↗</span></div></div></a>`}).join(''):'<div class="newsEmpty">Não encontramos uma matéria nova agora. Tente atualizar novamente.</div>'}
function newsDateValue(n){const d=n.pubDate||n.date||'';const t=Date.parse(d);return Number.isNaN(t)?0:t}
function newsDateText(value){const d=new Date(value);if(Number.isNaN(d.getTime()))return '';return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function stripHtml(v){const el=document.createElement('div');el.innerHTML=v||'';return (el.textContent||el.innerText||'').replace(/\s+/g,' ').trim()}
function newsCity(title=''){const t=normText(title);const citiesHit=cities.filter(c=>t.includes(normText(c)));return citiesHit[0]||''}
const newsQueries=['"Campos do Jordão"','"São Bento do Sapucaí"','"Santo Antônio do Pinhal"','"Sapucaí-Mirim"','"Gonçalves MG" OR "Monte Verde MG"','"Itajubá" OR "Maria da Fé" OR "Pouso Alto"','"Extrema MG" OR "Camanducaia"','"Paraisópolis MG" OR "Caxambu" OR "São Lourenço MG"'];
async function fetchNewsQuery(q){const rss='https://news.google.com/rss/search?q='+encodeURIComponent(q+' when:7d')+'&hl=pt-BR&gl=BR&ceid=BR:pt-419';const endpoint='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rss);const res=await fetch(endpoint,{cache:'no-store'});if(!res.ok)throw new Error('Falha ao buscar notícias');const data=await res.json();return Array.isArray(data.items)?data.items.map(x=>({...x,_query:q})):[]}
async function enrichNewsImage(item){try{const u='https://api.microlink.io/?url='+encodeURIComponent(item.link||'')+'&meta=true';const r=await fetch(u,{cache:'no-store'});if(r.ok){const d=await r.json();const image=d?.data?.image?.url||'';if(image)return image}}catch(_){}return extractNewsImage(item)}
async function refreshNews(force=false){const box=document.getElementById('newsList'),status=document.getElementById('newsStatus');if(!box)return;if(box.dataset.loading==='1')return;box.dataset.loading='1';box.classList.add('newsLoading');if(status)status.textContent='Buscando notícias novas de várias cidades...';try{const batches=await Promise.allSettled(newsQueries.map(fetchNewsQuery));let raw=[];batches.forEach(r=>{if(r.status==='fulfilled')raw.push(...r.value)});const seen=new Set();let items=raw.map(x=>{const title=stripHtml(x.title);const url=x.link||x.guid||'';const source=typeof x.author==='string'&&x.author?x.author:(typeof x.source==='string'&&x.source?x.source:(title.includes(' - ')?title.split(' - ').pop():'Fonte regional'));return{source,title:title.replace(/\s+-\s+[^-]+$/,''),summary:stripHtml(x.description||x.content).slice(0,190),url,date:newsDateText(x.pubDate)||'Atualizada recentemente',pubDate:x.pubDate||'',city:newsCity(title)||newsCity(x._query||''),image:extractNewsImage(x)}}).filter(x=>x.title&&x.url).filter(x=>{const k=x.url;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>newsDateValue(b)-newsDateValue(a));const byCity=new Map();items.forEach(x=>{const k=x.city||'Mantiqueira';if(!byCity.has(k))byCity.set(k,[]);byCity.get(k).push(x)});let diverse=[];let added=true;while(added&&diverse.length<16){added=false;for(const arr of byCity.values()){if(!arr.length)continue;diverse.push(arr.shift());added=true;if(diverse.length>=16)break}}if(diverse.length<8)diverse=items.slice(0,16);const enriched=await Promise.all(diverse.slice(0,12).map(async x=>({...x,image:x.image||await enrichNewsImage(x)})));const history=JSON.parse(localStorage.getItem('cm_news_seen')||'{}');const now=Date.now();Object.keys(history).forEach(k=>{if(now-history[k]>30*60*1000)delete history[k]});let fresh=enriched.filter(x=>!history[x.url]);if(fresh.length<8)fresh=enriched;fresh=fresh.slice(0,12);fresh.forEach(x=>{history[x.url]=now});localStorage.setItem('cm_news_seen',JSON.stringify(history));if(fresh.length){news.splice(0,news.length,...fresh);renderNews(news);if(status)status.textContent='Atualizado agora • '+new Set(fresh.map(x=>x.city)).size+' localidades • '+fresh.length+' notícias';localStorage.setItem('cm_news_cache',JSON.stringify(news))}else{renderNews(news);if(status)status.textContent='Não há novidades no momento'}}catch(e){const cached=JSON.parse(localStorage.getItem('cm_news_cache')||'[]').map(x=>({...x,image:(x.image&&/unsplash\.com/.test(x.image))?'':x.image}));if(cached.length){news.splice(0,news.length,...cached);renderNews(news)}if(status)status.textContent='Não foi possível atualizar agora. Tente novamente.'}finally{box.dataset.loading='0';box.classList.remove('newsLoading')}}

let newsRefreshTimer=null,newsPullStart=0,newsPulling=false;
function setupNewsRefresh(){renderNews(news);refreshNews();clearInterval(newsRefreshTimer);newsRefreshTimer=setInterval(()=>{if(document.visibilityState==='visible'&&document.getElementById('newsList'))refreshNews(false)},5*60*1000);const area=document.querySelector('.screen');if(!area)return;area.addEventListener('touchstart',e=>{if(window.scrollY<=5)newsPullStart=e.touches[0].clientY},{passive:true});area.addEventListener('touchmove',e=>{if(!newsPullStart)return;const dy=e.touches[0].clientY-newsPullStart;if(dy>0&&window.scrollY<=5){newsPulling=true;const h=Math.min(48,Math.round(dy*.45));const pull=document.getElementById('newsPull');if(pull){pull.style.height=h+'px';pull.textContent=h>=42?'Solte para atualizar notícias ↓':'Puxe para atualizar notícias…'}}},{passive:true});area.addEventListener('touchend',()=>{if(newsPulling){const pull=document.getElementById('newsPull');if(pull&&parseInt(pull.style.height||'0',10)>=42)refreshNews(true);if(pull){pull.style.height='0px';pull.textContent=''}}newsPullStart=0;newsPulling=false},{passive:true})}
function isOnline(id){return !!id&&onlineUsers.has(id)}
function presenceStatus(id){return isOnline(id)?'<span class="onlineDot isOnline">● Online agora</span>':'<span class="onlineDot">○ Offline</span>'}
function refreshPresenceUI(){document.querySelectorAll('[data-online-user]').forEach(el=>{const id=el.getAttribute('data-online-user');el.className='onlineDot '+(isOnline(id)?'isOnline':'');el.textContent=isOnline(id)?'● Online agora':'○ Offline'});const h=document.querySelector('[data-conversation-online]');if(h&&currentPublicUser)h.outerHTML=`<div class="small" data-conversation-online>${isOnline(currentPublicUser.id)?'<span class="onlineDot isOnline">● Online agora</span>':'<span class="onlineDot">○ Offline</span>'}</div>`}
function startPresence(){if(!me?.id)return;try{if(presenceChannel){sb.removeChannel(presenceChannel);presenceChannel=null}presenceChannel=sb.channel('cm-online',{config:{presence:{key:me.id}}});presenceChannel.on('presence',{event:'sync'},()=>{const state=presenceChannel.presenceState();onlineUsers=new Set(Object.keys(state));refreshPresenceUI()}).on('presence',{event:'join'},({key})=>{onlineUsers.add(key);refreshPresenceUI()}).on('presence',{event:'leave'},({key})=>{const st=presenceChannel?presenceChannel.presenceState():{};if(!st[key]||!st[key].length)onlineUsers.delete(key);refreshPresenceUI()}).subscribe(async status=>{if(status==='SUBSCRIBED'){await presenceChannel.track({user_id:me.id,online_at:new Date().toISOString()})}})}catch(_){} }
async function setPresenceOnline(online){if(!presenceChannel)return;try{if(online)await presenceChannel.track({user_id:me.id,online_at:new Date().toISOString()});else await presenceChannel.untrack()}catch(_){}}
function stopPresence(){try{if(presenceChannel){sb.removeChannel(presenceChannel);presenceChannel=null}}catch(_){}onlineUsers.delete(me?.id);refreshPresenceUI()}
async function enableNotifications(){if(!('Notification' in window)){alert('Este navegador não oferece notificações para o site.');return false}try{const p=await Notification.requestPermission();if(p==='granted'){localStorage.setItem('cm_notifications','on');alert('Notificações ativadas neste celular.');return true}localStorage.setItem('cm_notifications','off');alert('As notificações continuam bloqueadas pelo navegador. Ative-as nas configurações do iPhone.');return false}catch(_){return false}}
function notifyNewMessage(m){if(localStorage.getItem('cm_notifications')==='off')return;if(!('Notification' in window)||Notification.permission!=='granted')return;if(document.visibilityState==='visible'&&window.cmCurrentPage==='conversation')return;const sender=getPublicPeople().find(p=>p.id===m.sender_id);const title=sender?.name||'Nova mensagem';try{new Notification(title,{body:m.body||'Você recebeu uma nova mensagem no Conecta Mantiqueira.',icon:sender?.photo||'icon-192.png',tag:'cm-message-'+m.id})}catch(_){} }
function startMessagesRealtime(){if(!me?.id)return;try{if(messagesChannel){sb.removeChannel(messagesChannel);messagesChannel=null}messagesChannel=sb.channel('cm-messages-'+me.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`receiver_id=eq.${me.id}`},payload=>{const m=payload.new;notifyNewMessage(m);if(currentPublicUser?.id===m.sender_id&&window.cmCurrentPage==='conversation'){appendMessageBubble(m);}}).subscribe()}catch(_){} }
function appendMessageBubble(m){const box=document.getElementById('conversationMessages');if(!box)return;const mine=m.sender_id===me.id;const d=document.createElement('div');d.className='bubble '+(mine?'mine':'');d.textContent=m.body||'';box.appendChild(d);box.scrollTop=box.scrollHeight}
async function loadConversationMessages(){const box=document.getElementById('conversationMessages');if(!box||!currentPublicUser||!me?.id)return;const {data,error}=await sb.from('messages').select('id,sender_id,receiver_id,body,created_at').or(`and(sender_id.eq.${me.id},receiver_id.eq.${currentPublicUser.id}),and(sender_id.eq.${currentPublicUser.id},receiver_id.eq.${me.id})`).order('created_at',{ascending:true});if(error){box.innerHTML='<div class="empty">Não foi possível carregar as mensagens agora.</div>';return}box.innerHTML='';(data||[]).forEach(appendMessageBubble);box.scrollTop=box.scrollHeight}
function chat(){const people=getPublicPeople().filter(p=>p.id!==me?.id);return screen(`<h1>Bate-papo</h1><input class="search" placeholder="⌕ Buscar conversas..." oninput="filterChat(this.value)"><div id="chatPeople" class="list">${people.length?people.map(p=>`<div class="chatItem" data-chat-name="${esc((p.name+' '+p.city).toLowerCase())}" onclick="publicProfile('${esc(p.id)}');setTimeout(()=>go('conversation'),0)"><img class="avatar" src="${esc(p.photo||avatar(p.name))}"><div class="chatInfo"><b>${esc(p.name)}</b><span data-online-user="${p.id}" class="onlineDot ${isOnline(p.id)?'isOnline':''}">${isOnline(p.id)?'● Online agora':'○ Offline'}</span></div><button class="iconBtn">›</button></div>`).join(""):"<div class='empty'>Você ainda não tem outras pessoas cadastradas para conversar.</div>"}</div>`,'chat')}
function filterChat(q){const v=String(q||'').toLowerCase().trim();document.querySelectorAll('[data-chat-name]').forEach(el=>el.style.display=!v||el.getAttribute('data-chat-name').includes(v)?'flex':'none')}
function conversation(){const p=currentPublicUser;if(!p)return chat();const html=`<main class="conversationScreen"><header class="conversationHeader"><button class="ghost" onclick="go('chat')">←</button><img class="avatar" src="${esc(p.photo||avatar(p.name))}"><div class="conversationName"><b>${esc(p.name)}</b><div class="small" data-conversation-online>${isOnline(p.id)?'<span class="onlineDot isOnline">● Online agora</span>':'<span class="onlineDot">○ Offline</span>'}</div></div><button class="iconBtn" type="button">☎</button><button class="iconBtn" type="button">⋯</button></header><section class="conversationBody"><div class="conversationIntro"><img class="profileAvatar" src="${esc(p.photo||avatar(p.name))}"><h2>${esc(p.name)}</h2><div class="sub">${esc(p.city)}</div><div class="profileActions"><button class="secondary" onclick="publicProfile('${p.id}')">Ver perfil</button><button class="followBtn" onclick="toggleFollow('${p.id}')">${isFollowing(p.id)?'Seguindo':'Seguir'}</button></div></div><div id="conversationMessages" class="conversationMessages"><div class="empty">Carregando mensagens...</div></div></section><form class="conversationComposer" onsubmit="event.preventDefault();sendMessage('${p.id}')"><button type="button" class="iconBtn">📷</button><input id="msgText" autocomplete="off" placeholder="Mensagem..." enterkeyhint="send"><button type="submit" class="iconBtn">➤</button><button type="button" class="iconBtn">🎙</button><button type="button" class="iconBtn">🖼</button><button type="button" class="iconBtn gifBtn">GIF</button><button type="button" class="iconBtn">＋</button></form>${nav('chat')}</main>`;setTimeout(loadConversationMessages,0);return html}
async function sendMessage(id){const el=document.getElementById('msgText'),body=el?.value.trim();if(!body||!me?.id||!id)return;el.value='';const {data,error}=await sb.from('messages').insert({sender_id:me.id,receiver_id:id,body}).select('id,sender_id,receiver_id,body,created_at').single();if(error){alert('Não foi possível enviar a mensagem agora.');el.value=body;return}appendMessageBubble(data)}
function openImage(url){const src=decodeURIComponent(url);document.body.insertAdjacentHTML('beforeend',`<div id="imageModal" class="storyViewer" onclick="this.remove()"><img src="${esc(src)}"></div>`)}
function openModal(content){const old=document.getElementById('modal');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal"><div class="modalBox">${content}</div></div>`)}
function closeModal(){document.getElementById('modal')?.remove()}
async function imageBlobFromFile(file,kind="post"){
  const src=URL.createObjectURL(file);
  try{
    const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
    const limits={avatar:[1200,0.88,700],cover:[1800,0.88,900],story:[1920,0.9,1200],post:[2048,0.9,1400],highlight:[1800,0.9,1000],support:[1600,0.84,650]};
    const [maxSide,initialQ,maxKB]=limits[kind]||limits.post;
    let scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
    let w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,w,h);
    let quality=initialQ,blob=await new Promise(r=>canvas.toBlob(r,'image/webp',quality));
    if(!blob)blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',quality));
    while(blob&&blob.size>maxKB*1024&&quality>0.68){quality-=0.04;blob=await new Promise(r=>canvas.toBlob(r,'image/webp',quality));if(!blob)break}
    if(blob&&blob.size>maxKB*1024){
      const factor=Math.sqrt((maxKB*1024)/blob.size);canvas.width=Math.max(1,Math.round(w*factor));canvas.height=Math.max(1,Math.round(h*factor));ctx.drawImage(img,0,0,canvas.width,canvas.height);blob=await new Promise(r=>canvas.toBlob(r,'image/webp',0.82));
    }
    return blob||file;
  }finally{URL.revokeObjectURL(src)}
}
async function prepareMedia(file,kind='post'){
  if(!file)return null;
  if(file.type.startsWith('image/')){const blob=await imageBlobFromFile(file,kind);return {blob,name:'media-'+Date.now()+'.webp',type:'image/webp'};}
  if(file.type.startsWith('video/')){const blob=await compressVideoFile(file);const type=blob.type||'video/mp4';return {blob,name:'media-'+Date.now()+(type.includes('webm')?'.webm':'.mp4'),type};}
  throw new Error('Formato de mídia não suportado.');
}
async function compressVideoFile(file){
  if(!window.MediaRecorder||!HTMLVideoElement.prototype.captureStream)return file;
  const url=URL.createObjectURL(file);let video;
  try{
    video=document.createElement('video');video.src=url;video.muted=true;video.playsInline=true;await new Promise((res,rej)=>{video.onloadedmetadata=res;video.onerror=rej});
    const maxSide=1080,scale=Math.min(1,maxSide/Math.max(video.videoWidth,video.videoHeight));const w=Math.max(2,Math.round(video.videoWidth*scale/2)*2),h=Math.max(2,Math.round(video.videoHeight*scale/2)*2);
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');
    const stream=canvas.captureStream(30);const audio=video.captureStream?.().getAudioTracks?.()[0];if(audio)stream.addTrack(audio);
    const types=['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9,opus','video/webm'];const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:Math.min(4000000,Math.max(1600000,w*h*1.7))}:undefined);const chunks=[];
    const done=new Promise((resolve,reject)=>{rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onerror=reject;rec.onstop=()=>resolve(new Blob(chunks,{type:rec.mimeType||mime||'video/webm'}))});
    let raf=0;const draw=()=>{if(video.paused||video.ended)return;ctx.drawImage(video,0,0,w,h);raf=requestAnimationFrame(draw)};video.currentTime=0;await video.play();rec.start(250);draw();await new Promise(resolve=>{video.onended=resolve});cancelAnimationFrame(raf);rec.stop();const out=await done;return out.size<file.size?out:file;
  }catch(_){return file}finally{try{video?.pause()}catch(_){}URL.revokeObjectURL(url)}
}
async function uploadMedia(file,folder='media',kind='post'){
  const prepared=await prepareMedia(file,kind);const ext=prepared.type==='image/webp'?'webp':prepared.type.includes('mp4')?'mp4':'bin';const path=`${me?.id||'anonymous'}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  try{const {error}=await sb.storage.from('conecta-media').upload(path,prepared.blob,{contentType:prepared.type,upsert:false,cacheControl:'31536000'});if(error)throw error;const {data}=sb.storage.from('conecta-media').getPublicUrl(path);if(data?.publicUrl)return data.publicUrl;throw new Error('Não foi possível obter o endereço da mídia.')}catch(e){
    if(prepared.type.startsWith('image/')){const maxFallback=620*1024;if(prepared.blob.size<=maxFallback){return await blobToData(prepared.blob)} }
    throw new Error('O armazenamento de mídia do Conecta ainda não está configurado.');
  }
}
function blobToData(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
function fileToData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function logout(){sb.auth.signOut();me=null;location.reload()}
async function go(page,arg=""){window.cmCurrentPage=page;const a=document.getElementById('app');if(!a)return;if(page==='home'){a.innerHTML=home();await loadPublicProfiles();a.innerHTML=home()}else if(page==='people'){a.innerHTML=screen('<div class="card"><div class="sub">Carregando pessoas da região...</div></div>','explore');a.innerHTML=await people(arg)}else if(page==='chat')a.innerHTML=chat();else if(page==='conversation')a.innerHTML=conversation();else if(page==='explore'){a.innerHTML=explore();setTimeout(renderFeed,0)}else if(page==='news'){a.innerHTML=newsScreen();setTimeout(setupNewsRefresh,0)}else if(page==='business')a.innerHTML=businessScreen();else if(page==='profile')a.innerHTML=profile();else if(page==='publicProfile')a.innerHTML=publicProfileScreen();else if(page==='groups')a.innerHTML=groups();else if(page==='group')a.innerHTML=groupScreen()}
function authScreen(){window.cmCurrentPage='auth';document.getElementById('app').innerHTML=`<div class="auth"><div class="authCard"><div class="brand">Conecta <span>Mantiqueira</span></div><h1 id="authTitle">Criar conta</h1><div class="sub">Entre para fazer parte da região conectada.</div><div id="registerFields"><input id="name" class="field" placeholder="Nome"><input id="city" class="field" placeholder="Cidade"></div><input id="email" class="field" type="email" placeholder="E-mail" autocomplete="email"><div class="passwordWrap"><input id="password" class="field" type="password" placeholder="Senha" autocomplete="new-password"><button type="button" class="showPass" onclick="togglePassword('password',this)">👁 Mostrar</button></div><div id="confirmPasswordWrap"><div class="passwordWrap"><input id="confirmPassword" class="field" type="password" placeholder="Confirmar senha" autocomplete="new-password"><button type="button" class="showPass" onclick="togglePassword('confirmPassword',this)">👁 Mostrar</button></div></div><div id="error" class="error"></div><button class="primary" onclick="submitAuth()">Continuar</button><button id="forgotBtn" class="ghost hidden" type="button" onclick="forgotPassword()">Esqueci minha senha</button><div class="orLine"><span>ou</span></div><button class="googleBtn" onclick="signInGoogle()">🔵 Continuar com Google</button><button class="ghost" onclick="toggleAuth()">Já tenho uma conta</button></div></div>`;window.mode='register'}
async function signInGoogle(){try{const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:CONECTA_APP_URL}});if(error)throw error}catch(e){const el=document.getElementById('error');if(el)el.textContent=authErrorPt(e)}}
function togglePassword(id,btn){const input=document.getElementById(id);if(!input)return;const show=input.type==='password';input.type=show?'text':'password';btn.textContent=show?'🙈 Ocultar':'👁 Mostrar'}
function toggleAuth(){mode=mode==='register'?'login':'register';document.getElementById('authTitle').textContent=mode==='register'?'Criar conta':'Entrar';document.getElementById('registerFields').classList.toggle('hidden',mode!=='register');document.getElementById('confirmPasswordWrap').classList.toggle('hidden',mode!=='register');document.getElementById('forgotBtn').classList.toggle('hidden',mode!=='login');document.querySelector('.ghost').textContent=mode==='register'?'Já tenho uma conta':'Criar uma conta';document.getElementById('error').textContent=''}
async function forgotPassword(){try{const email=(document.getElementById('email')?.value||'').trim();if(!email){document.getElementById('error').textContent='Digite seu e-mail para receber o link de recuperação.';return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:CONECTA_APP_URL});if(error)throw error;document.getElementById('error').textContent='Enviamos um link para redefinir sua senha. Verifique o e-mail informado, inclusive a caixa de spam.'}catch(e){document.getElementById('error').textContent=authErrorPt(e)}}
function resetPasswordScreen(){document.getElementById('app').innerHTML=`<div class="auth"><div class="authCard"><div class="brand">Conecta <span>Mantiqueira</span></div><h1>Nova senha</h1><div class="sub">Digite uma nova senha para recuperar o acesso à sua conta.</div><div class="passwordWrap"><input id="resetPassword" class="field" type="password" placeholder="Nova senha" autocomplete="new-password"><button type="button" class="showPass" onclick="togglePassword('resetPassword',this)">👁 Mostrar</button></div><div class="passwordWrap"><input id="resetConfirmPassword" class="field" type="password" placeholder="Confirmar nova senha" autocomplete="new-password"><button type="button" class="showPass" onclick="togglePassword('resetConfirmPassword',this)">👁 Mostrar</button></div><div id="resetError" class="error"></div><button class="primary" onclick="saveResetPassword()">Salvar nova senha</button></div></div>`}
async function saveResetPassword(){const err=document.getElementById('resetError');try{err.textContent='';const a=document.getElementById('resetPassword')?.value||'',b=document.getElementById('resetConfirmPassword')?.value||'';if(a.length<6){err.textContent='A nova senha precisa ter pelo menos 6 caracteres.';return}if(a!==b){err.textContent='As senhas não coincidem. Digite a mesma senha nos dois campos.';return}const {data,error}=await sb.auth.updateUser({password:a});if(error)throw error;history.replaceState({},document.title,location.pathname);me=data?.user||me;alert('Senha alterada com sucesso! Você já está conectado ao Conecta Mantiqueira.');if(!me){const u=await sb.auth.getUser();me=u?.data?.user||null}if(me){try{await loadPublicProfiles()}catch(_){}go('home')}else{authScreen();toggleAuth()}}catch(e){err.textContent=authErrorPt(e)}}
function authErrorPt(e){const raw=String(e?.message||e||'').trim(),msg=raw.toLowerCase();if(msg.includes('user already registered')||msg.includes('already been registered')||msg.includes('already registered'))return 'Este e-mail já está cadastrado. Toque em “Já tenho uma conta” para entrar.';if(msg.includes('invalid login credentials')||msg.includes('invalid credentials'))return 'E-mail ou senha incorretos. Confira os dados e tente novamente.';if(msg.includes('email not confirmed')||msg.includes('email_not_confirmed'))return 'Seu e-mail ainda não foi confirmado. Verifique sua caixa de entrada.';if(msg.includes('password should be at least')||msg.includes('password must be at least')||msg.includes('weak password'))return 'A senha precisa ter pelo menos 6 caracteres.';if(msg.includes('invalid email')||msg.includes('email address'))return 'Digite um e-mail válido.';if(msg.includes('rate limit')||msg.includes('too many requests'))return 'Muitas tentativas. Aguarde alguns minutos e tente novamente.';if(msg.includes('network')||msg.includes('fetch')||msg.includes('failed to fetch'))return 'Não foi possível conectar ao servidor. Verifique sua internet e tente novamente.';if(msg.includes('signup')&&msg.includes('disabled'))return 'O cadastro está temporariamente indisponível.';return raw ? 'Erro ao entrar: '+raw : 'Não foi possível concluir a operação. Confira os dados e tente novamente.'}
async function submitAuth(){try{document.getElementById('error').textContent='';const emailInput=document.getElementById('email'),passwordInput=document.getElementById('password'),confirmInput=document.getElementById('confirmPassword'),nameInput=document.getElementById('name'),cityInput=document.getElementById('city');if(mode==='register'){const email=emailInput.value.trim(),password=passwordInput.value,confirm=confirmInput?.value||'';if(!nameInput?.value.trim())throw new Error('Digite seu nome.');if(!cityInput?.value.trim())throw new Error('Digite sua cidade.');if(!email)throw new Error('Digite seu e-mail.');if(!password)throw new Error('Digite uma senha.');if(password.length<6)throw new Error('A senha precisa ter pelo menos 6 caracteres.');if(password!==confirm)throw new Error('As senhas não coincidem. Digite a mesma senha nos dois campos.');const {data,error}=await sb.auth.signUp({email,password,options:{data:{name:nameInput.value.trim(),city:cityInput.value.trim(),bio:'',photo:'',cover:'mantiqueira-hero.jpg',interests:'',links:'',whatsapp:'',highlights:[]}}});if(error)throw error;if(!data.user)throw new Error('Não foi possível criar a conta.');me=data.user;try{await sb.from('profiles').upsert({id:me.id,name:nameInput.value.trim(),city:cityInput.value.trim(),bio:'',photo:'',cover:'mantiqueira-hero.jpg',interests:'',links:'',whatsapp:''},{onConflict:'id'})}catch(_){} }else{const email=emailInput.value.trim(),password=passwordInput.value;if(!email)throw new Error('Digite seu e-mail.');if(!password)throw new Error('Digite sua senha.');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;me=data.user}go('home')}catch(e){const el=document.getElementById('error');if(el)el.textContent=authErrorPt(e);if(mode==='login'){const btn=document.getElementById('forgotBtn');if(btn){btn.classList.remove('hidden');btn.textContent='🔐 Recuperar minha senha'}}}}
async function applyTheme(){document.body.classList.toggle('lightTheme',localStorage.getItem('cm_theme')==='light')}
async function start(){applyTheme();if(location.hash.includes('type=recovery')||new URLSearchParams(location.search).get('code')){if(new URLSearchParams(location.search).get('code')){try{await sb.auth.exchangeCodeForSession(new URLSearchParams(location.search).get('code'))}catch(_){}}resetPasswordScreen();return}authScreen();try{const {data}=await sb.auth.getUser();me=data?.user||null;if(me){const m=me.user_metadata||{};try{await sb.from("profiles").upsert({id:me.id,name:m.name||m.full_name||me.email?.split("@")[0]||"Novo usuário",city:m.city||"Cidade não informada",bio:m.bio||"",photo:m.photo||m.avatar_url||m.picture||"",cover:m.cover||"mantiqueira-hero.jpg",interests:m.interests||"",links:m.links||"",showcaseEnabled:m.showcaseEnabled===true},{onConflict:"id"})}catch(_){}await loadPublicProfiles();await loadFollowState();await loadStories();startPresence();startMessagesRealtime();go("home")}}catch(_){me=null;authScreen()}}
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){resetPasswordScreen()} if(event==='SIGNED_IN'&&session?.user){me=session.user;startPresence();startMessagesRealtime()} if(event==='SIGNED_OUT'){stopPresence();if(messagesChannel){try{sb.removeChannel(messagesChannel)}catch(_){}}messagesChannel=null}});
window.addEventListener('visibilitychange',()=>{if(!me)return;if(document.visibilityState==='visible'){setPresenceOnline(true)}else{setPresenceOnline(false)}});
window.addEventListener('pagehide',()=>{setPresenceOnline(false)});
window.addEventListener('beforeunload',()=>{setPresenceOnline(false)});
start();
</script>
