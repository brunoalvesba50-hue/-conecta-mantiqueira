.profileHeaderRow{position:relative;min-height:118px;display:block;}
.profileHeaderRow>.profileAvatarRing{position:relative;display:block;width:100px;height:100px;margin-top:-46px;margin-left:0;z-index:5;}
.profileHeaderStats{position:absolute;left:108px;right:54px;top:8px;width:auto;height:78px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;justify-content:stretch;gap:2px;padding:4px 0 0;text-align:center;z-index:4;}
.profileHeaderStat{min-width:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;}
.profileHeaderStat b{display:block;font-size:19px;line-height:1.1;font-weight:800;}
.profileHeaderStat span{display:block;color:var(--muted);font-size:11px;line-height:1.2;margin-top:5px;white-space:nowrap;}
.profileTopTools{position:absolute;right:0;top:-30px;z-index:6;}
.profileCard .profileBody>h1{margin-top:8px;}

/* Conversa ocupa a tela inteira e nao cria faixa lateral/overflow */
.conversationScreen{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;margin:0;padding:env(safe-area-inset-top) 0 calc(74px + env(safe-area-inset-bottom));background:linear-gradient(rgba(4,18,28,.42),rgba(4,18,28,.78)),url("mantiqueira-hero.jpg") center/cover;display:flex;flex-direction:column;overflow:hidden;z-index:10;}
.conversationHeader{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:10px 14px 9px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(5,21,31,.72);backdrop-filter:blur(12px);}
.conversationHeader .avatar{width:44px;height:44px;flex:0 0 44px;}
.conversationHeader .conversationName{min-width:0;flex:1;overflow:hidden;}
.conversationHeader .conversationName b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;}
.conversationHeader .iconBtn{width:36px;height:36px;min-width:36px;display:grid;place-items:center;border-radius:50%;}
.conversationBody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 14px 10px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;}
.conversationIntro{flex:0 0 auto;margin:0 auto 14px;width:min(100%,420px);text-align:center;background:rgba(8,31,44,.88);border:1px solid var(--line);border-radius:22px;padding:18px 14px;}
.conversationIntro .profileAvatar{width:78px;height:78px;margin:0 auto;border:3px solid var(--surface);}
.conversationIntro h2{margin:9px 0 4px;font-size:20px;}
.conversationIntro .profileActions{justify-content:center;margin:12px 0 0;}
.conversationMessages{display:flex;flex-direction:column;gap:8px;margin-top:auto;}
.conversationMessages .bubble{max-width:min(78%,420px);word-break:break-word;}
.conversationComposer{flex:0 0 auto;margin:0 10px 10px;padding:7px 8px;border:1px solid var(--line);border-radius:22px;background:rgba(5,21,31,.98);display:grid;grid-template-columns:30px minmax(0,1fr) 30px 30px 30px 38px 30px;gap:3px;align-items:center;min-width:0;box-shadow:0 6px 24px rgba(0,0,0,.22);}
.conversationComposer .iconBtn{width:30px;height:30px;min-width:0;padding:0;display:grid;place-items:center;font-size:17px;border-radius:50%;overflow:hidden;}
.conversationComposer .gifBtn{font-size:10px;font-weight:800;}
.conversationComposer input{width:100%;min-width:0;height:34px;padding:0 8px;background:transparent;border:0;color:white;outline:none;}
.conversationComposer input::placeholder{color:#8fa5b0;}
@media(max-width:390px){.conversationComposer{grid-template-columns:28px minmax(0,1fr) 28px 28px 28px 34px 28px;gap:2px;padding:6px;}.conversationComposer .iconBtn{width:28px;height:28px;font-size:16px}.conversationComposer input{font-size:14px;padding:0 5px;}.profileHeaderStats{left:104px;right:48px;}.profileHeaderStat span{font-size:10px;}}

/* Perfil: bloco de estatisticas centralizado entre avatar e engrenagem */
.profileHeaderRow{position:relative!important;display:block!important;min-height:118px!important;}
.profileHeaderRow>.profileAvatarRing{position:relative!important;display:block!important;margin:-46px 0 0!important;z-index:5!important;}
.profileHeaderStats{position:absolute!important;left:108px!important;right:54px!important;top:4px!important;width:auto!important;height:76px!important;display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;align-items:center!important;gap:0!important;padding:0!important;text-align:center!important;z-index:4!important;}
.profileHeaderStat{min-width:0!important;width:100%!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;}
.profileHeaderStat b{font-size:20px!important;line-height:1.05!important;}
.profileHeaderStat span{font-size:11px!important;margin-top:5px!important;white-space:nowrap!important;}
.profileTopTools{position:absolute!important;right:0!important;top:-30px!important;z-index:6!important;}
.onlineDot{color:var(--muted);font-size:11px;}
.onlineDot.isOnline{color:var(--green);}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function avatar(name="CM"){return "https://ui-avatars.com/api/?name="+encodeURIComponent(name)+"&background=12384a&color=20df9a&bold=true"}
function profileData(){const m=me?.user_metadata||{};return{name:m.name||m.full_name||me?.email?.split("@")[0]||"Novo usuário",city:m.city||"Cidade não informada",bio:m.bio||"Ainda não adicionou uma descrição.",photo:m.photo||avatar(m.name||"Novo usuário"),cover:m.cover||"mantiqueira-hero.jpg",interests:m.interests||"",links:m.links||"",whatsapp:m.whatsapp||"",highlights:Array.isArray(m.highlights)?m.highlights:[],aboutPublic:m.aboutPublic!==false,showcaseEnabled:m.showcaseEnabled===true}}
function getPosts(){try{const v=JSON.parse(localStorage.getItem("cm_posts")||"[]");return Array.isArray(v)?v:[]}catch(_){return []}}
function savePosts(posts){localStorage.setItem("cm_posts",JSON.stringify(Array.isArray(posts)?posts:[]))}
function nav(active){return `<nav class="nav"><button class="${active==="home"?"active":""}" onclick="go('home')"><span class="nicon">⌂</span>Início</button><button class="${active==="chat"?"active":""}" onclick="go('chat')"><span class="nicon">◌</span>Bate-papo</button><button class="${active==="explore"?"active":""}" onclick="go('explore')"><span class="nicon">⌕</span>Explorar</button><button class="${active==="profile"?"active":""}" onclick="go('profile')"><span class="nicon">♙</span>Perfil</button></nav>`}
function screen(content,active){return `<main class="screen">${content}</main>${nav(active)}`}
function stories(){const all=getStories(),own=all.filter(s=>s.owner==="me"),others=all.filter(s=>s.owner!=="me");return `<div class="sectionHead"><h2>Status</h2><span class="link">24 horas</span></div><div class="stories"><div class="storyCircle" onclick="newStory()"><div class="storyRing storyAdd">+</div><div>Seu status</div></div>${own.length?`<div class="storyCircle" onclick="viewMyStory()"><div class="storyRing"><img src="${esc(own[0].image)}"></div><div>Seu status</div></div>`:""}${others.map(s=>`<div class="storyCircle" onclick="viewStoryData(${JSON.stringify(s).replace(/"/g,'&quot;')})"><div class="storyRing"><img src="${esc(s.photo)}"></div><div>${esc((s.name||'Usuário').split(' ')[0])}</div></div>`).join('')}</div>`}
function registeredCities(){const map=new Map();publicProfilesCache.forEach(p=>{const name=String(p.city||"").trim();if(!name)return;const key=cityKey(name);if(!key)return;const row=map.get(key)||{city:name,count:0};row.count++;map.set(key,row)});return [...map.values()].sort((a,b)=>b.count-a.count||a.city.localeCompare(b.city,"pt-BR"))}
function homeCityHtml(){const rows=registeredCities();if(!rows.length)return '<div class="empty">As cidades aparecerão aqui conforme as pessoas criarem seus perfis.</div>';return rows.slice(0,8).map((x,i)=>`<button class="city c${(i%4)+1}" onclick="go('people','${esc(x.city)}')">⌖ ${esc(x.city)}<small>${x.count} ${x.count===1?'pessoa':'pessoas'}</small></button>`).join("")}
function home(){const p=profileData();setTimeout(async()=>{await loadStories();const el=document.getElementById('homeStories');if(el)el.innerHTML=stories();},0);const realPeople=getPublicPeople().filter(x=>x.id!==me?.id&&x.photo).slice(0,12);return screen(`<div class="brand">Conecta <span>Mantiqueira</span></div><div class="heroTitle">Olá, ${esc(p.name)}! 👋</div><div class="sub">Que bom te ver por aqui!</div><div id="homeStories">${stories()}</div><input id="homePeopleSearch" class="search" placeholder="⌕  Buscar pessoas, cidades, interesses..." oninput="filterPeopleLive(this.value)" autocomplete="off"><div id="homeSearchResults"></div><div class="grid4"><button class="quick" onclick="go('people')"><div class="ico">♙</div><small>Pessoas<br>da região</small></button><button class="quick" onclick="go('groups')"><div class="ico">♧</div><small>Grupos<br>da região</small></button><button class="quick" onclick="go('business')"><div class="ico">⌂</div><small>Comércios<br>e serviços</small></button><button class="quick" onclick="go('business')"><div class="ico">★</div><small>Divulgue<br>seu negócio</small></button></div><div class="sectionHead"><h2>Pessoas por cidade</h2><button class="link" onclick="citySearch()">Pesquisar cidades</button></div><div class="cityGrid">${homeCityHtml()}</div><div class="sectionHead"><h2>Pessoas da região</h2></div><div class="peopleRow">${realPeople.length?realPeople.map(p=>`<div class="personMini" onclick="publicProfile('${esc(p.id)}')"><img class="avatar" src="${esc(p.photo)}"><small>${esc(p.name.split(" ")[0])}<br>${esc(p.city||"")}</small></div>`).join(""):"<div class='empty'>Ainda não há outros perfis cadastrados. Conforme as pessoas criarem suas contas, elas aparecerão aqui.</div>"}</div><div class="sectionHead"><h2>Grupos da região</h2><button class="link" onclick="go('groups')">Ver todos</button></div>${groupPreview()}</div>`,'home')}

function normText(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function cityKey(v){return normText(v).replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim()}
function peopleMatch(p,q){const raw=String(q||"").trim();if(!raw)return true;const key=cityKey(raw);if(key&&cityKey(p.city||"")===key)return true;return normText((p.name||"")+" "+(p.city||"")+" "+(p.bio||"")).includes(normText(raw))}
function filterPeopleLive(v){const q=normText((v||"").trim());const el=document.getElementById("homeSearchResults");if(!el)return;if(q.length<2){el.innerHTML="";return}const all=getPublicPeople().filter(p=>p.id!==me?.id);const list=all.filter(p=>peopleMatch(p,q));const cityMatches=cities.filter(c=>normText(c).includes(q)).slice(0,8);el.innerHTML=(cityMatches.length?`<div class="card" style="padding:10px;margin:0 0 10px"><b>Cidades encontradas</b>${renderCityButtons(cityMatches)}</div>`:"")+`<div class="list">${renderPeopleList(list,q)}</div>`}
function filterPeopleResults(v){const q=normText((v||"").trim());currentCity=(v||"").trim();const listBox=document.getElementById("peopleResults");const cityBox=document.getElementById("peopleCityResults");if(!listBox)return;const all=getPublicPeople().filter(p=>p.id!==me?.id);const list=all.filter(p=>peopleMatch(p,q));const cityMatches=q?cities.filter(c=>normText(c).includes(q)).slice(0,12):[];if(cityBox)cityBox.innerHTML=cityMatches.length?`<div class="small" style="margin:8px 0">Cidades encontradas</div>${renderCityButtons(cityMatches)}`:"";listBox.innerHTML=renderPeopleList(list,q)}
function renderPeopleList(list,q){return list.length?list.map(p=>`<div class="person" onclick="publicProfile('${p.id}')"><img class="avatar" src="${esc(p.photo)}"><div class="personInfo"><b>${esc(p.name)}</b><span>${esc(p.city)}</span><span class="onlineDot ${isOnline(p.id)?"isOnline":""}" data-online-user="${p.id}">${isOnline(p.id)?"● Online agora":"○ Offline"}</span></div><button class="followBtn ${isFollowing(p.id)?"following":""}" onclick="event.stopPropagation();toggleFollow('${p.id}')">${isFollowing(p.id)?"Seguindo":"Seguir"}</button></div>`).join(""):"<div class='empty'>Não encontrei pessoas nessa cidade ou busca. Assim que pessoas se cadastrarem com essa cidade, elas aparecerão aqui.</div>"}
/* NOTA PRIVACIDADE: o campo whatsapp e lido para todos os usuarios logados. O ideal e restringir no Supabase (RLS ou view) para expor so a quem o dono permitir. */
async function loadPublicProfiles(){try{let r=await sb.from("profiles").select("id,name,city,bio,photo,cover,interests,links,whatsapp,showcaseEnabled,created_at").limit(1000);if(r.error)r=await sb.from("profiles").select("id,name,city,bio,photo,cover,interests,links,showcaseEnabled,created_at").limit(1000);if(!r.error&&Array.isArray(r.data))publicProfilesCache=r.data}catch(_){} }
function getPublicPeople(){const myId=me?.id||"";let list=[...publicProfilesCache].filter(p=>p?.id&&p.id!==myId);const myCity=normText(profileData().city||"");list.sort((a,b)=>{const ac=normText(a.city||"")===myCity?0:1,bc=normText(b.city||"")===myCity?0:1;if(ac!==bc)return ac-bc;return new Date(b.created_at||0)-new Date(a.created_at||0)});const seen=new Set();return list.filter(p=>{if(!p?.id||p.id===myId||seen.has(p.id))return false;seen.add(p.id);p.photo=p.photo||avatar(p.name||"Novo usuário");return true})}
function isFollowing(id){return followCache.has(id)}
async function loadFollowState(){if(!me?.id)return;try{const {data,error}=await sb.from("follows").select("following_id").eq("follower_id",me.id);if(!error)followCache=new Set((data||[]).map(x=>x.following_id))}catch(_){} }
async function toggleFollow(id){if(!me?.id||!id||id===me.id)return;try{if(followCache.has(id)){const {error}=await sb.from("follows").delete().eq("follower_id",me.id).eq("following_id",id);if(error)throw error;followCache.delete(id)}else{const {error}=await sb.from("follows").insert({follower_id:me.id,following_id:id});if(error)throw error;followCache.add(id)}if(currentPublicUser?.id===id)go("publicProfile");else {const q=currentCity;go("people",q)}}catch(e){alert(e.message||"Não foi possível atualizar o seguir agora.")}} 
async function followCounts(id){try{const [a,b]=await Promise.all([sb.from("follows").select("id",{count:"exact",head:true}).eq("following_id",id),sb.from("follows").select("id",{count:"exact",head:true}).eq("follower_id",id)]);return {followers:a.count||0,following:b.count||0}}catch(_){return {followers:0,following:0}}}
async function people(query=""){currentCity=query;await loadPublicProfiles();const q=String(query||"");const all=getPublicPeople();const list=all.filter(p=>peopleMatch(p,q));const cityMatches=q?cities.filter(c=>normText(c).includes(normText(q))).slice(0,12):[];return screen(`<button class="ghost" onclick="go('home')">← Voltar</button><h1>${q?`Pessoas em ${esc(q)}`:"Pessoas da região"}</h1><div class="sub">Digite a cidade ou o nome completo. Você verá outras pessoas cadastradas, nunca o seu próprio perfil.</div><input id="peopleSearch" class="search" value="${esc(q)}" placeholder="Pesquisar pessoa ou cidade" oninput="filterPeopleResults(this.value)" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false"><div id="peopleCityResults">${cityMatches.length?`<div class="small" style="margin:8px 0">Cidades encontradas</div>${renderCityButtons(cityMatches)}`:""}</div><div class="grid4" style="margin:12px 0"><button class="quick" onclick="go('people')">Todas</button><button class="quick" onclick="go('people','Sapucaí-Mirim')">Sapucaí</button><button class="quick" onclick="go('people','Santo Antônio do Pinhal')">Santo Antônio</button><button class="quick" onclick="go('people','São Bento do Sapucaí')">São Bento</button></div><div id="peopleResults" class="list">${renderPeopleList(list,q)}</div>`,'explore')}
function citySearch(){openModal(`<div class="modalHead"><h2>Pesquisar cidades</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Digite a cidade inteira ou apenas parte do nome. A lista não fecha enquanto você digita.</div><input id="citySearchInput" class="search" placeholder="Ex.: Campos do Jordão" oninput="filterCityModal(this.value)" autocomplete="off"><div id="citySearchList" class="citySearchList">${renderCityButtons(cities)}</div>`);setTimeout(()=>document.getElementById('citySearchInput')?.focus(),50)}
function renderCityButtons(list){return list.map(c=>`<button class="citySearchItem" onclick="closeModal();go('people','${esc(c)}')">⌖ ${esc(c)}</button>`).join("")||'<div class="empty">Nenhuma cidade encontrada.</div>'}
function filterCityModal(v){const q=normText((v||"").trim());const list=cities.filter(c=>normText(c).includes(q));const el=document.getElementById("citySearchList");if(el)el.innerHTML=renderCityButtons(list)}
function publicProfile(id){const p=getPublicPeople().find(x=>x.id===id);if(!p)return;currentPublicUser=p;go("publicProfile")}
function whatsappUrl(v){const n=String(v||'').replace(/\D/g,'');return n?'https://wa.me/'+(n.startsWith('55')?n:'55'+n):''}
function profileContactHtml(p){const w=whatsappUrl(p.whatsapp);return (w||p.links)?`<div class="profileContactButtons">${w?`<a class="profileContactBtn whatsappBtn" href="${w}" target="_blank" rel="noopener">💬 WhatsApp</a>`:''}${p.links?p.links.split('\n').filter(Boolean).map(x=>{const q=x.split('|');return `<a class="profileContactBtn" href="${esc(q[1]||q[0])}" target="_blank" rel="noopener">🔗 ${esc(q[0]||'Abrir link')}</a>`}).join(''):''}</div>`:''}
function publicProfileScreen(){const p=currentPublicUser;if(!p)return people();setTimeout(async()=>{const c=await followCounts(p.id);document.getElementById("publicFollowers")&&(document.getElementById("publicFollowers").textContent=c.followers);document.getElementById("publicFollowing")&&(document.getElementById("publicFollowing").textContent=c.following);},0);const aboutPublic=p.aboutPublic!==false;const about=aboutPublic?`<div class="card"><h3>Vitrine</h3><div id="publicShowcase" class="small">Produtos e serviços deste perfil.</div>${p.bio?`<p class="sub" style="margin-top:14px">${esc(p.bio)}</p>`:''}${p.interests?`<p><b>Interesses:</b><br>${p.interests.split(',').map(x=>`<span class="pill">${esc(x.trim())}</span>`).join(' ')}</p>`:''}${profileContactHtml(p)}</div>`:`<div class="aboutPrivate">🔒 Este perfil optou por manter as informações da seção Vitrine privadas.</div>`;return screen(`<button class="ghost" onclick="go('people')">← Voltar</button><div class="card profileCard"><div class="profileCover" style="background-image:url('${esc(p.cover||'mantiqueira-hero.jpg')}')"></div><div class="profileBody"><img class="profileAvatar" src="${esc(p.photo||avatar(p.name))}"><h1>${esc(p.name)}</h1><div class="sub">⌾ ${esc(p.city)}</div><p class="sub">${esc(p.bio||'Pessoa da região conectada à Mantiqueira. 🌿')}</p><div class="profileActions"><button class="followBtn ${isFollowing(p.id)?"following":""}" onclick="toggleFollow('${p.id}')">${isFollowing(p.id)?"Seguindo ✓":"Seguir"}</button><button class="secondary" onclick="go('conversation')">Mensagem</button></div><div class="stats"><div><b id="publicFollowers">0</b><span>Seguidores</span></div><div><b id="publicFollowing">0</b><span>Seguindo</span></div><div><b>${isFollowing(p.id)?"Seguindo":""}</b><span>Status</span></div></div><div class="tabs"><button class="tab active">Publicações</button><button class="tab">Fotos</button><button class="tab">Sobre</button></div><div class="empty">Ainda não há publicações.</div>${about}</div></div>`,'explore')}
function explore(){return screen(`<h1>Explorar</h1><div class="grid4" style="margin:18px 0"><button class="quick" style="background:var(--green);color:#052018">Feed</button><button class="quick" onclick="go('news')">📰 Notícias</button><button class="quick" onclick="go('groups')">Grupos</button><button class="quick" onclick="go('business')">Comércios</button></div><div class="sectionHead"><h2>Feed da região</h2><button class="link" onclick="newPost()">＋ Publicar</button></div><div class="sub">O Feed mostra somente publicações feitas por pessoas cadastradas no Conecta Mantiqueira. Notícias ficam em uma área própria e nunca se misturam com as publicações.</div><div id="feed"></div>`,'explore')}
function newsScreen(){return screen(`<button class="ghost" onclick="go('explore')">← Voltar</button><h1>📰 Notícias da Mantiqueira</h1><div class="sub">Notícias ficam separadas do Feed. Puxe a tela para baixo para buscar matérias novas.</div><div id="newsPull" class="newsPull">Solte para atualizar notícias ↓</div><div class="newsRefresh"><span id="newsStatus">Atualizando notícias...</span><button class="newsRefreshBtn" onclick="refreshNews(true)">↻ Atualizar</button></div><div id="newsList" class="newsSeparate"></div><div class="small">As manchetes são buscadas em fontes públicas de notícias da região. A matéria completa permanece na fonte original.</div>`,'explore')}
function renderFeed(){const el=document.getElementById("feed");if(!el)return;const all=getPosts();if(!all.length){el.innerHTML='<div class="empty">Ainda não há publicações reais. Seja o primeiro a publicar! 📸</div>';return}el.innerHTML=all.slice().reverse().map(p=>{const media=p.image?(p.type==='video'?`<video src="${esc(p.image)}" controls playsinline preload="metadata" style="width:100%;max-height:72vh;border-radius:16px;background:#000"></video>`:`<img src="${esc(p.image)}" loading="lazy">`):"";return `<article class="card post"><div class="postTop"><img class="avatar" src="${p.photo||avatar(p.name)}"><div><b>${esc(p.name)}</b><span>${esc(p.city||"Mantiqueira")} • agora</span></div></div>${p.text?`<p>${esc(p.text)}</p>`:""}${media}<div class="postActions"><button class="action" onclick="likePost('${p.id}')">♥ ${p.likes||0}</button><button class="action" onclick="commentPost('${p.id}')">💬 Comentar</button><button class="action" onclick="sharePost('${p.id}')">↗ Compartilhar</button></div><div class="commentList">${getComments(p.id).map(c=>`<div class="commentItem"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`).join()}</div></article>`}).join("")}
function newPost(){openModal(`<div class="modalHead"><h2>Nova publicação</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Publique uma foto e uma descrição, como no Instagram.</div><textarea id="postText" class="textarea" placeholder="Escreva uma legenda..."></textarea><input id="postFile" class="fileInput" type="file" accept="image/*,video/*"><input id="postImage" class="field" placeholder="Ou cole o link de uma foto"><button class="primary" onclick="saveNewPost()">Publicar agora</button>`)}
async function saveNewPost(){try{const p=profileData(),file=document.getElementById("postFile").files[0],text=document.getElementById("postText").value.trim(),url=document.getElementById("postImage").value.trim();if(!text&&!file&&!url)return alert("Adicione uma foto ou escreva alguma coisa.");const image=file?await uploadMedia(file,'posts','post'):url;const a=getPosts();a.push({id:Date.now().toString(),ownerId:me?.id||'',name:p.name,city:p.city,photo:p.photo,text,image,type:file?.type?.startsWith('video/')?'video':'image',likes:0,created:Date.now()});savePosts(a);closeModal();go('explore')}catch(e){alert(e.message||'Não foi possível publicar a mídia.')}}
function likePost(id){const a=getPosts(),p=a.find(x=>x.id===id);if(p)p.likes=(p.likes||0)+1;savePosts(a);renderFeed()}
function commentPost(id){const c=prompt("Digite seu comentário:");if(!c)return;const a=getComments(id);const p=profileData();a.push({id:Date.now().toString(),name:p.name,text:c,created:Date.now()});localStorage.setItem("cm_comments_"+id,JSON.stringify(a));if(document.getElementById("profilePages"))go("profile");else renderFeed()}
function sharePost(id){const url=location.href+"#post-"+id;if(navigator.share)navigator.share({title:"Conecta Mantiqueira",text:"Confira esta publicação no Conecta Mantiqueira",url});else{navigator.clipboard?.writeText(url);alert("Link da publicação copiado para compartilhar.")}}
function businessScreen(){return screen(`<h1>Comércios e serviços</h1><div class="sub">Descubra negócios reais da Mantiqueira e encontre clientes na região.</div><div class="businessHero"><b style="font-size:18px">Tem um negócio na Mantiqueira?</b><div class="sub" style="margin-top:6px">Crie sua vitrine, apareça nas buscas e coloque sua empresa em destaque para quem está perto.</div><button class="primary" onclick="newBusiness()">＋ Criar meu comércio</button></div><div class="sectionHead"><h2>Negócios em destaque</h2></div>${business.length?`<div class="card">${business.map(b=>`<div class="business"><img src="${b[3]}"><div class="businessInfo"><b>${esc(b[0])}</b><span>${esc(b[1])}</span><div class="stars">★ ${esc(b[2])}</div><a class="businessLink" href="${esc(b[4])}" target="_blank" rel="noopener">Ver comércio ↗</a></div></div>`).join("")}</div>`:`<div class="businessEmpty">Ainda não há negócios em destaque. Os comércios aparecerão aqui conforme os proprietários criarem seus perfis.</div>`}<div class="sectionHead"><h2>Divulgue seu negócio</h2></div><div class="planGrid"><div class="planCard"><b>Perfil Comercial</b><div class="planPrice">R$ 29,90 <span class="sub">/mês</span></div><ul><li>Perfil da empresa</li><li>Categoria e cidade</li><li>Fotos e informações</li><li>WhatsApp e links</li></ul><button class="secondary" style="width:100%" onclick="chooseBusinessPlan('Perfil Comercial','29,90')">Quero esse plano</button></div><div class="planCard featured"><span class="planBadge">MAIS VISIBILIDADE</span><b style="display:block;margin-top:10px">Empresa em Destaque</b><div class="planPrice">R$ 59,90 <span class="sub">/mês</span></div><ul><li>Tudo do Perfil Comercial</li><li>Destaque nas buscas</li><li>Posição privilegiada na região</li><li>Publicação promocional</li></ul><button class="primary" onclick="chooseBusinessPlan('Empresa em Destaque','59,90')">Quero esse plano</button></div><div class="planCard"><b>Presença Digital</b><div class="planPrice">R$ 99,90 <span class="sub">/mês</span></div><ul><li>Tudo do plano Destaque</li><li>Mais espaço para divulgação</li><li>Campanhas e ofertas</li><li>Prioridade comercial</li></ul><button class="secondary" style="width:100%" onclick="chooseBusinessPlan('Presença Digital','99,90')">Quero esse plano</button></div></div><a class="commerceLink" href="javascript:chooseBusinessPlan('Plano personalizado','')">Precisa de um pacote personalizado? Fale com a gente.</a>`,'explore')}
function newBusiness(){openModal(`<div class="modalHead"><h2>Criar meu comércio</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Cadastre os dados da sua empresa. A publicação e a cobrança serão ativadas quando conectarmos o sistema de pagamentos.</div><input id="bizName" class="field" placeholder="Nome do comércio"><input id="bizCity" class="field" placeholder="Cidade"><input id="bizCategory" class="field" placeholder="Categoria (ex.: restaurante, pousada, loja)"><input id="bizWhats" class="field" placeholder="WhatsApp"><input id="bizLink" class="field" placeholder="Instagram ou site"><textarea id="bizDesc" class="textarea" placeholder="Conte brevemente sobre seu negócio"></textarea><button class="primary" onclick="saveBusinessInterest()">Salvar dados do comércio</button></div>`)}
function saveBusinessInterest(){const name=document.getElementById('bizName')?.value.trim(),city=document.getElementById('bizCity')?.value.trim(),category=document.getElementById('bizCategory')?.value.trim();if(!name||!city||!category){alert('Preencha nome, cidade e categoria.');return}const a=JSON.parse(localStorage.getItem('cm_business_leads')||'[]');a.push({name,city,category,whatsapp:document.getElementById('bizWhats')?.value.trim(),link:document.getElementById('bizLink')?.value.trim(),description:document.getElementById('bizDesc')?.value.trim(),ownerId:me?.id||'',created:Date.now()});localStorage.setItem('cm_business_leads',JSON.stringify(a));closeModal();alert('Dados salvos. A ativação pública e o pagamento serão conectados na próxima etapa.')}
function chooseBusinessPlan(name,price){openModal(`<div class="modalHead"><h2>${esc(name)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">${price?'Plano de R$ '+price+' por mês.':''} O pagamento ainda será conectado na próxima etapa. Por enquanto, vamos registrar seu interesse.</div><input id="planContact" class="field" placeholder="WhatsApp ou e-mail para contato"><button class="primary" onclick="savePlanInterest('${esc(name)}','${esc(price)}')">Quero contratar</button><button class="secondary" style="width:100%;margin-top:8px" onclick="closeModal()">Voltar</button></div>`)}
function savePlanInterest(plan,price){const contact=document.getElementById('planContact')?.value.trim();if(!contact){alert('Informe um WhatsApp ou e-mail para contato.');return}const a=JSON.parse(localStorage.getItem('cm_plan_interests')||'[]');a.push({plan,price,contact,ownerId:me?.id||'',created:Date.now()});localStorage.setItem('cm_plan_interests',JSON.stringify(a));closeModal();alert('Interesse registrado. O pagamento será disponibilizado quando conectarmos a forma de cobrança.')}

function profile(){const p=profileData(),posts=getPosts().filter(x=>x.ownerId===me?.id || x.name===p.name),photos=posts.filter(x=>x.image),followingCount=followCache.size;setTimeout(async()=>{const c=await followCounts(me?.id);document.getElementById("profileFollowers")&&(document.getElementById("profileFollowers").textContent=c.followers);document.getElementById("profileFollowing")&&(document.getElementById("profileFollowing").textContent=c.following);if(p.showcaseEnabled){await loadVitrine(me.id);const el=document.getElementById("profileShowcase");if(el)el.innerHTML=showcaseHtml() }},0);return screen(`<h1>Meu perfil</h1><div class="card profileCard"><div class="profileCover" style="background-image:url('${esc(p.cover)}')"></div><div class="profileBody"><div class="profileHeaderRow"><div class="profileAvatarRing" onclick="newStory()" title="Adicionar status"><img class="profileAvatar" src="${esc(p.photo)}"></div><div class="profileHeaderStats"><div class="profileHeaderStat"><b>${posts.length}</b><span>Publicações</span></div><div class="profileHeaderStat"><b id="profileFollowers">0</b><span>Seguidores</span></div><div class="profileHeaderStat"><b id="profileFollowing">${followingCount}</b><span>Seguindo</span></div></div><div class="profileTopTools"><button class="profileMiniBtn" onclick="settingsScreen()" title="Configurações">⚙</button></div></div><h1>${esc(p.name)}</h1><div class="sub">⌾ ${esc(p.city)}</div><div class="profileBio">${esc(p.bio)}</div>${profileContactHtml(p)}<div class="highlightBar"><span class="highlightLabel">Destaques</span><div class="highlightRow compact"><div class="highlight"><div class="highlightCircle highlightAdd" onclick="addHighlight()">+</div></div>${p.highlights.map(h=>`<div class="highlight" onclick="viewHighlight(${JSON.stringify(h.images||[h.image]).replace(/"/g,"&quot;")},${JSON.stringify(h.name).replace(/"/g,"&quot;")})"><img class="highlightCircle" src="${esc(h.image)}"><div>${esc(h.name)}</div></div>`).join('')}</div><button class="publishMini" onclick="newPost()" title="Nova publicação">+</button></div><div class="profileActions"><button class="followBtn" onclick="editProfile()">Editar perfil</button></div><div class="tabs"><button class="tab active" onclick="profileTab(0)">Publicações</button><button class="tab" onclick="profileTab(1)">Fotos</button>${p.showcaseEnabled?`<button class="tab" onclick="profileTab(2)">Vitrine</button>`:''}</div><div id="profilePages" class="tabPages"><div class="tabPage">${posts.length?posts.slice().reverse().map(profilePostHtml).join(''):`<div class='empty'>Você ainda não publicou nada.</div>`}</div><div class="tabPage"><button class="photoAdd" onclick="newPhoto()">＋ Publicar nova foto</button>${photos.length?`<div class="photoGrid">${photos.map(x=>`<img src="${esc(x.image)}" onclick="openImage('${encodeURIComponent(x.image)}')">`).join('')}</div>`:`<div class='empty'>Suas fotos aparecerão aqui.</div>`}</div>${p.showcaseEnabled?`<div class="tabPage"><div class="card"><div class="showcaseHead"><div><h3 style="margin:0">Vitrine</h3><div class="small">Produtos, serviços, preços e links</div></div><button class="publishMini" onclick="newProduct()" title="Adicionar produto">+</button></div><div id="profileShowcase">${showcaseHtml()}</div></div></div>`:''}</div></div></div>`,'profile')}

function getProducts(){return Array.isArray(vitrineCache)?vitrineCache:[]}
async function loadVitrine(userId=me?.id){if(!userId)return [];try{const {data,error}=await sb.from("vitrine_items").select("id,user_id,name,description,price,promo_price,image_url,link_url,item_type,active,position,created_at").eq("user_id",userId).order("position",{ascending:true}).order("created_at",{ascending:false});if(error)throw error;vitrineCache=data||[];return vitrineCache}catch(_){vitrineCache=[];return []}}
async function saveVitrineItem(item){const {data,error}=await sb.from("vitrine_items").insert(item).select().single();if(error)throw error;return data}
async function updateVitrineItem(id,patch){const {data,error}=await sb.from("vitrine_items").update(patch).eq("id",id).eq("user_id",me.id).select().single();if(error)throw error;return data}
function moneyBR(v){const n=Number(String(v||'').replace(',','.'));return Number.isFinite(n)?n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):''}
function showcaseHtml(){const a=getProducts();if(!a.length)return `<div class="empty"><div style="font-size:38px">🛍️</div><b>Monte sua vitrine</b><div class="small">Adicione fotos dos seus produtos ou serviços, coloque os preços e, se quiser, um link para sua loja.</div><button class="photoAdd" style="margin-top:14px" onclick="newProduct()">＋ Adicionar produto</button></div>`;return `<div class="productGrid">${a.map((x,i)=>`<article class="productCard"><div class="productImageWrap">${x.image?`<img src="${esc(x.image)}" alt="${esc(x.name)}" onclick="openImage('${encodeURIComponent(x.image)}')">`:`<div class="productNoImage">🛍️</div>`}${x.promo?`<span class="productBadge">Oferta</span>`:''}</div><div class="productInfo"><b>${esc(x.name)}</b>${x.description?`<div class="small productDesc">${esc(x.description)}</div>`:''}<div class="productPrice">${esc(moneyBR(x.promo||x.price))}${x.promo&&x.price?` <del>${esc(moneyBR(x.price))}</del>`:''}</div>${x.link?`<a class="linkBtn productLink" href="${esc(x.link)}" target="_blank" rel="noopener">🔗 Ver produto / loja</a>`:''}<div class="productOwnerActions"><button class="action" onclick="editProduct(${i})">Editar</button><button class="action" onclick="deleteProduct(${i})">Excluir</button></div></div></article>`).join('')}</div>`}
function newProduct(){openModal(`<div class="modalHead"><h2>Adicionar à vitrine</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Coloque uma foto, nome, preço e, se quiser, o link do produto ou da sua loja.</div><input id="productFile" class="hidden" type="file" accept="image/*" onchange="previewProductImage(this)"><div id="productPreview" class="productPreview"><div class="productNoImage">🛍️</div></div><button class="photoAdd" type="button" onclick="document.getElementById('productFile').click()">🖼 Escolher foto da galeria</button><input id="productName" class="field" placeholder="Nome do produto ou serviço"><input id="productPrice" class="field" inputmode="decimal" placeholder="Preço (ex.: 79,90)"><input id="productPromo" class="field" inputmode="decimal" placeholder="Preço promocional (opcional)"><textarea id="productDesc" class="textarea" placeholder="Descrição curta (opcional)"></textarea><input id="productLink" class="field" placeholder="Link da loja, produto ou WhatsApp (opcional)"><button class="primary" onclick="saveProduct()">Adicionar à vitrine</button>`)}
function previewProductImage(input){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{const el=document.getElementById('productPreview');if(el)el.innerHTML=`<img src="${r.result}" alt="Prévia">`};r.readAsDataURL(f)}
async function saveProduct(){try{const name=document.getElementById('productName')?.value.trim(),price=document.getElementById('productPrice')?.value.trim(),promo=document.getElementById('productPromo')?.value.trim(),desc=document.getElementById('productDesc')?.value.trim(),link=document.getElementById('productLink')?.value.trim(),file=document.getElementById('productFile')?.files?.[0];if(!name||!price)return alert('Informe pelo menos o nome e o preço.');let image='';if(file)image=await uploadMedia(file,'products','product');await saveVitrineItem({user_id:me.id,name,price:Number(String(price).replace(',','.')),promo_price:promo?Number(String(promo).replace(',','.')):null,description:desc,image_url:image,link_url:link,item_type:'produto',active:true,position:getProducts().length});await loadVitrine(me.id);closeModal();go('profile');setTimeout(()=>profileTab(2),50)}catch(e){alert(e.message||'Não foi possível adicionar o produto.')}}
function editProduct(i){const x=getProducts()[i];if(!x)return;openModal(`<div class="modalHead"><h2>Editar produto</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Atualize as informações da sua vitrine.</div><input id="productFile" class="hidden" type="file" accept="image/*"><input id="productName" class="field" value="${esc(x.name)}" placeholder="Nome do produto ou serviço"><input id="productPrice" class="field" value="${esc(x.price??'')}" placeholder="Preço"><input id="productPromo" class="field" value="${esc(x.promo_price??'')}" placeholder="Preço promocional (opcional)"><textarea id="productDesc" class="textarea" placeholder="Descrição">${esc(x.description||'')}</textarea><input id="productLink" class="field" value="${esc(x.link_url||'')}" placeholder="Link da loja, produto ou WhatsApp"><button class="primary" onclick="updateProduct(${i})">Salvar produto</button>`)}
async function updateProduct(i){try{const a=getProducts(),x=a[i],file=document.getElementById('productFile')?.files?.[0];if(!x)return;const patch={name:document.getElementById('productName').value.trim(),price:Number(String(document.getElementById('productPrice').value.trim()).replace(',','.')),promo_price:document.getElementById('productPromo').value.trim()?Number(String(document.getElementById('productPromo').value.trim()).replace(',','.')):null,description:document.getElementById('productDesc').value.trim(),link_url:document.getElementById('productLink').value.trim()};if(file)patch.image_url=await uploadMedia(file,'products','product');if(!patch.name||!patch.price)return alert('Informe nome e preço.');await updateVitrineItem(x.id,patch);await loadVitrine(me.id);closeModal();go('profile');setTimeout(()=>profileTab(2),50)}catch(e){alert(e.message||'Não foi possível salvar o produto.')}}
async function deleteProduct(i){if(!confirm('Excluir este item da sua vitrine?'))return;try{const x=getProducts()[i];if(!x)return;const {error}=await sb.from('vitrine_items').delete().eq('id',x.id).eq('user_id',me.id);if(error)throw error;await loadVitrine(me.id);go('profile');setTimeout(()=>profileTab(2),50)}catch(e){alert(e.message||'Não foi possível excluir o item.')}}
function profilePostHtml(x){const comments=getComments(x.id);return `<article class="card post photoPost"><div class="postTop"><img class="avatar" src="${esc(x.photo||avatar(x.name))}"><div><b>${esc(x.name)}</b><span>${esc(x.city||'Mantiqueira')} • publicação</span></div></div>${x.text?`<p>${esc(x.text)}</p>`:""}${x.image?`<img src="${esc(x.image)}">`:''}<div class="postActions"><button class="action ${x.likedByMe?'liked':''}" onclick="likeProfilePost('${x.id}')">♥ ${x.likes||0}</button><button class="action" onclick="commentPost('${x.id}')">💬 Comentar</button><button class="action" onclick="sharePost('${x.id}')">↗ Compartilhar</button></div><div class="commentList">${comments.map(c=>`<div class="commentItem"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`).join('')}</div></article>`}
function getComments(id){return JSON.parse(localStorage.getItem('cm_comments_'+id)||'[]')}
function likeProfilePost(id){const a=getPosts(),p=a.find(x=>x.id===id);if(!p)return;p.likes=(p.likes||0)+1;savePosts(a);go('profile')}
function newPhoto(){openModal(`<div class="modalHead"><h2>Nova foto</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Escolha uma foto da galeria e publique no seu perfil.</div><input id="photoFile" class="fileInput" type="file" accept="image/*,video/*"><textarea id="photoText" class="textarea" placeholder="Escreva uma legenda, se quiser..."></textarea><button class="primary" onclick="saveNewPhoto()">Publicar foto</button>`)}
async function saveNewPhoto(){try{const file=document.getElementById('photoFile')?.files?.[0];if(!file)return alert('Escolha uma foto.');const p=profileData(),a=getPosts();a.push({id:Date.now().toString(),ownerId:me?.id||'',name:p.name,city:p.city,photo:p.photo,text:document.getElementById('photoText').value.trim(),image:await uploadMedia(file,'photos','post'),type:file.type.startsWith('video/')?'video':'image',likes:0,created:Date.now()});savePosts(a);closeModal();go('profile');setTimeout(()=>profileTab(1),50)}catch(e){alert(e.message||'Não foi possível publicar a foto.')}}
function editProfile(){const p=profileData();openModal(`<div class="modalHead"><h2>Editar perfil</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Altere suas informações e escolha suas próprias fotos, como no Instagram.</div><div class="editMediaGrid"><div class="editMediaCard"><div class="editMediaPreview"><img id="editPhotoPreview" src="${esc(p.photo)}" onerror="this.src=avatar('${esc(p.name)}')"></div><b>Foto de perfil</b><small>Escolha uma foto da galeria para usar no seu perfil.</small><button class="photoAdd" type="button" onclick="document.getElementById('editPhotoFile').click()">🖼 Escolher da galeria</button><input id="editPhotoFile" class="hidden" type="file" accept="image/*" onchange="previewProfilePhoto(this)"></div><div class="editMediaCard"><div class="editMediaPreview editCoverPreview"><img id="editCoverPreview" src="${esc(p.cover)}" onerror="this.src='mantiqueira-hero.jpg'"></div><b>Cenário de fundo</b><small>Escolha a imagem que ficará atrás da sua foto de perfil.</small><button class="photoAdd" type="button" onclick="document.getElementById('editCoverFile').click()">🌄 Escolher da galeria</button><input id="editCoverFile" class="hidden" type="file" accept="image/*" onchange="previewProfileCover(this)"></div></div><input id="editName" class="field" placeholder="Nome" value="${esc(p.name)}"><input id="editCity" class="field" placeholder="Cidade" value="${esc(p.city)}"><input id="editPhoto" class="field" placeholder="Ou cole um link da foto de perfil" value="${esc(p.photo)}"><input id="editCover" class="field" placeholder="Ou cole um link da foto de capa" value="${esc(p.cover)}"><textarea id="editBio" class="textarea" placeholder="Sua bio">${esc(p.bio)}</textarea><div class="optionalContact"><b>Contato no perfil (opcional)</b><small>Se quiser, adicione seu WhatsApp ou um link. Nada aparece no perfil se você deixar vazio.</small><input id="editWhatsapp" class="field" inputmode="tel" placeholder="WhatsApp (opcional)" value async function previewProfilePhoto(input){const file=input?.files?.[0];if(!file)return;try{const blob=await imageBlobFromFile(file,'avatar');const data=await blobToData(blob);const img=document.getElementById('editPhotoPreview');if(img)img.src=data;const field=document.getElementById('editPhoto');if(field)field.value='__LOCAL_MEDIA__'}catch(e){alert('Não foi possível preparar essa foto.')}}

async function saveProfile(){try{const photoField=document.getElementById('editPhoto').value.trim(),coverField=document.getElementById('editCover').value.trim();const photoFile=document.getElementById('editPhotoFile')?.files?.[0],coverFile=document.getElementById('editCoverFile')?.files?.[0];const photo=photoFile?await uploadMedia(photoFile,'profiles','avatar'):(photoField==='__LOCAL_MEDIA__'?profileData().photo:(photoField||avatar(document.getElementById('editName').value)));const cover=coverFile?await uploadMedia(coverFile,'covers','cover'):(coverField==='__LOCAL_MEDIA__'?profileData().cover:(coverField||'mantiqueira-hero.jpg'));const meta={...(me?.user_metadata||{}),name:document.getElementById('editName').value.trim(),city:document.getElementById('editCity').value.trim(),photo,cover,bio:document.getElementById('editBio').value.trim(),interests:document.getElementById('editInterests').value.trim(),links:document.getElementById('editLinks').value.trim(),whatsapp:document.getElementById('editWhatsapp')?.value.trim()||'',aboutPublic:document.getElementById('aboutPublicSwitch').classList.contains('on'),showcaseEnabled:document.getElementById('showcaseSwitch')?.classList.contains('on')===true};const {data,error}=await sb.auth.updateUser({data:meta});if(error)throw error;me=data.user;try{await sb.from('profiles').upsert({id:me.id,name:meta.name,city:meta.city,photo:meta.photo,cover:meta.cover,bio:meta.bio,interests:meta.interests,links:meta.links,whatsapp:meta.whatsapp,aboutPublic:meta.aboutPublic},{onConflict:'id'})}catch(_){}closeModal();go('profile')}catch(e){alert(e.message||'Não foi possível salvar o perfil.')}}
function viewHighlight(images,name){const arr=Array.isArray(images)?images:[images];const old=document.getElementById('highlightViewer');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div id="highlightViewer" class="storyViewer"><button class="storyClose" onclick="this.parentElement.remove()">×</button><div style="width:min(520px,100%);text-align:center"><img id="highlightViewerImg" src="${esc(arr[0])}" style="width:100%;max-height:72vh;object-fit:contain;border-radius:20px"><h3>${esc(name)}</h3><div class="storyToolsRow" style="justify-content:center">${arr.map((x,i)=>`<button class="storyTool" onclick="document.getElementById('highlightViewerImg').src='${esc(x)}'">${i+1}</button>`).join('')}</div></div></div>`)}
function addHighlight(){openModal(`<div class="modalHead"><h2>Novo destaque</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Dê um nome ao destaque e escolha quantas fotos quiser da galeria.</div><input id="highlightName" class="field" placeholder="Nome do destaque" maxlength="24"><button class="photoAdd" onclick="document.getElementById('highlightFiles').click()">🖼 Selecionar fotos da galeria</button><input id="highlightFiles" class="hidden" type="file" accept="image/*" multiple onchange="previewHighlightFiles(this)"><div id="highlightFileInfo" class="small">Nenhuma foto escolhida</div><div id="highlightPreview" class="photoGrid" style="margin-top:10px"></div><button class="primary" onclick="saveHighlight()">Salvar destaque</button>`)}
