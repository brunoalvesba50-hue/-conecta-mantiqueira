function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function avatar(name="CM"){return "https://ui-avatars.com/api/?name="+encodeURIComponent(name)+"&background=12384a&color=20df9a&bold=true"}
function profileData(){const m=me?.user_metadata||{};return{name:m.name||m.full_name||me?.email?.split("@")[0]||"Novo usuário",city:m.city||"Cidade não informada",bio:m.bio||"Ainda não adicionou uma descrição.",photo:m.photo||avatar(m.name||"Novo usuário"),cover:m.cover||"mantiqueira-hero.jpg",interests:m.interests||"",links:m.links||"",highlights:Array.isArray(m.highlights)?m.highlights:[]}}
function nav(active){return `<nav class="nav"><button class="${active==="home"?"active":""}" onclick="go('home')"><span class="nicon">⌂</span>Início</button><button class="${active==="chat"?"active":""}" onclick="go('chat')"><span class="nicon">◌</span>Bate-papo</button><button class="${active==="explore"?"active":""}" onclick="go('explore')"><span class="nicon">⌕</span>Explorar</button><button class="${active==="profile"?"active":""}" onclick="go('profile')"><span class="nicon">♙</span>Perfil</button></nav>`}
function screen(content,active){return `<main class="screen">${content}</main>${nav(active)}`}
function stories(){const own=getStories().filter(s=>s.owner==="me");return `<div class="sectionHead"><h2>Status</h2><span class="link">24 horas</span></div><div class="stories"><div class="storyCircle" onclick="newStory()"><div class="storyRing storyAdd">+</div><div>Seu status</div></div>${own.length?`<div class="storyCircle" onclick="viewMyStory()"><div class="storyRing"><img src="${own[0].image}"></div><div>Seu status</div></div>`:""}${demoPeople.map(p=>`<div class="storyCircle" onclick="viewStory('${p.id}','${encodeURIComponent(p.name)}','${p.photo}')"><div class="storyRing"><img src="${p.photo}"></div><div>${p.name.split(" ")[0]}</div></div>`).join("")}</div>`}
function home(){const p=profileData();return screen(`<div class="brand">Conecta <span>Mantiqueira</span></div><div class="heroTitle">Olá, ${esc(p.name)}! 👋</div><div class="sub">Que bom te ver por aqui!</div>${stories()}<input class="search" placeholder="⌕  Buscar pessoas, cidades, interesses..." oninput="filterPeople(this.value)"><div class="grid4"><button class="quick" onclick="go('people')"><div class="ico">♙</div><small>Pessoas<br>da região</small></button><button class="quick" onclick="go('groups')"><div class="ico">♧</div><small>Grupos<br>da região</small></button><button class="quick" onclick="go('business')"><div class="ico">⌂</div><small>Comércios<br>e serviços</small></button><button class="quick" onclick="go('explore')"><div class="ico">•••</div><small>Mais</small></button></div><div class="sectionHead"><h2>Pessoas por cidade</h2><button class="link" onclick="citySearch()">Pesquisar cidades</button></div><div class="cityGrid"><button class="city c1" onclick="go('people','Sapucaí-Mirim')">⌖ Sapucaí-Mirim<small>Ver pessoas</small></button><button class="city c2" onclick="go('people','Santo Antônio do Pinhal')">⌖ Santo Antônio do Pinhal<small>Ver pessoas</small></button><button class="city c3" onclick="go('people','São Bento do Sapucaí')">⌖ São Bento do Sapucaí<small>Ver pessoas</small></button><button class="city c4" onclick="go('people','Paraisópolis')">⌖ Paraisópolis<small>Ver pessoas</small></button></div><div class="sectionHead"><h2>Perfis em destaque</h2></div><div class="peopleRow">${demoPeople.map(p=>`<div class="personMini" onclick="publicProfile('${p.id}')"><img class="avatar" src="${p.photo}"><small>${p.name.split(" ")[0]}<br>${p.city}</small></div>`).join("")}</div><div class="sectionHead"><h2>Grupos da região</h2><button class="link" onclick="go('groups')">Ver todos</button></div>${groupPreview()}</div>`,'home')}
function filterPeople(v){if(v.trim())go("people",v)}
function isFollowing(id){return JSON.parse(localStorage.getItem("cm_follows")||"[]").includes(id)}
function toggleFollow(id){let a=JSON.parse(localStorage.getItem("cm_follows")||"[]");a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem("cm_follows",JSON.stringify(a));if(currentPublicUser?.id===id)go("publicProfile");else go("people",currentCity)}
function people(query=""){currentCity=query;let list=demoPeople.filter(p=>(p.name+" "+p.city).toLowerCase().includes(query.toLowerCase()));return screen(`<button class="ghost" onclick="go('home')">← Voltar</button><h1>Pessoas ${query?`em ${esc(query)}`:"da região"}</h1><div class="sub">Clique em uma cidade para encontrar quem colocou essa cidade no perfil.</div><input class="search" value="${esc(query)}" placeholder="Pesquisar pessoa ou cidade" oninput="go('people',this.value)"><div class="grid4" style="margin:12px 0"><button class="quick" onclick="go('people')">Todas</button><button class="quick" onclick="go('people','Sapucaí-Mirim')">Sapucaí</button><button class="quick" onclick="go('people','Santo Antônio do Pinhal')">Santo Antônio</button><button class="quick" onclick="go('people','São Bento do Sapucaí')">São Bento</button></div><div class="list">${list.length?list.map(p=>`<div class="person" onclick="publicProfile('${p.id}')"><img class="avatar" src="${p.photo}"><div class="personInfo"><b>${p.name}</b><span>${p.city}</span><span class="online">● Online agora</span></div><button class="followBtn ${isFollowing(p.id)?"following":""}" onclick="event.stopPropagation();toggleFollow('${p.id}')">${isFollowing(p.id)?"Seguindo":"Seguir"}</button></div>`).join(""):"<div class='empty'>Ainda não há perfis de demonstração nessa cidade. Quando a base pública estiver ligada, esta lista será preenchida automaticamente.</div>"}</div>`,'explore')}
function citySearch(){const q=prompt("Pesquisar outra cidade da Mantiqueira:");if(!q)return;const found=cities.filter(c=>c.toLowerCase().includes(q.toLowerCase()));if(found.length===1)go('people',found[0]);else if(found.length)openModal(`<div class="modalHead"><h2>Cidades encontradas</h2><button class="close" onclick="closeModal()">×</button></div>${found.map(c=>`<button class="quick" style="width:100%;margin:5px 0" onclick="closeModal();go('people','${esc(c)}')">⌖ ${esc(c)}</button>`).join("")}`);else alert("Não encontrei essa cidade na lista inicial. Você pode procurar outra cidade no campo de pessoas.")}
function publicProfile(id){const p=demoPeople.find(x=>x.id===id);if(!p)return;currentPublicUser=p;go("publicProfile")}
function publicProfileScreen(){const p=currentPublicUser||demoPeople[0];return screen(`<button class="ghost" onclick="go('people')">← Voltar</button><div class="card profileCard"><div class="profileCover"></div><div class="profileBody"><img class="profileAvatar" src="${p.photo}"><h1>${esc(p.name)}</h1><div class="sub">⌾ ${esc(p.city)}</div><p class="sub">Pessoa da região conectada à Mantiqueira. 🌿</p><div class="profileActions"><button class="followBtn ${isFollowing(p.id)?"following":""}" onclick="toggleFollow('${p.id}')">${isFollowing(p.id)?"Seguindo ✓":"Seguir"}</button><button class="secondary" onclick="go('conversation')">Mensagem</button></div><div class="stats"><div><b>0</b><span>Fotos</span></div><div><b>${isFollowing(p.id)?1:0}</b><span>Amigos</span></div><div><b>0</b><span>Interesses</span></div></div><div class="tabs"><button class="tab active">Publicações</button><button class="tab">Fotos</button><button class="tab">Sobre</button></div><div class="empty">Ainda não há publicações.</div></div></div>`,'explore')}
function getPosts(){return JSON.parse(localStorage.getItem("cm_posts")||"[]")}
function savePosts(a){localStorage.setItem("cm_posts",JSON.stringify(a))}
function explore(){return screen(`<h1>Explorar</h1><div class="grid4" style="margin:18px 0"><button class="quick" style="background:var(--green);color:#052018">Feed</button><button class="quick" onclick="go('groups')">Grupos</button><button class="quick" onclick="go('business')">Comércios</button><button class="quick" onclick="newPost()">＋ Publicar</button></div><div class="sectionHead"><h2>Feed da região</h2><button class="link" onclick="newPost()">Publicar</button></div><div id="feed"></div><div class="sectionHead"><h2>📰 Últimas notícias da Mantiqueira</h2><span class="small">Atualizadas • fontes regionais</span></div><div class="sub">Veja as principais manchetes diretamente aqui no Conecta Mantiqueira. Toque em uma notícia para abrir a matéria completa na fonte original.</div>${news.map(n=>`<a class="news" href="${n.url}" target="_blank" rel="noopener"><img class="newsImage" src="${n.image}" alt="Imagem ilustrativa: ${esc(n.title)}" onerror="this.style.display='none'"><div class="newsBody"><div class="newsTop"><span class="newsSource">${esc(n.source)}</span><span class="newsDate">${esc(n.date)}</span></div><b>${esc(n.title)}</b><span class="newsSummary">${esc(n.summary)}</span><div class="newsMeta"><span>📍 ${esc(n.city)}</span><span class="newsRead">Ler matéria completa ↗</span></div></div></a>`).join("")}<div class="small" style="margin-top:12px">O Conecta Mantiqueira apresenta manchetes e resumos para facilitar a leitura. A matéria completa permanece na fonte original.</div>`,'explore')}
function renderFeed(){const el=document.getElementById("feed");if(!el)return;const all=getPosts();if(!all.length){el.innerHTML='<div class="empty">Ainda não há publicações reais. Seja o primeiro a publicar! 📸</div>';return}el.innerHTML=all.slice().reverse().map(p=>`<article class="card post"><div class="postTop"><img class="avatar" src="${p.photo||avatar(p.name)}"><div><b>${esc(p.name)}</b><span>${esc(p.city||"Mantiqueira")} • agora</span></div></div>${p.text?`<p>${esc(p.text)}</p>`:""}${p.image?`<img src="${p.image}">`:""}<div class="postActions"><button class="action" onclick="likePost('${p.id}')">♥ ${p.likes||0}</button><button class="action" onclick="commentPost('${p.id}')">💬 Comentar</button><button class="action" onclick="sharePost('${p.id}')">↗ Compartilhar</button></div></article>`).join("")}
function newPost(){openModal(`<div class="modalHead"><h2>Nova publicação</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Publique uma foto e uma descrição, como no Instagram.</div><textarea id="postText" class="textarea" placeholder="Escreva uma legenda..."></textarea><input id="postFile" class="fileInput" type="file" accept="image/*,video/*"><input id="postImage" class="field" placeholder="Ou cole o link de uma foto"><button class="primary" onclick="saveNewPost()">Publicar agora</button>`)}
async function saveNewPost(){const p=profileData(),file=document.getElementById("postFile").files[0],text=document.getElementById("postText").value.trim(),url=document.getElementById("postImage").value.trim();if(!text&&!file&&!url)return alert("Adicione uma foto ou escreva alguma coisa.");const image=file?await fileToData(file):url;const a=getPosts();a.push({id:Date.now().toString(),name:p.name,city:p.city,photo:p.photo,text,image,likes:0,created:Date.now()});savePosts(a);closeModal();go('explore')}
function likePost(id){const a=getPosts(),p=a.find(x=>x.id===id);if(p)p.likes=(p.likes||0)+1;savePosts(a);renderFeed()}
function commentPost(){const c=prompt("Digite seu comentário:");if(c)alert("Comentário registrado nesta versão local. A etapa de comentários públicos será ligada ao banco.")}
function sharePost(){if(navigator.share)navigator.share({title:"Conecta Mantiqueira",text:"Confira esta publicação no Conecta Mantiqueira"});else alert("Compartilhe o Conecta Mantiqueira com seus amigos.")}
function businessScreen(){return screen(`<h1>Comércios e serviços</h1><div class="sub">Descubra negócios da região, vitrines, produtos e links.</div><input class="search" placeholder="⌕ Buscar por nome ou categoria..."><button class="primary" onclick="newBusiness()">＋ Criar meu comércio</button><div class="sectionHead"><h2>Destaques da região</h2></div><div class="card">${business.map(b=>`<div class="business"><img src="${b[3]}"><div class="businessInfo"><b>${b[0]}</b><span>${b[1]}</span><div class="stars">★ ${b[2]}</div><a class="businessLink" href="${b[4]}" target="_blank">Ver comércio ↗</a></div></div>`).join("")}</div>`,'explore')}
function newBusiness(){alert("A vitrine de comércio já está preparada visualmente. A publicação pública dos comércios será ligada ao banco na próxima conexão de dados.")}
function profile(){const p=profileData(),posts=getPosts().filter(x=>x.name===p.name);return screen(`<h1>Meu perfil</h1><div class="card profileCard"><div class="profileCover" style="background-image:url('${esc(p.cover)}')"></div><div class="profileBody"><img class="profileAvatar" src="${esc(p.photo)}"><h1>${esc(p.name)}</h1><div class="sub">⌾ ${esc(p.city)}</div><p class="sub">${esc(p.bio)}</p><div class="highlightRow"><div class="highlight"><div class="highlightCircle highlightAdd" onclick="addHighlight()">+</div><div>Novo</div></div>${p.highlights.map(h=>`<div class="highlight"><img class="highlightCircle" src="${esc(h.image)}"><div>${esc(h.name)}</div></div>`).join("")}</div><div class="profileActions"><button class="followBtn" onclick="editProfile()">Editar perfil</button><button class="secondary" onclick="newStory()">＋ Status</button></div><div class="stats"><div><b>${posts.length}</b><span>Publicações</span></div><div><b>0</b><span>Amigos</span></div><div><b>${p.interests?p.interests.split(',').filter(Boolean).length:0}</b><span>Interesses</span></div></div><div class="tabs"><button class="tab active" onclick="profileTab(0)">Publicações</button><button class="tab" onclick="profileTab(1)">Fotos</button><button class="tab" onclick="profileTab(2)">Sobre</button></div><div id="profilePages" class="tabPages"><div class="tabPage">${posts.length?posts.slice().reverse().map(x=>`<article class="card post"><div class="postTop"><img class="avatar" src="${x.photo}"><div><b>${esc(x.name)}</b><span>${esc(x.city)}</span></div></div>${x.text?`<p>${esc(x.text)}</p>`:""}${x.image?`<img src="${x.image}">`:""}</article>`).join(""):"<div class='empty'>Você ainda não publicou nada.</div>"}</div><div class="tabPage">${posts.filter(x=>x.image).length?`<div class="photoGrid">${posts.filter(x=>x.image).map(x=>`<img src="${x.image}" onclick="openImage('${encodeURIComponent(x.image)}')">`).join("")}</div>`:"<div class='empty'>Suas fotos aparecerão aqui.</div>"}</div><div class="tabPage"><div class="card"><h3>Sobre</h3><p class="sub">${esc(p.bio)}</p>${p.interests?`<p><b>Interesses:</b><br>${p.interests.split(',').map(x=>`<span class="pill">${esc(x.trim())}</span>`).join('')}</p>`:""}${p.links?`<div><b>Links</b>${p.links.split('\n').filter(Boolean).map(x=>{const q=x.split('|');return `<a class="linkBtn" href="${esc(q[1]||q[0])}" target="_blank" rel="noopener">🔗 ${esc(q[0]||'Abrir link')}</a>`}).join('')}</div>`:""}</div></div></div></div></div><button class="ghost" onclick="logout()">Sair</button>`,'profile')}
function profileTab(i){const el=document.getElementById('profilePages');if(el)el.scrollTo({left:el.clientWidth*i,behavior:'smooth'});document.querySelectorAll('.tabs .tab').forEach((b,n)=>b.classList.toggle('active',n===i))}
function editProfile(){const p=profileData();openModal(`<div class="modalHead"><h2>Editar perfil</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Altere foto, capa, nome, cidade, bio, interesses, links e destaques.</div><input id="editName" class="field" placeholder="Nome" value="${esc(p.name)}"><input id="editCity" class="field" placeholder="Cidade" value="${esc(p.city)}"><input id="editPhoto" class="field" placeholder="Link da foto de perfil" value="${esc(p.photo)}"><input id="editCover" class="field" placeholder="Link da foto de capa" value="${esc(p.cover)}"><textarea id="editBio" class="textarea" placeholder="Sua bio">${esc(p.bio)}</textarea><input id="editInterests" class="field" placeholder="Interesses separados por vírgula" value="${esc(p.interests)}"><textarea id="editLinks" class="textarea" placeholder="Links, um por linha. Ex.: Minha loja|https://minhaloja.com">${esc(p.links)}</textarea><button class="primary" onclick="saveProfile()">Salvar alterações</button>`)}
async function saveProfile(){const meta={...(me?.user_metadata||{}),name:document.getElementById('editName').value.trim(),city:document.getElementById('editCity').value.trim(),photo:document.getElementById('editPhoto').value.trim()||avatar(document.getElementById('editName').value),cover:document.getElementById('editCover').value.trim()||'mantiqueira-hero.jpg',bio:document.getElementById('editBio').value.trim(),interests:document.getElementById('editInterests').value.trim(),links:document.getElementById('editLinks').value.trim()};const {data,error}=await sb.auth.updateUser({data:meta});if(error)return alert(error.message);me=data.user;closeModal();go('profile')}
function addHighlight(){const name=prompt('Nome do destaque:');if(!name)return;const image=prompt('Link da imagem do destaque:');if(!image)return;const p=profileData(),h=[...p.highlights,{name,image}];saveMeta({...p,highlights:h})}
async function saveMeta(obj){const meta={...(me?.user_metadata||{}),name:obj.name,city:obj.city,bio:obj.bio,photo:obj.photo,cover:obj.cover,interests:obj.interests,links:obj.links,highlights:obj.highlights};const {data,error}=await sb.auth.updateUser({data:meta});if(error)return alert(error.message);me=data.user;go('profile')}
function getStories(){const a=JSON.parse(localStorage.getItem('cm_stories')||'[]'),now=Date.now();const fresh=a.filter(x=>now-x.created<86400000);localStorage.setItem('cm_stories',JSON.stringify(fresh));return fresh}
async function newStory(){openModal(`<div class="modalHead"><h2>Novo status</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Foto ou vídeo • dura 24 horas. Você também pode colocar texto, link e música.</div><input id="storyFile" class="fileInput" type="file" accept="image/*,video/*"><input id="storyImage" class="field" placeholder="Ou cole o link de uma foto/vídeo"><input id="storyText" class="field" placeholder="Texto opcional"><input id="storyLink" class="field" placeholder="Link clicável opcional"><input id="storyMusic" class="field" placeholder="URL de música/áudio com direitos de uso"><button class="primary" onclick="saveStory()">Publicar status</button>`)}
async function saveStory(){const file=document.getElementById('storyFile').files[0],url=document.getElementById('storyImage').value.trim();if(!file&&!url)return alert('Escolha uma foto/vídeo ou cole um link.');const image=file?await fileToData(file):url,p=profileData(),a=getStories();a.push({id:Date.now().toString(),owner:'me',name:p.name,photo:p.photo,image,text:document.getElementById('storyText').value.trim(),link:document.getElementById('storyLink').value.trim(),music:document.getElementById('storyMusic').value.trim(),created:Date.now()});localStorage.setItem('cm_stories',JSON.stringify(a));closeModal();go('home')}
function viewMyStory(){const s=getStories().filter(x=>x.owner==='me').pop();if(s)viewStoryData(s)}
function viewStoryData(s){const old=document.getElementById('storyViewer');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div id="storyViewer" class="storyViewer"><button class="storyClose" onclick="this.parentElement.remove()">×</button><div style="width:min(520px,100%);text-align:center"><img src="${esc(s.image)}"><h2>${esc(s.name||'Status')}</h2>${s.text?`<p>${esc(s.text)}</p>`:''}${s.link?`<a class="linkBtn" href="${esc(s.link)}" target="_blank">🔗 Abrir link</a>`:''}${s.music?`<p class="small">🎵 Música adicionada</p>`:''}</div></div>`)}
function viewStory(id,name,photo){viewStoryData({name:decodeURIComponent(name),image:photo,text:'Status da região 🌿'})}
function addGroup(){openModal(`<div class="modalHead"><h2>Criar grupo</h2><button class="close" onclick="closeModal()">×</button></div><input id="gName" class="field" placeholder="Nome do grupo"><input id="gSubtitle" class="field" placeholder="Subtítulo"><textarea id="gDesc" class="textarea" placeholder="Descrição do grupo"></textarea><textarea id="gRules" class="textarea" placeholder="Regras do grupo"></textarea><input id="gCover" class="field" placeholder="Link da foto/capa"><div class="sectionHead"><h3>Adicionar pessoas</h3></div>${demoPeople.map(p=>`<label class="memberRow"><input type="checkbox" class="gMember" value="${p.id}"><img class="avatar" src="${p.photo}"><span>${p.name}<small class="sub">${p.city}</small></span></label>`).join('')}<button class="primary" onclick="saveGroup()">Criar grupo</button>`)}
function getGroups(){return JSON.parse(localStorage.getItem('cm_groups')||'[]')}
function saveGroup(){const members=[...document.querySelectorAll('.gMember:checked')].map(x=>x.value);const p=profileData();const g={id:Date.now().toString(),name:document.getElementById('gName').value.trim(),subtitle:document.getElementById('gSubtitle').value.trim(),desc:document.getElementById('gDesc').value.trim(),rules:document.getElementById('gRules').value.trim(),cover:document.getElementById('gCover').value.trim()||'mantiqueira-hero.jpg',members,owner:p.name,posts:[]};if(!g.name)return alert('Coloque um nome para o grupo.');const a=getGroups();a.push(g);localStorage.setItem('cm_groups',JSON.stringify(a));closeModal();currentGroup=g;go('group')}
function groupPreview(){const a=getGroups();if(!a.length)return `<div class="empty">Ainda não há grupos criados. <button class="link" onclick="addGroup()">Criar o primeiro</button></div>`;return a.slice(0,2).map(g=>`<button class="card" style="width:100%;text-align:left;color:white" onclick="openGroup('${g.id}')"><div class="groupCover" style="background-image:url('${esc(g.cover)}')"></div><div class="groupMeta"><div><b>${esc(g.name)}</b><div class="small">${esc(g.subtitle||'Grupo da região')} • ${g.members.length} membros</div></div></div></button>`).join('')}
function groups(){return screen(`<button class="ghost" onclick="go('home')">← Voltar</button><div class="sectionHead"><div><h1>Grupos da região</h1><div class="sub">Comunidades da Serra da Mantiqueira para conversar, publicar e compartilhar.</div></div><button class="followBtn" onclick="addGroup()">＋ Criar</button></div>${getGroups().length?getGroups().map(g=>`<button class="card" style="width:100%;text-align:left;color:white" onclick="openGroup('${g.id}')"><div class="groupCover" style="background-image:url('${esc(g.cover)}')"></div><div class="groupMeta"><div><b>${esc(g.name)}</b><div class="small">${esc(g.subtitle||'Grupo da região')} • ${g.members.length} membros</div></div></div><p class="sub">${esc(g.desc||'Sem descrição.')}</p></button>`).join(''):`<div class="empty">Nenhum grupo criado ainda.<br><button class="primary" onclick="addGroup()">＋ Criar meu primeiro grupo</button></div>`}`,'home')}
function openGroup(id){currentGroup=getGroups().find(g=>g.id===id);go('group')}
function groupScreen(){const g=currentGroup;if(!g)return groups();return screen(`<button class="ghost" onclick="go('groups')">← Grupos</button><div class="card"><div class="groupCover" style="background-image:url('${esc(g.cover)}')"></div><h1>${esc(g.name)}</h1><div class="sub">${esc(g.subtitle||'Grupo da região')}</div><p>${esc(g.desc||'')}</p><span class="pill">${g.members.length} membros</span><span class="pill">Comunidade Mantiqueira</span><div class="profileActions"><button class="followBtn" onclick="addGroupMember()">＋ Adicionar pessoas</button><button class="secondary" onclick="newGroupPost()">＋ Publicar</button></div></div><div class="tabs"><button class="tab active" onclick="groupTab(0)">Publicações</button><button class="tab" onclick="groupTab(1)">Sobre</button></div><div id="groupPages" class="tabPages"><div class="tabPage">${g.posts.length?g.posts.slice().reverse().map(x=>`<article class="card post"><div class="postTop"><img class="avatar" src="${x.photo}"><div><b>${esc(x.name)}</b><span>no grupo</span></div></div>${x.text?`<p>${esc(x.text)}</p>`:''}${x.image?`<img src="${x.image}">`:''}<div class="postActions"><button class="action">♥ ${x.likes||0}</button><button class="action">💬 Comentar</button></div></article>`).join(''):`<div class="empty">O grupo ainda não tem publicações. Seja o primeiro.</div>`}</div><div class="tabPage"><div class="card"><h3>Sobre o grupo</h3><p class="sub">${esc(g.desc||'Sem descrição.')}</p><h3>Regras</h3>${(g.rules||'Respeite os outros membros.').split('\n').filter(Boolean).map((r,i)=>`<div class="rule"><b>${i+1}.</b> ${esc(r)}</div>`).join('')}<h3>Membros</h3>${g.members.map(id=>{const p=demoPeople.find(x=>x.id===id);return p?`<div class="memberRow"><img class="avatar" src="${p.photo}"><span>${p.name}<small class="sub">${p.city}</small></span></div>`:`<div class="memberRow"><span>${esc(id)}</span></div>`}).join('')}</div></div></div>`,'home')}
function groupTab(i){const el=document.getElementById('groupPages');if(el)el.scrollTo({left:el.clientWidth*i,behavior:'smooth'});document.querySelectorAll('.tabs .tab').forEach((b,n)=>b.classList.toggle('active',n===i))}
function addGroupMember(){const g=currentGroup;if(!g)return;openModal(`<div class="modalHead"><h2>Adicionar pessoas</h2><button class="close" onclick="closeModal()">×</button></div>${demoPeople.map(p=>`<label class="memberRow"><input type="checkbox" class="gmMember" value="${p.id}" ${g.members.includes(p.id)?'checked disabled':''}><img class="avatar" src="${p.photo}"><span>${p.name}<small class="sub">${p.city}</small></span></label>`).join('')}<button class="primary" onclick="saveGroupMembers()">Adicionar selecionadas</button>`)}
function saveGroupMembers(){const ids=[...document.querySelectorAll('.gmMember:checked:not(:disabled)')].map(x=>x.value);const a=getGroups(),g=a.find(x=>x.id===currentGroup.id);g.members=[...new Set([...g.members,...ids])];localStorage.setItem('cm_groups',JSON.stringify(a));currentGroup=g;closeModal();go('group')}
function newGroupPost(){openModal(`<div class="modalHead"><h2>Publicar no grupo</h2><button class="close" onclick="closeModal()">×</button></div><textarea id="gpText" class="textarea" placeholder="O que você quer compartilhar?"></textarea><input id="gpFile" class="fileInput" type="file" accept="image/*"><input id="gpImage" class="field" placeholder="Ou cole o link da foto"><button class="primary" onclick="saveGroupPost()">Publicar no grupo</button>`)}
async function saveGroupPost(){const g=currentGroup,file=document.getElementById('gpFile').files[0],url=document.getElementById('gpImage').value.trim(),text=document.getElementById('gpText').value.trim();if(!text&&!file&&!url)return alert('Adicione texto ou foto.');const p=profileData(),image=file?await fileToData(file):url;const a=getGroups(),x=a.find(q=>q.id===g.id);x.posts=x.posts||[];x.posts.push({id:Date.now().toString(),name:p.name,photo:p.photo,text,image,likes:0});localStorage.setItem('cm_groups',JSON.stringify(a));currentGroup=x;closeModal();go('group')}
function chat(){return screen(`<h1>Bate-papo</h1><input class="search" placeholder="⌕ Buscar conversas..."><div class="list">${demoPeople.map(p=>`<div class="chatItem" onclick="publicProfile('${p.id}');setTimeout(()=>go('conversation'),0)"><img class="avatar" src="${p.photo}"><div class="chatInfo"><b>${p.name}</b><span class="online">● Online agora</span></div><button class="iconBtn">›</button></div>`).join('')}</div>`,'chat')}
function conversation(){const p=currentPublicUser||demoPeople[0];const msgs=JSON.parse(localStorage.getItem('cm_messages_'+p.id)||'[]');return screen(`<div class="chatHead"><button class="ghost" onclick="go('chat')">←</button><img class="avatar" src="${p.photo}"><div style="flex:1"><b>${p.name}</b><div class="small online">Online agora</div></div><button class="iconBtn">☎</button><button class="iconBtn">⋯</button></div><div class="card" style="text-align:center"><img class="profileAvatar" style="margin:0" src="${p.photo}"><h2>${p.name}</h2><div class="sub">${p.city}</div><div class="profileActions" style="justify-content:center"><button class="secondary" onclick="publicProfile('${p.id}')">Ver perfil</button><button class="followBtn" onclick="toggleFollow('${p.id}')">${isFollowing(p.id)?'Seguindo':'Seguir'}</button></div></div><div class="messageList">${msgs.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')}</div><div class="composer"><button class="iconBtn" onclick="alert('Câmera preparada para a próxima integração')">📷</button><input id="msgText" placeholder="Mensagem..."><button class="iconBtn" onclick="sendMessage('${p.id}')">➤</button><button class="iconBtn" onclick="alert('Áudio preparado para a próxima integração')">🎙</button><button class="iconBtn" onclick="alert('Galeria preparada para a próxima integração')">🖼</button><button class="iconBtn" onclick="alert('GIFs preparados para a próxima integração')">GIF</button><button class="iconBtn" onclick="alert('Mais opções')">＋</button></div>`,'chat')}
function sendMessage(id){const el=document.getElementById('msgText'),text=el?.value.trim();if(!text)return;const k='cm_messages_'+id,a=JSON.parse(localStorage.getItem(k)||'[]');a.push({text,mine:true,created:Date.now()});localStorage.setItem(k,JSON.stringify(a));go('conversation')}
function openImage(url){const src=decodeURIComponent(url);document.body.insertAdjacentHTML('beforeend',`<div id="imageModal" class="storyViewer" onclick="this.remove()"><img src="${esc(src)}"></div>`)}
function openModal(content){const old=document.getElementById('modal');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal"><div class="modalBox">${content}</div></div>`)}
function closeModal(){document.getElementById('modal')?.remove()}
function fileToData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function logout(){sb.auth.signOut();me=null;location.reload()}
function go(page,arg=""){const a=document.getElementById('app');if(page==='home')a.innerHTML=home();else if(page==='people')a.innerHTML=people(arg);else if(page==='chat')a.innerHTML=chat();else if(page==='conversation')a.innerHTML=conversation();else if(page==='explore'){a.innerHTML=explore();setTimeout(renderFeed,0)}else if(page==='business')a.innerHTML=businessScreen();else if(page==='profile')a.innerHTML=profile();else if(page==='publicProfile')a.innerHTML=publicProfileScreen();else if(page==='groups')a.innerHTML=groups();else if(page==='group')a.innerHTML=groupScreen()}
function authScreen(){document.getElementById('app').innerHTML=`<div class="auth"><div class="authCard"><div class="brand">Conecta <span>Mantiqueira</span></div><h1 id="authTitle">Criar conta</h1><div class="sub">Entre para fazer parte da região conectada.</div><div id="registerFields"><input id="name" class="field" placeholder="Nome"><input id="city" class="field" placeholder="Cidade"></div><input id="email" class="field" type="email" placeholder="E-mail"><input id="password" class="field" type="password" placeholder="Senha"><div id="error" class="error"></div><button class="primary" onclick="submitAuth()">Continuar</button><button class="ghost" onclick="toggleAuth()">Já tenho uma conta</button></div></div>`;window.mode='register'}
function toggleAuth(){mode=mode==='register'?'login':'register';document.getElementById('authTitle').textContent=mode==='register'?'Criar conta':'Entrar';document.getElementById('registerFields').classList.toggle('hidden',mode!=='register');document.querySelector('.ghost').textContent=mode==='register'?'Já tenho uma conta':'Criar uma conta'}
async function submitAuth(){try{document.getElementById('error').textContent='';const emailInput=document.getElementById('email'),passwordInput=document.getElementById('password'),nameInput=document.getElementById('name'),cityInput=document.getElementById('city');if(mode==='register'){const {data,error}=await sb.auth.signUp({email:emailInput.value.trim(),password:passwordInput.value,options:{data:{name:nameInput?.value.trim()||'',city:cityInput?.value.trim()||'',bio:'',photo:'',cover:'mantiqueira-hero.jpg',interests:'',links:'',highlights:[]}}});if(error)throw error;if(!data.user)throw new Error('Não foi possível criar a conta.');me=data.user}else{const {data,error}=await sb.auth.signInWithPassword({email:emailInput.value.trim(),password:passwordInput.value});if(error)throw error;me=data.user}go('home')}catch(e){document.getElementById('error').textContent=e.message}}
async function start(){const {data}=await sb.auth.getUser();me=data?.user||null;if(me)go('home');else authScreen()}start();
</script>
</body></html>
