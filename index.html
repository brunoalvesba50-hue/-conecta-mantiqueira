function avatar(name="CM"){return "https://ui-avatars.com/api/?name="+encodeURIComponent(name)+"&background=12384a&color=20df9a&bold=true"}
function profileData(){const m=me?.user_metadata||{};return{name:m.name||m.full_name||me?.email?.split("@")[0]||"Novo usuário",city:m.city||"Cidade não informada",bio:m.bio||"Ainda não adicionou uma descrição.",photo:m.photo||avatar(m.name||"Novo usuário"),cover:m.cover||"mantiqueira-hero.jpg",interests:m.interests||"",links:m.links||"",whatsapp:m.whatsapp||"",highlights:Array.isArray(m.highlights)?m.highlights:[],aboutPublic:m.aboutPublic!==false,showcaseEnabled:m.showcaseEnabled===true}}
function getPosts(){try{const v=JSON.parse(localStorage.getItem("cm_posts")||"[]");return Array.isArray(v)?v:[]}catch(_){return []}}
function savePosts(posts){localStorage.setItem("cm_posts",JSON.stringify(Array.isArray(posts)?posts:[]))}
function nav(active){return `<nav class="nav"><button class="${active==="home"?"active":""}" onclick="go('home')"><span class="nicon">⌂</span>Início</button><button class="${active==="chat"?"active":""}" onclick="go('chat')"><span class="nicon">◌</span>Bate-papo</button><button class="${active==="explore"?"active":""}" onclick="go('explore')"><span class="nicon">⌕</span>Explorar</button><button class="${active==="profile"?"active":""}" onclick="go('profile')"><span class="nicon">♙</span>Perfil</button></nav>`}
function screen(content,active){return `<main class="screen">${content}</main>${nav(active)}`}
function officialCity(v){const k=cityKey(v);if(!k)return "";return cities.find(c=>cityKey(c)===k)||""}
function registeredCities(){const map=new Map();publicProfilesCache.forEach(p=>{const name=officialCity(p.city);if(!name)return;const key=cityKey(name);const row=map.get(key)||{city:name,count:0};row.count++;map.set(key,row)});return [...map.values()].sort((a,b)=>b.count-a.count||a.city.localeCompare(b.city,"pt-BR"))}
function homeCityHtml(){const rows=registeredCities();if(!rows.length)return '<div class="empty">As cidades aparecerão aqui conforme as pessoas criarem seus perfis.</div>';return rows.slice(0,8).map((x,i)=>`<button class="city c${(i%4)+1}" onclick="go('people','${esc(x.city)}')">⌖ ${esc(x.city)}<small>${x.count} ${x.count===1?'pessoa':'pessoas'}</small></button>`).join("")}
function home(){const p=profileData();setTimeout(async()=>{await loadStories();const el=document.getElementById('homeStories');if(el)el.innerHTML=stories();},0);const realPeople=getPublicPeople().filter(x=>x.id!==me?.id&&x.photo).slice(0,12);return screen(`<div class="brand">Conecta <span>Mantiqueira</span></div><div class="heroTitle">Olá, ${esc(p.name)}! 👋</div><div class="sub">Que bom te ver por aqui!</div><div id="homeStories">${stories()}</div><input id="homePeopleSearch" class="search" placeholder="⌕  Buscar pessoas, cidades, interesses..." oninput="filterPeopleLive(this.value)" autocomplete="off"><div id="homeSearchResults"></div><div class="grid4"><button class="quick" onclick="go('people')"><div class="ico">♙</div><small>Pessoas<br>da região</small></button><button class="quick" onclick="go('groups')"><div class="ico">♧</div><small>Grupos<br>da região</small></button><button class="quick" onclick="go('business')"><div class="ico">⌂</div><small>Comércios<br>e serviços</small></button><button class="quick" onclick="go('business')"><div class="ico">★</div><small>Divulgue<br>seu negócio</small></button></div><div class="sectionHead"><h2>Pessoas por cidade</h2><button class="link" onclick="citySearch()">Pesquisar cidades</button></div><div class="cityGrid">${homeCityHtml()}</div><div class="sectionHead"><h2>Pessoas da região</h2></div><div class="peopleRow">${realPeople.length?realPeople.map(p=>`<div class="personMini" onclick="publicProfile('${esc(p.id)}')"><img class="avatar" src="${esc(p.photo)}"><small>${esc(p.name.split(" ")[0])}<br>${esc(p.city||"")}</small></div>`).join(""):"<div class='empty'>Ainda não há outros perfis cadastrados. Conforme as pessoas criarem suas contas, elas aparecerão aqui.</div>"}</div><div class="sectionHead"><h2>Grupos da região</h2><button class="link" onclick="go('groups')">Ver todos</button></div>${groupPreview()}</div>`,'home')}

function normText(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function cityKey(v){return normText(v).replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim()}
function peopleMatch(p,q){const raw=String(q||"").trim();if(!raw)return true;const key=cityKey(raw);if(key&&cityKey(p.city||"")===key)return true;return normText((p.name||"")+" "+(p.city||"")+" "+(p.bio||"")).includes(normText(raw))}
function filterPeopleLive(v){const q=normText((v||"").trim());const el=document.getElementById("homeSearchResults");if(!el)return;if(q.length<2){el.innerHTML="";return}const all=getPublicPeople().filter(p=>p.id!==me?.id);const list=all.filter(p=>peopleMatch(p,q));const cityMatches=cities.filter(c=>normText(c).includes(q)).slice(0,8);el.innerHTML=(cityMatches.length?`<div class="card" style="padding:10px;margin:0 0 10px"><b>Cidades encontradas</b>${renderCityButtons(cityMatches)}</div>`:"")+`<div class="list">${renderPeopleList(list,q)}</div>`}
function filterPeopleResults(v){const q=normText((v||"").trim());currentCity=(v||"").trim();const listBox=document.getElementById("peopleResults");const cityBox=document.getElementById("peopleCityResults");if(!listBox)return;const all=getPublicPeople().filter(p=>p.id!==me?.id);const list=all.filter(p=>peopleMatch(p,q));const cityMatches=q?cities.filter(c=>normText(c).includes(q)).slice(0,12):[];if(cityBox)cityBox.innerHTML=cityMatches.length?`<div class="small" style="margin:8px 0">Cidades encontradas</div>${renderCityButtons(cityMatches)}`:"";listBox.innerHTML=renderPeopleList(list,q)}
function renderPeopleList(list,q){return list.length?list.map(p=>`<div class="person" onclick="publicProfile('${p.id}')"><img class="avatar" src="${esc(p.photo)}"><div class="personInfo"><b>${esc(p.name)}</b><span>${esc(p.city)}</span><span class="onlineDot ${isOnline(p.id)?"isOnline":""}" data-online-user="${p.id}">${isOnline(p.id)?"● Online agora":"○ Offline"}</span></div><button class="followBtn ${isFollowing(p.id)?"following":""}" onclick="event.stopPropagation();toggleFollow('${p.id}')">${isFollowing(p.id)?"Seguindo":"Seguir"}</button></div>`).join(""):"<div class='empty'>Não encontrei pessoas nessa cidade ou busca. Assim que pessoas se cadastrarem com essa cidade, elas aparecerão aqui.</div>"}
/* NOTA PRIVACIDADE: o campo whatsapp e lido para todos os usuarios logados. O ideal e restringir no Supabase (RLS ou view) para expor so a quem o dono permitir. */
async function loadPublicProfiles(){try{let r=await sb.from("profiles").select("id,name,city,bio,photo,cover,interests,links,whatsapp,showcaseEnabled,created_at").limit(1000);if(r.error)r=await sb.from("profiles").select("id,name,city,bio,photo,cover,interests,links,showcaseEnabled,created_at").limit(1000);if(!r.error&&Array.isArray(r.data))publicProfilesCache=r.data}catch(_){} }
function getPublicPeople(){const myId=me?.id||"";let list=[...publicProfilesCache].filter(p=>p?.id&&p.id!==myId);const myCity=normText(profileData().city||"");list.sort((a,b)=>{const ac=normText(a.city||"")===myCity?0:1,bc=normText(b.city||"")===myCity?0:1;if(ac!==bc)return ac-bc;return new Date(b.created_at||0)-new Date(a.created_at||0)});const seen=new Set();return list.filter(p=>{if(!p?.id||p.id===myId||seen.has(p.id))return false;seen.add(p.id);p.photo=p.photo||avatar(p.name||"Novo usuário");return true})}
function showPostsStat(){profileTab(0);document.getElementById('profilePages')?.scrollIntoView({behavior:'smooth',block:'center'})}
async function showFollowList(userId,type){
  if(!userId||userId==='undefined')return;
  const title=type==='followers'?'Seguidores':'Seguindo';
  openModal(`<div class="modalHead"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><div id="followListBox" class="list" style="margin-top:12px"><div class="empty">Carregando...</div></div>`);
  const box=()=>document.getElementById('followListBox');
  try{
    const mine=type==='followers'?'following_id':'follower_id',other=type==='followers'?'follower_id':'following_id';
    const {data,error}=await sb.from('follows').select(other).eq(mine,userId);
    if(error)throw error;
    const ids=[...new Set((data||[]).map(x=>x[other]).filter(Boolean))];
    if(!box())return;
    if(!ids.length){box().innerHTML=`<div class="empty">${type==='followers'?'Ainda não há seguidores.':'Ainda não está seguindo ninguém.'}</div>`;return}
    let rows=[...publicProfilesCache,...(me?.id?[{id:me.id,...profileData()}]:[])].filter(p=>ids.includes(p.id));
    const missing=ids.filter(id=>!rows.some(r=>r.id===id));
    if(missing.length){const r=await sb.from('profiles').select('id,name,city,photo').in('id',missing);if(!r.error&&Array.isArray(r.data)){rows=rows.concat(r.data);publicProfilesCache=[...publicProfilesCache,...r.data.filter(x=>!publicProfilesCache.some(c=>c.id===x.id))]}}
    if(!box())return;
    box().innerHTML=rows.length?rows.map(p=>`<div class="person" onclick="openFollowProfile('${esc(p.id)}')"><img class="avatar" src="${esc(p.photo||avatar(p.name||'Usuário'))}"><div class="personInfo"><b>${esc(p.name||'Usuário')}</b><span>${esc(p.city||'')}</span></div></div>`).join(''):'<div class="empty">Não foi possível carregar os perfis.</div>';
  }catch(e){if(box())box().innerHTML='<div class="empty">Não foi possível carregar a lista agora.</div>'}
}
function openFollowProfile(id){closeModal();if(id===me?.id){go('profile');return}publicProfile(id)}
function isFollowing(id){return followCache.has(id)}
async function loadFollowState(){if(!me?.id)return;try{const {data,error}=await sb.from("follows").select("following_id").eq("follower_id",me.id);if(!error)followCache=new Set((data||[]).map(x=>x.following_id))}catch(_){} }
async function toggleFollow(id){if(!me?.id||!id||id===me.id)return;try{if(followCache.has(id)){const {error}=await sb.from("follows").delete().eq("follower_id",me.id).eq("following_id",id);if(error)throw error;followCache.delete(id)}else{const {error}=await sb.from("follows").insert({follower_id:me.id,following_id:id});if(error)throw error;followCache.add(id)}if(currentPublicUser?.id===id)go("publicProfile");else {const q=currentCity;go("people",q)}}catch(e){alert(e.message||"Não foi possível atualizar o seguir agora.")}} 
async function followCounts(id){try{const [a,b]=await Promise.all([sb.from("follows").select("id",{count:"exact",head:true}).eq("following_id",id),sb.from("follows").select("id",{count:"exact",head:true}).eq("follower_id",id)]);return {followers:a.count||0,following:b.count||0}}catch(_){return {followers:0,following:0}}}
async function people(query=""){currentCity=query;await loadPublicProfiles();const q=String(query||"");const all=getPublicPeople();const list=all.filter(p=>peopleMatch(p,q));const cityMatches=q?cities.filter(c=>normText(c).includes(normText(q))).slice(0,12):[];return screen(`<button class="ghost" onclick="go('home')">← Voltar</button><h1>${q?`Pessoas em ${esc(q)}`:"Pessoas da região"}</h1><div class="sub">Digite a cidade ou o nome completo. Você verá outras pessoas cadastradas, nunca o seu próprio perfil.</div><input id="peopleSearch" class="search" value="${esc(q)}" placeholder="Pesquisar pessoa ou cidade" oninput="filterPeopleResults(this.value)" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false"><div id="peopleCityResults">${cityMatches.length?`<div class="small" style="margin:8px 0">Cidades encontradas</div>${renderCityButtons(cityMatches)}`:""}</div><div class="grid4" style="margin:12px 0"><button class="quick" onclick="go('people')">Todas</button><button class="quick" onclick="go('people','Sapucaí-Mirim')">Sapucaí</button><button class="quick" onclick="go('people','Santo Antônio do Pinhal')">Santo Antônio</button><button class="quick" onclick="go('people','São Bento do Sapucaí')">São Bento</button></div><div id="peopleResults" class="list">${renderPeopleList(list,q)}</div>`,'explore')}
function citySearch(){openModal(`<div class="modalHead"><h2>Pesquisar cidades</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Digite a cidade inteira ou apenas parte do nome. A lista não fecha enquanto você digita.</div><input id="citySearchInput" class="search" placeholder="Ex.: Campos do Jordão" oninput="filterCityModal(this.value)" autocomplete="off"><div id="citySearchList" class="citySearchList">${renderCityButtons(cities)}</div>`);setTimeout(()=>document.getElementById('citySearchInput')?.focus(),50)}
function renderCityButtons(list){return list.map(c=>`<button class="citySearchItem" onclick="closeModal();go('people','${esc(c)}')">⌖ ${esc(c)}</button>`).join("")||'<div class="empty">Nenhuma cidade encontrada.</div>'}
function filterCityModal(v){const q=normText((v||"").trim());const list=cities.filter(c=>normText(c).includes(q));const el=document.getElementById("citySearchList");if(el)el.innerHTML=renderCityButtons(list)}
function publicProfile(id){const p=getPublicPeople().find(x=>x.id===id);if(!p)return;currentPublicUser=p;go("publicProfile")}
function whatsappUrl(v){const n=String(v||'').replace(/\D/g,'');return n?'https://wa.me/'+(n.startsWith('55')?n:'55'+n):''}
function profileContactHtml(p){const w=whatsappUrl(p.whatsapp);return (w||p.links)?`<div class="profileContactButtons">${w?`<a class="profileContactBtn whatsappBtn" href="${w}" target="_blank" rel="noopener">💬 WhatsApp</a>`:''}${p.links?p.links.split('\n').filter(Boolean).map(x=>{const q=x.split('|');return `<a class="profileContactBtn" href="${esc(q[1]||q[0])}" target="_blank" rel="noopener">🔗 ${esc(q[0]||'Abrir link')}</a>`}).join(''):''}</div>`:''}
function publicProfileScreen(){const p=currentPublicUser;if(!p)return people();setTimeout(async()=>{const c=await followCounts(p.id);document.getElementById("publicFollowers")&&(document.getElementById("publicFollowers").textContent=c.followers);document.getElementById("publicFollowing")&&(document.getElementById("publicFollowing").textContent=c.following);},0);const aboutPublic=p.aboutPublic!==false;const about=aboutPublic?`<div class="card"><h3>Vitrine</h3><div id="publicShowcase" class="small">Produtos e serviços deste perfil.</div>${p.bio?`<p class="sub" style="margin-top:14px">${esc(p.bio)}</p>`:''}${p.interests?`<p><b>Interesses:</b><br>${p.interests.split(',').map(x=>`<span class="pill">${esc(x.trim())}</span>`).join(' ')}</p>`:''}${profileContactHtml(p)}</div>`:`<div class="aboutPrivate">🔒 Este perfil optou por manter as informações da seção Vitrine privadas.</div>`;return screen(`<button class="ghost" onclick="go('people')">← Voltar</button><div class="card profileCard"><div class="profileCover" style="background-image:url('${esc(p.cover||'mantiqueira-hero.jpg')}')"></div><div class="profileBody"><img class="profileAvatar" src="${esc(p.photo||avatar(p.name))}"><h1>${esc(p.name)}</h1><div class="sub">⌾ ${esc(p.city)}</div><p class="sub">${esc(p.bio||'Pessoa da região conectada à Mantiqueira. 🌿')}</p><div class="profileActions"><button class="followBtn ${isFollowing(p.id)?"following":""}" onclick="toggleFollow('${p.id}')">${isFollowing(p.id)?"Seguindo ✓":"Seguir"}</button><button class="secondary" onclick="go('conversation')">Mensagem</button></div><div class="stats"><div style="cursor:pointer" onclick="showFollowList('${p.id}','followers')"><b id="publicFollowers">0</b><span>Seguidores</span></div><div style="cursor:pointer" onclick="showFollowList('${p.id}','following')"><b id="publicFollowing">0</b><span>Seguindo</span></div><div><b>${isFollowing(p.id)?"Seguindo":""}</b><span>Status</span></div></div><div class="tabs"><button class="tab active">Publicações</button><button class="tab">Fotos</button><button class="tab">Sobre</button></div><div class="empty">Ainda não há publicações.</div>${about}</div></div>`,'explore')}
function explore(){return screen(`<h1>Explorar</h1><div class="grid4" style="margin:18px 0"><button class="quick" style="background:var(--green);color:#052018">Feed</button><button class="quick" onclick="go('news')">📰 Notícias</button><button class="quick" onclick="go('groups')">Grupos</button><button class="quick" onclick="go('business')">Comércios</button></div><div class="sectionHead"><h2>Feed da região</h2><button class="link" onclick="newPost()">＋ Publicar</button></div><div class="sub">O Feed mostra somente publicações feitas por pessoas cadastradas no Conecta Mantiqueira. Notícias ficam em uma área própria e nunca se misturam com as publicações.</div><div id="feed"></div>`,'explore')}
function newsScreen(){return screen(`<button class="ghost" onclick="go('explore')">← Voltar</button><h1>📰 Notícias da Mantiqueira</h1><div class="sub">Notícias ficam separadas do Feed. Puxe a tela para baixo para buscar matérias novas.</div><div id="newsPull" class="newsPull">Solte para atualizar notícias ↓</div><div class="newsRefresh"><span id="newsStatus">Atualizando notícias...</span><button class="newsRefreshBtn" onclick="refreshNews(true)">↻ Atualizar</button></div><div id="newsList" class="newsSeparate"></div><div class="small">As manchetes são buscadas em fontes públicas de notícias da região. A matéria completa permanece na fonte original.</div>`,'explore')}
function renderFeed(){const el=document.getElementById("feed");if(!el)return;const all=getPosts();if(!all.length){el.innerHTML='<div class="empty">Ainda não há publicações reais. Seja o primeiro a publicar! 📸</div>';return}el.innerHTML=all.slice().reverse().map(p=>{const media=p.image?(p.type==='video'?`<video src="${esc(p.image)}" controls playsinline preload="metadata" style="width:100%;max-height:72vh;border-radius:16px;background:#000"></video>`:`<img src="${esc(p.image)}" loading="lazy">`):"";return `<article class="card post"><div class="postTop"><img class="avatar" src="${p.photo||avatar(p.name)}"><div><b>${esc(p.name)}</b><span>${esc(p.city||"Mantiqueira")} • agora</span></div></div>${p.text?`<p>${esc(p.text)}</p>`:""}${media}<div class="postActions"><button class="action" onclick="likePost('${p.id}')">♥ ${p.likes||0}</button><button class="action" onclick="commentPost('${p.id}')">💬 Comentar</button><button class="action" onclick="sharePost('${p.id}')">↗ Compartilhar</button></div><div class="commentList">${getComments(p.id).map(c=>`<div class="commentItem"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`).join()}</div></article>`}).join("")}
function newPost(){openModal(`<div class="modalHead"><h2>Nova publicação</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Publique uma foto e uma descrição, como no Instagram.</div><textarea id="postText" class="textarea" placeholder="Escreva uma legenda..."></textarea><input id="postFile" class="fileInput" type="file" accept="image/*,video/*"><input id="postImage" class="field" placeholder="Ou cole o link de uma foto"><button class="primary" onclick="saveNewPost()">Publicar agora</button>`)}
async function saveNewPost(){try{const p=profileData(),file=document.getElementById("postFile").files[0],text=document.getElementById("postText").value.trim(),url=document.getElementById("postImage").value.trim();if(!text&&!file&&!url)return alert("Adicione uma foto ou escreva alguma coisa.");const image=file?await uploadMedia(file,'posts','post'):url;const a=getPosts();a.push({id:Date.now().toString(),ownerId:me?.id||'',name:p.name,city:p.city,photo:p.photo,text,image,type:file?.type?.startsWith('video/')?'video':'image',likes:0,created:Date.now()});savePosts(a);closeModal();go('explore')}catch(e){alert(e.message||'Não foi possível publicar a mídia.')}}
function likePost(id){const a=getPosts(),p=a.find(x=>x.id===id);if(p)p.likes=(p.likes||0)+1;savePosts(a);renderFeed()}
function commentPost(id){const c=prompt("Digite seu comentário:");if(!c)return;const a=getComments(id);const p=profileData();a.push({id:Date.now().toString(),name:p.name,text:c,created:Date.now()});localStorage.setItem("cm_comments_"+id,JSON.stringify(a));if(document.getElementById("profilePages"))go("profile");else renderFeed()}
function sharePost(id){const url=location.href+"#post-"+id;if(navigator.share)navigator.share({title:"Conecta Mantiqueira",text:"Confira esta publicação no Conecta Mantiqueira",url});else{navigator.clipboard?.writeText(url);alert("Link da publicação copiado para compartilhar.")}}

nk. Nada aparece no perfil se você deixar vazio.</small><input id="editWhatsapp" class="field" inputmode="tel" placeholder="WhatsApp (opcional)" value="${esc(p.whatsapp||'')}"></div><input id="editInterests" class="field" placeholder="Interesses separados por vírgula" value="${esc(p.interests)}"><textarea id="editLinks" class="textarea" placeholder="Links, um por linha. Ex.: Minha loja|https://minhaloja.com">${esc(p.links)}</textarea><label class="settingRow"><span><b>Mostrar Vitrine no meu perfil</b><small>Opcional. Ative para aparecer a aba Vitrine ao lado de Publicações e Fotos.</small></span><button type="button" id="showcaseSwitch" class="switch ${p.showcaseEnabled?'on':''}" onclick="this.classList.toggle('on')"><i></i></button></label><label class="settingRow"><span><b>Deixar a seção Sobre pública</b><small>Outras pessoas poderão ver bio, interesses e links.</small></span><button type="button" id="aboutPublicSwitch" class="switch ${p.aboutPublic?'on':''}" onclick="this.classList.toggle('on')"><i></i></button></label><button class="primary" onclick="saveProfile()">Salvar alterações</button>`)}

async function submitSupport(){
  const err=document.getElementById('supportError'),btn=document.getElementById('supportSend');
  try{
    if(err)err.textContent='';
    const message=(document.getElementById('supportMessage')?.value||'').trim(),file=document.getElementById('supportScreenshot')?.files?.[0];
    if(!message&&!file){if(err)err.textContent='Escreva o problema ou envie um print para continuar.';return}
    if(btn){btn.disabled=true;btn.textContent='Enviando...'}
    let screenshot_url='';
    if(file){
      if(!file.type.startsWith('image/'))throw new Error('O print precisa ser uma imagem.');
      const prepared=await prepareMedia(file,'support');
      const path=`${me?.id||'anonymous'}/support/${Date.now()}-${Math.random().toString(36).slice(2)}.webp`;
      const up=await sb.storage.from('conecta-media').upload(path,prepared.blob,{contentType:prepared.type,upsert:false,cacheControl:'31536000'});
      if(up.error){
        if(prepared.blob.size<=620*1024)screenshot_url=await blobToData(prepared.blob);
        else throw new Error('Não foi possível enviar o print. Tente outro print ou uma imagem menor.');
      }else screenshot_url=sb.storage.from('conecta-media').getPublicUrl(path)?.data?.publicUrl||'';
    }
    const p=profileData();
    const payload={user_id:me?.id||null,user_name:p.name||'',user_email:me?.email||'',message,screenshot_url,page:window.cmCurrentPage||'desconhecida',user_agent:navigator.userAgent,created_at:new Date().toISOString(),status:'open'};
    const {error}=await sb.from('support_requests').insert(payload);if(error)throw error;

async function refreshNews(force=false){const box=document.getElementById('newsList'),status=document.getElementById('newsStatus');if(!box)return;if(box.dataset.loading==='1')return;box.dataset.loading='1';box.classList.add('newsLoading');if(status)status.textContent='Buscando notícias novas de várias cidades...';try{const batches=await Promise.allSettled(newsQueries.map(fetchNewsQuery));let raw=[];batches.forEach(r=>{if(r.status==='fulfilled')raw.push(...r.value)});const seen=new Set();let items=raw.map(x=>{const title=stripHtml(x.title);const url=x.link||x.guid||'';const source=typeof x.author==='string'&&x.author?x.author:(typeof x.source==='string'&&x.source?x.source:(title.includes(' - ')?title.split(' - ').pop():'Fonte regional'));return{source,title:title.replace(/\s+-\s+[^-]+$/,''),summary:stripHtml(x.description||x.content).slice(0,190),url,date:newsDateText(x.pubDate)||'Atualizada recentemente',pubDate:x.pubDate||'',city:newsCity(title)||newsCity(x._query||''),image:extractNewsImage(x)}}).filter(x=>x.title&&x.url).filter(x=>{const k=x.url;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>newsDateValue(b)-newsDateValue(a));const byCity=new Map();items.forEach(x=>{const k=x.city||'Mantiqueira';if(!byCity.has(k))byCity.set(k,[]);byCity.get(k).push(x)});let diverse=[];let added=true;while(added&&diverse.length<16){added=false;for(const arr of byCity.values()){if(!arr.length)continue;diverse.push(arr.shift());added=true;if(diverse.length>=16)break}}if(diverse.length<8)diverse=items.slice(0,16);const enriched=await Promise.all(diverse.slice(0,12).map(async x=>({...x,image:x.image||await enrichNewsImage(x)})));const history=JSON.parse(localStorage.getItem('cm_news_seen')||'{}');const now=Date.now();Object.keys(history).forEach(k=>{if(now-history[k]>30*60*1000)delete history[k]});let fresh=enriched.filter(x=>!history[x.url]);if(fresh.length<8)fresh=enriched;fresh=fresh.slice(0,12);fresh.forEach(x=>{history[x.url]=now});localStorage.setItem('cm_news_seen',JSON.stringify(history));if(fresh.length){news.splice(0,news.length,...fresh);renderNews(news);if(status)status.textContent='Atualizado agora • '+new Set(fresh.map(x=>x.city)).size+' localidades • '+fresh.length+' notícias';localStorage.setItem('cm_news_cache',JSON.stringify(news))}else{renderNews(news);if(status)status.textContent='Não há novidades no momento'}}catch(e){const cached=JSON.parse(localStorage.getItem('cm_news_cache')||'[]').map(x=>({...x,image:(x.image&&/unsplash\.com/.test(x.image))?'':x.image}));if(cached.length){news.splice(0,news.length,...cached);renderNews(news)}if(status)status.textContent='Não foi possível atualizar agora. Tente novamente.'}finally{box.dataset.loading='0';box.classList.remove('newsLoading')}}

let newsRefreshTimer=null,newsPullStart=0,newsPulling=false;
function setupNewsRefresh(){renderNews(news);refreshNews();clearInterval(newsRefreshTimer);newsRefreshTimer=setInterval(()=>{if(document.visibilityState==='visible'&&document.getElementById('newsList'))refreshNews(false)},5*60*1000);const area=document.querySelector('.screen');if(!area)return;area.addEventListener('touchstart',e=>{if(window.scrollY<=5)newsPullStart=e.touches[0].clientY},{passive:true});area.addEventListener('touchmove',e=>{if(!newsPullStart)return;const dy=e.touches[0].clientY-newsPullStart;if(dy>0&&window.scrollY<=5){newsPulling=true;const h=Math.min(48,Math.round(dy*.45));const pull=document.getElementById('newsPull');if(pull){pull.style.height=h+'px';pull.textContent=h>=42?'Solte para atualizar notícias ↓':'Puxe para atualizar notícias…'}}},{passive:true});area.addEventListener('touchend',()=>{if(newsPulling){const pull=document.getElementById('newsPull');if(pull&&parseInt(pull.style.height||'0',10)>=42)refreshNews(true);if(pull){pull.style.height='0px';pull.textContent=''}}newsPullStart=0;newsPulling=false},{passive:true})}

async function imageBlobFromFile(file,kind="post"){
  const src=URL.createObjectURL(file);
  try{
    const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
    const limits={avatar:[1200,0.88,700],cover:[1800,0.88,900],story:[1920,0.9,1200],post:[2048,0.9,1400],highlight:[1800,0.9,1000],support:[1600,0.84,650]};
    const [maxSide,initialQ,maxKB]=limits[kind]||limits.post;
    let scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
    let w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{alpha:false});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,w,h);
    let quality=initialQ,blob=await new Promise(r=>canvas.toBlob(r,'image/webp',quality));
    if(!blob)blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',quality));
    while(blob&&blob.size>maxKB*1024&&quality>0.68){quality-=0.04;blob=await new Promise(r=>canvas.toBlob(r,'image/webp',quality));if(!blob)break}
    if(blob&&blob.size>maxKB*1024){
      const factor=Math.sqrt((maxKB*1024)/blob.size);canvas.width=Math.max(1,Math.round(w*factor));canvas.height=Math.max(1,Math.round(h*factor));ctx.drawImage(img,0,0,canvas.width,canvas.height);blob=await new Promise(r=>canvas.toBlob(r,'image/webp',0.82));
    }
    return blob||file;
  }finally{URL.revokeObjectURL(src)}
}
async function prepareMedia(file,kind='post'){
  if(!file)return null;
  if(file.type.startsWith('image/')){const blob=await imageBlobFromFile(file,kind);return {blob,name:'media-'+Date.now()+'.webp',type:'image/webp'};}
  if(file.type.startsWith('video/')){const blob=await compressVideoFile(file);const type=blob.type||'video/mp4';return {blob,name:'media-'+Date.now()+(type.includes('webm')?'.webm':'.mp4'),type};}
  throw new Error('Formato de mídia não suportado.');
}
async function compressVideoFile(file){
  if(!window.MediaRecorder||!HTMLVideoElement.prototype.captureStream)return file;
  const url=URL.createObjectURL(file);let video;
  try{
    video=document.createElement('video');video.src=url;video.muted=true;video.playsInline=true;await new Promise((res,rej)=>{video.onloadedmetadata=res;video.onerror=rej});
    const maxSide=1080,scale=Math.min(1,maxSide/Math.max(video.videoWidth,video.videoHeight));const w=Math.max(2,Math.round(video.videoWidth*scale/2)*2),h=Math.max(2,Math.round(video.videoHeight*scale/2)*2);
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');
    const stream=canvas.captureStream(30);const audio=video.captureStream?.().getAudioTracks?.()[0];if(audio)stream.addTrack(audio);
    const types=['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9,opus','video/webm'];const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:Math.min(4000000,Math.max(1600000,w*h*1.7))}:undefined);const chunks=[];
    const done=new Promise((resolve,reject)=>{rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onerror=reject;rec.onstop=()=>resolve(new Blob(chunks,{type:rec.mimeType||mime||'video/webm'}))});
    let raf=0;const draw=()=>{if(video.paused||video.ended)return;ctx.drawImage(video,0,0,w,h);raf=requestAnimationFrame(draw)};video.currentTime=0;await video.play();rec.start(250);draw();await new Promise(resolve=>{video.onended=resolve});cancelAnimationFrame(raf);rec.stop();const out=await done;return out.size<file.size?out:file;
  }catch(_){return file}finally{try{video?.pause()}catch(_){}URL.revokeObjectURL(url)}
}
async function uploadMedia(file,folder='media',kind='post'){
  const prepared=await prepareMedia(file,kind);const ext=prepared.type==='image/webp'?'webp':prepared.type.includes('mp4')?'mp4':'bin';const path=`${me?.id||'anonymous'}/${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

/* ===================== STORIES v2 (estilo Instagram) ===================== */
const SV_IMG_MS=5000,SV_MAX_VIDEO_MS=60000;
let SV={groups:[],gi:0,si:0,raf:0,elapsed:0,last:0,ready:false,dur:SV_IMG_MS,holdPause:false,focusPause:false,menuPause:false,muted:false,audio:null};
let storySeen=new Set(),storyLikes=new Set(),closeFriends=new Set(),closeOf=new Set(),storyMutedUsers=new Set();
function lsGet(k,def){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?def:v}catch(_){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}
function timeAgo(ms){const m=Math.floor((Date.now()-ms)/60000);if(m<1)return 'agora';if(m<60)return m+' min';const h=Math.floor(m/60);if(h<24)return h+' h';return Math.floor(h/24)+' d'}

async function loadStories(){
  if(!me?.id)return [];
  storySeen=new Set(lsGet('cm_seen_stories',[]));
  storyMutedUsers=new Set(lsGet('cm_muted_story_users',[]));
  closeFriends=new Set(lsGet('cm_close_friends',[]));
  try{
    const nowIso=new Date().toISOString();
    const base='id,user_id,media_url,media_type,caption,music,link_url,created_at,expires_at';
    let r=await sb.from('stories').select(base+',audience').gt('expires_at',nowIso).order('created_at',{ascending:true});
    if(r.error)r=await sb.from('stories').select(base).gt('expires_at',nowIso).order('created_at',{ascending:true});
    if(r.error)throw r.error;
    try{const cf=await sb.from('close_friends').select('owner_id,friend_id').or(`owner_id.eq.${me.id},friend_id.eq.${me.id}`);if(!cf.error&&Array.isArray(cf.data)){closeFriends=new Set(cf.data.filter(x=>x.owner_id===me.id).map(x=>x.friend_id));closeOf=new Set(cf.data.filter(x=>x.friend_id===me.id).map(x=>x.owner_id))}}catch(_){}
    const rows=(r.data||[]).filter(x=>x.user_id===me.id||(x.audience||'all')!=='close'||closeOf.has(x.user_id));
    const ids=[...new Set(rows.map(x=>x.user_id))];
    let profiles=[];
    if(ids.length){const pr=await sb.from('profiles').select('id,name,photo').in('id',ids);profiles=pr.data||[]}
    const map=new Map(profiles.map(x=>[x.id,x]));
    const sids=rows.map(x=>x.id);
    if(sids.length){
      try{const v=await sb.from('story_views').select('story_id').eq('viewer_id',me.id).in('story_id',sids);if(!v.error&&v.data)v.data.forEach(x=>storySeen.add(x.story_id))}catch(_){}
      try{const l=await sb.from('story_likes').select('story_id').eq('user_id',me.id).in('story_id',sids);if(!l.error&&l.data)storyLikes=new Set(l.data.map(x=>x.story_id))}catch(_){}
    }
    storiesCache=rows.map(x=>{const p=map.get(x.user_id)||{};return{id:x.id,owner:x.user_id===me.id?'me':x.user_id,user_id:x.user_id,name:p.name||'Usuário',photo:p.photo||avatar(p.name||'Usuário'),image:x.media_url,type:x.media_type,text:x.caption||'',link:x.link_url||'',music:x.music||'',audience:x.audience||'all',created:new Date(x.created_at).getTime()}});
    return storiesCache;
  }catch(_){return storiesCache}
}

function storyGroups(){
  const by=new Map();
  getStories().forEach(s=>{
    if(s.owner!=='me'&&storyMutedUsers.has(s.user_id))return;
    const g=by.get(s.user_id)||{uid:s.user_id,mine:s.owner==='me',name:s.name,photo:s.photo,items:[]};
    g.items.push(s);by.set(s.user_id,g);
  });
  const arr=[...by.values()];
  arr.forEach(g=>{g.items.sort((a,b)=>a.created-b.created);g.allSeen=g.items.every(i=>storySeen.has(i.id));g.close=g.items.some(i=>i.audience==='close')});
  arr.sort((a,b)=>(Number(b.mine)-Number(a.mine))||(Number(a.allSeen)-Number(b.allSeen))||(b.items[b.items.length-1].created-a.items[a.items.length-1].created));
  return arr;
}

function stories(){
  const gs=storyGroups(),own=gs.find(g=>g.mine),others=gs.filter(g=>!g.mine),p=profileData();
  const cls=g=>g.allSeen?'seen':(g.close?'close':'');
  const ownHtml=`<div class="storyCircle" onclick="${own?`openStories('${esc(own.uid)}')`:'newStory()'}"><div class="storyRingWrap"><div class="storyRing ${own?cls(own):'none'}"><img src="${esc(own?own.photo:p.photo)}" alt=""></div><button class="storyPlus" aria-label="Novo story" onclick="event.stopPropagation();newStory()">+</button></div><div>Seu story</div></div>`;
  const othersHtml=others.map(g=>`<div class="storyCircle" onclick="openStories('${esc(g.uid)}')"><div class="storyRingWrap"><div class="storyRing ${cls(g)}"><img src="${esc(g.photo)}" alt=""></div></div><div>${esc((g.name||'Usuário').split(' ')[0])}</div></div>`).join('');
  return `<div class="sectionHead"><h2>Stories</h2><button class="link" onclick="storySettings()">⚙ Configurações</button></div><div class="stories">${ownHtml}${othersHtml}</div>`;
}
function refreshStoryTray(){const el=document.getElementById('homeStories');if(el)el.innerHTML=stories()}
function openMyStoryOrNew(){const g=storyGroups().find(x=>x.mine);if(g)openStories(g.uid);else newStory()}

/* ---------- Visualizador ---------- */
function openStories(uid){
  SV.groups=storyGroups();SV.gi=SV.groups.findIndex(g=>g.uid===uid);
  if(SV.gi<0)return;
  SV.si=svStartIndex(SV.groups[SV.gi]);SV.muted=false;
  svBuild();svShow();
}
function svStartIndex(g){const i=g.items.findIndex(x=>!storySeen.has(x.id));return i<0?0:i}
function svBuild(){
  document.getElementById('sv')?.remove();
  document.body.classList.add('svOpen');
  document.body.insertAdjacentHTML('beforeend',`<div id="sv" class="sv"><div class="svBox" id="svBox"><div class="svMedia" id="svMedia"></div><div class="svShade"></div><div class="svBars" id="svBars"></div><div class="svHead" id="svHead"></div><div class="svOver" id="svOver"></div><div class="svFoot" id="svFoot"></div></div><button class="svX" aria-label="Fechar" onclick="svClose()">×</button></div>`);
  const box=document.getElementById('svBox');let st=null;
  box.addEventListener('pointerdown',e=>{
    if(e.target.closest('button,a,input,form,.svFoot,.svHead'))return;
    st={x:e.clientX,y:e.clientY,t:Date.now(),dy:0,moved:false,hold:setTimeout(()=>{if(st){SV.holdPause=true;box.classList.add('svHold');svApplyPause()}},220)};
    try{box.setPointerCapture(e.pointerId)}catch(_){}
  });
  box.addEventListener('pointermove',e=>{
    if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(Math.abs(dx)>10||Math.abs(dy)>10)st.moved=true;
    if(dy>0&&Math.abs(dy)>Math.abs(dx)){st.dy=dy;box.style.transform=`translateY(${dy}px) scale(${1-Math.min(dy,300)/1500})`}
  });
  const end=e=>{
    if(!st)return;clearTimeout(st.hold);const s=st;st=null;
    box.style.transform='';box.classList.remove('svHold');
    const wasHold=SV.holdPause;SV.holdPause=false;svApplyPause();
    if(s.dy>110){svClose();return}
    if(e.type==='pointercancel'||wasHold||s.moved)return;
    const r=box.getBoundingClientRect();(e.clientX-r.left<r.width*.3)?svPrev():svNext();
  };
  box.addEventListener('pointerup',end);box.addEventListener('pointercancel',end);
  document.addEventListener('keydown',svKey);
}
function svKey(e){if(!document.getElementById('sv'))return;if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')svNext();else if(e.key==='ArrowLeft')svPrev();else if(e.key==='Escape')svClose()}
function svCur(){const g=SV.groups[SV.gi];return g?g.items[SV.si]:null}
function svShow(){
  cancelAnimationFrame(SV.raf);svStopAudio();
  const g=SV.groups[SV.gi],it=g&&g.items[SV.si];if(!it){svClose();return}
  SV.elapsed=0;SV.last=0;SV.ready=false;SV.dur=SV_IMG_MS;SV.holdPause=false;SV.focusPause=false;SV.menuPause=false;
  const mine=it.owner==='me';
  document.getElementById('svBars').innerHTML=g.items.map((x,i)=>`<i><b style="width:${i<SV.si?100:0}%"></b></i>`).join('');
  const hasSound=it.type==='video'||!!it.music;
  document.getElementById('svHead').innerHTML=`<div class="svUser" onclick="svOpenProfile()"><img class="avatar" src="${esc(g.photo)}" alt=""><b>${esc(mine?'Seu story':g.name)}</b><span>${timeAgo(it.created)}</span>${it.audience==='close'?'<em class="svStar" title="Amigos próximos">★</em>':''}</div><div class="svBtns">${hasSound?`<button aria-label="Som" id="svMute" onclick="svToggleMute()">${SV.muted?'🔇':'🔊'}</button>`:''}<button aria-label="Mais opções" onclick="svMenu()">⋯</button></div>`;
  const media=it.type==='video'
    ?`<video id="svVid" src="${esc(it.image)}" playsinline preload="auto" ${SV.muted?'muted':''}></video>`
    :`<img id="svImg" src="${esc(it.image)}" alt="">`;
  document.getElementById('svMedia').innerHTML=media;
  const m=document.getElementById('svMedia').firstElementChild;
  if(it.type==='video'){m.addEventListener('loadedmetadata',()=>{SV.dur=Math.min((m.duration||5)*1000,SV_MAX_VIDEO_MS)});m.addEventListener('canplay',svReady,{once:true})}
  else{m.addEventListener('load',svReady,{once:true})}
  m.addEventListener('error',svReady,{once:true});
  let over='';
  if(it.music){const t=String(it.music).split('|')[0];over+=`<div class="svMusic">🎵 ${esc(t)}</div>`}
  if(it.text)over+=`<div class="svCaption">${esc(it.text)}</div>`;
  if(it.link){let host=it.link;try{host=new URL(it.link).hostname.replace(/^www\./,'')}catch(_){}over+=`<a class="svLink" href="${esc(it.link)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(host)}</a>`}
  document.getElementById('svOver').innerHTML=over;
  document.getElementById('svFoot').innerHTML=mine
    ?`<button class="svAct" onclick="svViewers()">👁 <span id="svViewCount">Atividade</span></button><button class="svAct" onclick="svDelete()">🗑 Excluir</button>`
    :`<div class="svReact" id="svReact">${['❤️','🙌','🔥','😢','😮','😂'].map(e=>`<button type="button" onpointerdown="event.preventDefault()" onclick="svReaction('${e}')">${e}</button>`).join('')}</div><form class="svReply" onsubmit="svSendReply(event)"><input id="svInput" placeholder="Enviar mensagem para ${esc((g.name||'').split(' ')[0])}..." autocomplete="off" onfocus="svFocus(true)" onblur="svFocus(false)"><button type="button" class="svHeart ${storyLikes.has(it.id)?'on':''}" id="svHeart" aria-label="Curtir" onpointerdown="event.preventDefault()" onclick="svLike()">${storyLikes.has(it.id)?'♥':'♡'}</button></form>`;
  svMarkSeen(it);
  if(mine)svLoadViewCount(it);
  SV.raf=requestAnimationFrame(svTick);
}
function svReady(){
  if(SV.ready)return;SV.ready=true;SV.last=0;
  const it=svCur(),v=document.getElementById('svVid');
  if(v){v.muted=SV.muted;v.play().catch(()=>{v.muted=true;SV.muted=true;const b=document.getElementById('svMute');if(b)b.textContent='🔇';v.play().catch(()=>{})})}
  if(it&&it.music){const u=String(it.music).split('|')[1];if(u){SV.audio=new Audio(u);SV.audio.loop=true;SV.audio.muted=SV.muted;SV.audio.play().catch(()=>{})}}
  svApplyPause();
}
function svTick(ts){
  if(!document.getElementById('sv'))return;
  if(!SV.ready||svPaused()){SV.last=ts;SV.raf=requestAnimationFrame(svTick);return}
  const v=document.getElementById('svVid');let p;
  if(v){p=v.duration?(v.currentTime*1000)/Math.min(v.duration*1000,SV_MAX_VIDEO_MS):0}
  else{SV.elapsed+=ts-(SV.last||ts);p=SV.elapsed/SV.dur}
  SV.last=ts;
  const bar=document.querySelector(`#svBars i:nth-child(${SV.si+1}) b`);if(bar)bar.style.width=Math.min(100,p*100)+'%';
  if(p>=1||(v&&v.ended)){svNext();return}
  SV.raf=requestAnimationFrame(svTick);
}
function svPaused(){return SV.holdPause||SV.focusPause||SV.menuPause}
function svApplyPause(){
  const v=document.getElementById('svVid'),p=svPaused();
  if(v&&SV.ready){p?v.pause():v.play().catch(()=>{})}
  if(SV.audio){p?SV.audio.pause():SV.audio.play().catch(()=>{})}
}
function svStopAudio(){if(SV.audio){try{SV.audio.pause()}catch(_){}SV.audio=null}}
function svNext(){
  const g=SV.groups[SV.gi];
  if(SV.si<g.items.length-1){SV.si++;svShow()}
  else if(SV.gi<SV.groups.length-1){SV.gi++;SV.si=svStartIndex(SV.groups[SV.gi]);svShow()}
  else svClose();
}
function svPrev(){
  if(SV.si>0){SV.si--;svShow()}
  else if(SV.gi>0){SV.gi--;SV.si=0;svShow()}
  else svShow();
}
function svClose(){
  cancelAnimationFrame(SV.raf);svStopAudio();
  document.getElementById('sv')?.remove();document.body.classList.remove('svOpen');
  document.removeEventListener('keydown',svKey);
  refreshStoryTray();
}
function svMarkSeen(it){
  if(storySeen.has(it.id))return;
  storySeen.add(it.id);lsSet('cm_seen_stories',[...storySeen].slice(-500));
  if(it.owner!=='me'&&me?.id){try{sb.from('story_views').upsert({story_id:it.id,viewer_id:me.id},{onConflict:'story_id,viewer_id',ignoreDuplicates:true}).then(()=>{},()=>{})}catch(_){}}
}
function svToggleMute(){
  SV.muted=!SV.muted;
  const v=document.getElementById('svVid');if(v)v.muted=SV.muted;if(SV.audio)SV.audio.muted=SV.muted;
  const b=document.getElementById('svMute');if(b)b.textContent=SV.muted?'🔇':'🔊';
}
function svFocus(on){
  SV.focusPause=on;svApplyPause();
  document.getElementById('svReact')?.classList.toggle('on',on);
}
function svToast(msg){
  document.getElementById('svToast')?.remove();
  const box=document.getElementById('sv')||document.body;
  box.insertAdjacentHTML('beforeend',`<div id="svToast" class="svToast">${esc(msg)}</div>`);
  setTimeout(()=>document.getElementById('svToast')?.remove(),1800);
}
function svOpenProfile(){
  const g=SV.groups[SV.gi];if(!g)return;
  if(g.mine){svClose();go('profile');return}
  svClose();publicProfile(g.uid);
}
async function svSendDM(body){
  const it=svCur();if(!it||!me?.id||it.owner==='me')return false;
  const {error}=await sb.from('messages').insert({sender_id:me.id,receiver_id:it.user_id,body});
  return !error;
}
async function svSendReply(e){
  e.preventDefault();
  const inp=document.getElementById('svInput'),txt=(inp?.value||'').trim();if(!txt)return;
  inp.value='';inp.blur();
  const ok=await svSendDM('↩️ Respondeu ao seu story: '+txt);
  svToast(ok?'Mensagem enviada':'Não foi possível enviar agora');
}
async function svReaction(emoji){
  const ok=await svSendDM(emoji+' Reagiu ao seu story');
  if(ok){const f=document.createElement('div');f.className='svFloat';f.textContent=emoji;document.getElementById('svBox')?.appendChild(f);setTimeout(()=>f.remove(),1200)}
  else svToast('Não foi possível enviar agora');
  document.getElementById('svInput')?.blur();
}
async function svLike(){
  const it=svCur();if(!it||!me?.id)return;
  const on=!storyLikes.has(it.id);
  on?storyLikes.add(it.id):storyLikes.delete(it.id);
  const b=document.getElementById('svHeart');if(b){b.classList.toggle('on',on);b.textContent=on?'♥':'♡'}
  try{
    if(on)await sb.from('story_likes').upsert({story_id:it.id,user_id:me.id},{onConflict:'story_id,user_id',ignoreDuplicates:true});
    else await sb.from('story_likes').delete().eq('story_id',it.id).eq('user_id',me.id);
  }catch(_){}
}
async function svLoadViewCount(it){
  try{
    const r=await sb.from('story_views').select('viewer_id',{count:'exact',head:true}).eq('story_id',it.id);
    const el=document.getElementById('svViewCount');
    if(el&&!r.error&&typeof r.count==='number')el.textContent=r.count+(r.count===1?' visualização':' visualizações');
  }catch(_){}
}
function svModal(html){SV.menuPause=true;svApplyPause();openModal(html)}
function svModalClose(){closeModal();SV.menuPause=false;svApplyPause()}
async function svViewers(){
  const it=svCur();if(!it)return;
  svModal(`<div class="modalHead"><h2>Atividade do story</h2><button class="close" onclick="svModalClose()">×</button></div><div id="svViewList" class="list" style="margin-top:12px"><div class="empty">Carregando...</div></div>`);
  const box=()=>document.getElementById('svViewList');
  try{
    const v=await sb.from('story_views').select('viewer_id,viewed_at').eq('story_id',it.id).order('viewed_at',{ascending:false});
    if(v.error)throw v.error;
    const ids=[...new Set((v.data||[]).map(x=>x.viewer_id))];
    if(!ids.length){if(box())box().innerHTML='<div class="empty">Ninguém viu este story ainda.</div>';return}
    const [pr,lk]=await Promise.all([sb.from('profiles').select('id,name,photo').in('id',ids),sb.from('story_likes').select('user_id').eq('story_id',it.id)]);
    const pm=new Map((pr.data||[]).map(x=>[x.id,x])),liked=new Set((lk.data||[]).map(x=>x.user_id));

/* ---------- Criador de stories ---------- */
const SC_COLORS=['#ffffff','#000000','#ff3b30','#ff9500','#ffcc00','#34c759','#0a84ff','#bf5af2'];
const SC_GRADS=[['#f09433','#dc2743','#bc1888'],['#00c6ff','#0072ff'],['#11998e','#38ef7d'],['#8e2de2','#4a00e0'],['#232526','#414345'],['#ff512f','#dd2476']];
const SC_FONTS=[{n:'Clássico',f:px=>`800 ${px}px Inter,system-ui,sans-serif`},{n:'Máquina',f:px=>`700 ${px}px ui-monospace,Menlo,monospace`},{n:'Elegante',f:px=>`italic 700 ${px}px Georgia,serif`},{n:'Forte',f:px=>`900 ${px}px Impact,"Arial Black",sans-serif`,upper:true}];
const SC_EMOJIS=['😀','😍','🥰','😂','😎','🤩','😮','😢','🙏','👏','🔥','❤️','💚','✨','🌿','⛰️','🌄','☀️','🌧️','🍃','☕','🍷','🎉','📍','🏡','🚗','🥾','📸','🎶','⭐'];
let SC=null;
function scLum(c){const n=parseInt(c.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;return(.299*r+.587*g+.114*b)/255}
function newStory(){
  document.getElementById('sc')?.remove();
  SC={file:null,url:'',video:false,grad:null,gradI:0,items:[],sel:-1,mode:'',strokes:[],drawColor:'#ff3b30',drawW:.012,music:'',link:'',audience:'all',editing:-1,busy:false};
  document.body.classList.add('svOpen');
  document.body.insertAdjacentHTML('beforeend',`<div id="sc" class="sc"><div class="scTop"><button class="scIcon" aria-label="Fechar" onclick="scClose()">×</button><b>Novo story</b><button class="scIcon" aria-label="Configurações" onclick="storySettings()">⚙</button></div><div id="scBody" class="scBody"></div></div>`);
  scRenderPick();
}
function scClose(){

  document.getElementById('sc')?.remove();document.body.classList.remove('svOpen');SC=null;

function scRenderPick(){
  document.getElementById('scBody').innerHTML=`<div class="scPick"><button class="scBig" onclick="document.getElementById('scCam').click()"><span>📷</span>Câmera</button><button class="scBig" onclick="document.getElementById('scGal').click()"><span>🖼</span>Galeria</button><button class="scBig" onclick="scStartText()"><span>Aa</span>Texto</button><button class="scBig" onclick="storyArchive()"><span>🗂</span>Arquivo</button></div><input id="scCam" class="hidden" type="file" accept="image/*,video/*" capture="environment" onchange="scPicked(this)"><input id="scGal" class="hidden" type="file" accept="image/*,video/*" onchange="scPicked(this)">`;
}
function scPicked(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  SC.file=f;SC.video=f.type.startsWith('video/');SC.url=URL.createObjectURL(f);SC.grad=null;
  scRenderEdit();
}
function scStartText(){SC.file=null;SC.video=false;SC.grad=SC_GRADS[0];SC.gradI=0;scRenderEdit();scOpenTextEditor(-1)}
function scRenderEdit(){
  const bg=SC.grad?`<div class="scBg" id="scBg" style="background:linear-gradient(135deg,${SC.grad.join(',')})"></div>`:SC.video?`<video class="scBg" id="scBg" src="${SC.url}" autoplay loop muted playsinline></video>`:`<img class="scBg" id="scBg" src="${SC.url}" alt="">`;
  document.getElementById('scBody').innerHTML=`<div class="scStageWrap"><div class="scStage" id="scStage">${bg}<canvas id="scDraw" class="scDraw"></canvas><div id="scItems" class="scItems"></div><div id="scTrash" class="scTrash">🗑</div><div class="scTools"><button aria-label="Texto" onclick="scOpenTextEditor(-1)">Aa</button>${SC.video?'':`<button aria-label="Emoji" onclick="scEmojiPanel()">😊</button><button aria-label="Desenhar" onclick="scToggleDraw()">✏️</button>`}<button aria-label="Música" onclick="scMusicPanel()">🎵</button><button aria-label="Link" onclick="scLinkPanel()">🔗</button>${SC.grad?`<button aria-label="Cor de fundo" onclick="scNextGrad()">🎨</button>`:''}</div><div id="scDrawBar" class="scDrawBar hidden"></div><div id="scPanel" class="scPanel hidden"></div><div id="scSel" class="scSel hidden"></div></div><div class="scBottom"><div id="scAud" class="scAud"></div><button id="scPub" class="scPub" onclick="scPublish()">Compartilhar ➤</button></div></div>`;
  scSetupDraw();scRenderItems();scRenderAudience();
}
function scStageW(){const s=document.getElementById('scStage');return s?s.clientWidth:360}
function scFontCss(item,px){return SC_FONTS[item.font||0].f(px)}
function scRenderItems(){
  const box=document.getElementById('scItems');if(!box)return;const W=scStageW();
  box.innerHTML='';
  SC.items.forEach((it,i)=>{
    const el=document.createElement('div');el.className='scItem'+(i===SC.sel?' sel':'');el.dataset.i=i;
    const px=it.size/100*W;
    if(it.type==='emoji'){el.textContent=it.e;el.style.fontSize=px+'px'}
    else{
      el.style.font=scFontCss(it,px);el.style.fontSize=px+'px';el.style.textAlign='center';
      const t=SC_FONTS[it.font||0].upper?it.t.toUpperCase():it.t;
      el.innerHTML=t.split('\n').map(l=>`<span class="scLine" style="${it.bg?`background:${it.color};color:${scLum(it.color)>.6?'#000':'#fff'}`:`color:${it.color};text-shadow:0 1px 6px rgba(0,0,0,.45)`}">${esc(l)||'&nbsp;'}</span>`).join('<br>');
    }
    el.style.left=it.x+'%';el.style.top=it.y+'%';
    scBindDrag(el,i);box.appendChild(el);
  });
  scRenderSel();
}
function scBindDrag(el,i){
  let st=null;
  el.addEventListener('pointerdown',e=>{
    e.stopPropagation();st={x:e.clientX,y:e.clientY,moved:false};
    try{el.setPointerCapture(e.pointerId)}catch(_){}
  });
  el.addEventListener('pointermove',e=>{
    if(!st)return;const stg=document.getElementById('scStage').getBoundingClientRect();
    if(Math.abs(e.clientX-st.x)>5||Math.abs(e.clientY-st.y)>5){st.moved=true;document.getElementById('scTrash').classList.add('show')}
    if(!st.moved)return;
    const it=SC.items[i];it.x=Math.max(0,Math.min(100,(e.clientX-stg.left)/stg.width*100));it.y=Math.max(0,Math.min(100,(e.clientY-stg.top)/stg.height*100));
    el.style.left=it.x+'%';el.style.top=it.y+'%';
    const tr=document.getElementById('scTrash').getBoundingClientRect();
    document.getElementById('scTrash').classList.toggle('hot',e.clientY>tr.top-10&&Math.abs(e.clientX-(tr.left+tr.width/2))<60);
  });
  const end=e=>{
    if(!st)return;const s=st;st=null;
    const tr=document.getElementById('scTrash');const hot=tr&&tr.classList.contains('hot');
    tr&&tr.classList.remove('show','hot');
    if(s.moved&&hot){SC.items.splice(i,1);SC.sel=-1;scRenderItems();return}
    if(!s.moved){SC.sel=(SC.sel===i?-1:i);scRenderItems()}
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function scRenderSel(){
  const bar=document.getElementById('scSel');if(!bar)return;
  const it=SC.items[SC.sel];
  if(!it){bar.classList.add('hidden');return}
  bar.classList.remove('hidden');
  bar.innerHTML=`<span>Tamanho</span><input type="range" min="${it.type==='emoji'?10:3}" max="${it.type==='emoji'?60:18}" value="${it.size}" oninput="scSetSize(this.value)">${it.type==='text'?`<button onclick="scOpenTextEditor(${SC.sel})">✏️</button>`:''}<button onclick="scDeleteSel()">🗑</button>`;
}
function scSetSize(v){const it=SC.items[SC.sel];if(!it)return;it.size=Number(v);const el=document.querySelector(`.scItem[data-i="${SC.sel}"]`);if(el){const px=it.size/100*scStageW();el.style.fontSize=px+'px'}}
function scDeleteSel(){SC.items.splice(SC.sel,1);SC.sel=-1;scRenderItems()}
function scNextGrad(){SC.gradI=(SC.gradI+1)%SC_GRADS.length;SC.grad=SC_GRADS[SC.gradI];const b=document.getElementById('scBg');if(b)b.style.background=`linear-gradient(135deg,${SC.grad.join(',')})`}
function scPanelShow(html){const p=document.getElementById('scPanel');p.innerHTML=html;p.classList.remove('hidden')}
function scPanelHide(){document.getElementById('scPanel')?.classList.add('hidden')}
function scEmojiPanel(){scPanelShow(`<div class="scPanelHead"><b>Emojis</b><button onclick="scPanelHide()">×</button></div><div class="scEmojiGrid">${SC_EMOJIS.map(e=>`<button onclick="scAddEmoji('${e}')">${e}</button>`).join('')}</div>`)}
function scAddEmoji(e){SC.items.push({type:'emoji',e,x:50,y:28,size:28});SC.sel=SC.items.length-1;scPanelHide();scRenderItems()}
function scMusicPanel(){
  scPanelShow(`<div class="scPanelHead"><b>🎵 Música</b><button onclick="scPanelHide()">×</button></div>${storyMusicList.map((m,i)=>`<div class="settingRow" style="margin:6px 0"><span><b>${esc(m[0])}</b><small>${esc(m[1])}</small></span><button class="secondary" onclick="scPickMusic(${i})">${SC.music&&SC.music.startsWith(m[0]+'|')?'✓':'Usar'}</button></div>`).join('')}${SC.music?`<button class="secondary" style="width:100%" onclick="scPickMusic(-1)">Remover música</button>`:''}`)
}
function scPickMusic(i){SC.music=i<0?'':storyMusicList[i][0]+'|'+storyMusicList[i][2];scPanelHide()}
function scLinkPanel(){scPanelShow(`<div class="scPanelHead"><b>🔗 Link</b><button onclick="scPanelHide()">×</button></div><input id="scLinkIn" class="field" placeholder="https://..." inputmode="url" autocomplete="off" value="${esc(SC.link)}"><button class="primary" onclick="scSaveLink()">Adicionar link</button>`)}
function scSaveLink(){
  let v=(document.getElementById('scLinkIn').value||'').trim();
  if(v&&!/^https?:\/\//i.test(v))v='https://'+v;
  if(v){try{new URL(v)}catch(_){alert('Link inválido.');return}}
  SC.link=v;scPanelHide();
}
function scOpenTextEditor(idx){
  const cur=idx>=0?SC.items[idx]:{type:'text',t:'',color:'#ffffff',bg:false,font:0,size:8,x:50,y:50};
  SC.editing=idx;SC.draft={...cur};
  const st=document.getElementById('scStage');
  st.insertAdjacentHTML('beforeend',`<div id="scTxt" class="scTxt"><div class="scTxtBar"><button onclick="scTxtFont()" id="scTxtFontBtn">${SC_FONTS[SC.draft.font].n}</button><button onclick="scTxtBg()" id="scTxtBgBtn">${SC.draft.bg?'Fundo ✓':'Fundo'}</button><button class="scDone" onclick="scTxtDone()">Concluir</button></div><textarea id="scTxtIn" maxlength="220" placeholder="Digite algo..." oninput="scTxtInput()" style="color:${SC.draft.color}">${esc(SC.draft.t)}</textarea><div class="scTxtColors">${SC_COLORS.map(c=>`<button style="background:${c}" onclick="scTxtColor('${c}')" aria-label="Cor ${c}"></button>`).join('')}</div></div>`);
  setTimeout(()=>document.getElementById('scTxtIn')?.focus(),60);
  scTxtInput();
}
function scTxtInput(){
  const ta=document.getElementById('scTxtIn');if(!ta)return;const d=SC.draft;d.t=ta.value;
  const px=Math.max(14,d.size/100*scStageW());
  ta.style.font=scFontCss(d,px);ta.style.fontSize=px+'px';ta.style.color=d.bg?(scLum(d.color)>.6?'#000':'#fff'):d.color;ta.style.background=d.bg?d.color:'transparent';
  ta.style.textTransform=SC_FONTS[d.font].upper?'uppercase':'none';
}
function scTxtFont(){SC.draft.font=(SC.draft.font+1)%SC_FONTS.length;document.getElementById('scTxtFontBtn').textContent=SC_FONTS[SC.draft.font].n;scTxtInput()}
function scTxtBg(){SC.draft.bg=!SC.draft.bg;document.getElementById('scTxtBgBtn').textContent=SC.draft.bg?'Fundo ✓':'Fundo';scTxtInput()}
function scTxtColor(c){SC.draft.color=c;scTxtInput()}
function scTxtDone(){
  const d=SC.draft;d.t=(document.getElementById('scTxtIn')?.value||'').replace(/\s+$/,'');
  document.getElementById('scTxt')?.remove();
  if(d.t.trim()){if(SC.editing>=0)SC.items[SC.editing]=d;else{SC.items.push(d);SC.sel=SC.items.length-1}}
  else if(SC.editing>=0){SC.items.splice(SC.editing,1);SC.sel=-1}
  SC.draft=null;scRenderItems();
}
/* desenho */
function scSetupDraw(){
  const cv=document.getElementById('scDraw');if(!cv)return;
  const st=document.getElementById('scStage');cv.width=st.clientWidth*2;cv.height=st.clientHeight*2;
  scRedraw();
  let cur=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
  cv.addEventListener('pointerdown',e=>{if(SC.mode!=='draw')return;cur={c:SC.drawColor,w:SC.drawW,pts:[pt(e)]};SC.strokes.push(cur);try{cv.setPointerCapture(e.pointerId)}catch(_){}scRedraw()});
  cv.addEventListener('pointermove',e=>{if(!cur)return;cur.pts.push(pt(e));scRedraw()});
  const end=()=>{cur=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
}
function scPaintStrokes(ctx,W,H){
  ctx.lineCap='round';ctx.lineJoin='round';
  SC.strokes.forEach(s=>{
    ctx.strokeStyle=s.c;ctx.fillStyle=s.c;ctx.lineWidth=s.w*W;
    if(s.pts.length===1){ctx.beginPath();ctx.arc(s.pts[0][0]*W,s.pts[0][1]*H,s.w*W/2,0,Math.PI*2);ctx.fill();return}
    ctx.beginPath();s.pts.forEach((p,i)=>i?ctx.lineTo(p[0]*W,p[1]*H):ctx.moveTo(p[0]*W,p[1]*H));ctx.stroke();
  });
}
function scRedraw(){const cv=document.getElementById('scDraw');if(!cv)return;const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);scPaintStrokes(x,cv.width,cv.height)}
function scToggleDraw(){
  const bar=document.getElementById('scDrawBar'),cv=document.getElementById('scDraw');
  if(SC.mode==='draw'){SC.mode='';bar.classList.add('hidden');cv.classList.remove('on');return}
  SC.mode='draw';SC.sel=-1;scRenderItems();cv.classList.add('on');bar.classList.remove('hidden');
  bar.innerHTML=`${SC_COLORS.map(c=>`<button class="scDot ${c===SC.drawColor?'on':''}" style="background:${c}" onclick="scDrawColor('${c}')" aria-label="Cor ${c}"></button>`).join('')}<button onclick="scDrawW()">⬤</button><button onclick="scUndo()">↶</button><button class="scDone" onclick="scToggleDraw()">OK</button>`;
}
function scDrawColor(c){SC.drawColor=c;document.querySelectorAll('#scDrawBar .scDot').forEach(b=>b.classList.toggle('on',b.getAttribute('aria-label')==='Cor '+c))}
function scDrawW(){SC.drawW=SC.drawW<.02?(SC.drawW<.01?.012:.025):.006}
function scUndo(){SC.strokes.pop();scRedraw()}
/* audiência */
function scRenderAudience(){
  const el=document.getElementById('scAud');if(!el)return;
  el.innerHTML=`<button class="${SC.audience==='all'?'on':''}" onclick="scSetAudience('all')">👤 Seu story</button><button class="${SC.audience==='close'?'on close':''}" onclick="scSetAudience('close')">★ Amigos próximos${closeFriends.size?` (${closeFriends.size})`:''}</button>`;
}
function scSetAudience(a){SC.audience=a;scRenderAudience();if(a==='close'&&!closeFriends.size)closeFriendsEditor()}
/* publicar */
function scLoadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function scFlatten(){
  const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  if(SC.grad){const g=x.createLinearGradient(0,0,W,H);SC.grad.forEach((col,i,a)=>g.addColorStop(i/(a.length-1),col));x.fillStyle=g;x.fillRect(0,0,W,H)}
  else{
    const im=await scLoadImg(SC.url);
    const r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r;
    x.fillStyle='#000';x.fillRect(0,0,W,H);x.drawImage(im,(W-w)/2,(H-h)/2,w,h);
  }
  scPaintStrokes(x,W,H);
  const k=W;
  SC.items.forEach(it=>{
    const px=it.size/100*k,cx=it.x/100*W,cy=it.y/100*H;
    x.textAlign='center';x.textBaseline='middle';
    if(it.type==='emoji'){x.font=`${px}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;x.fillStyle='#fff';x.fillText(it.e,cx,cy);return}
    x.font=scFontCss(it,px);
    const lines=(SC_FONTS[it.font||0].upper?it.t.toUpperCase():it.t).split('\n'),lh=px*1.25,top=cy-(lines.length*lh)/2+lh/2;
    lines.forEach((ln,i)=>{
      const y=top+i*lh;
      if(it.bg){const w=x.measureText(ln||' ').width+px*.7;x.fillStyle=it.color;x.beginPath();if(x.roundRect)x.roundRect(cx-w/2,y-lh/2,w,lh,px*.3);else x.rect(cx-w/2,y-lh/2,w,lh);x.fill();x.fillStyle=scLum(it.color)>.6?'#000':'#fff'}
      else{x.fillStyle=it.color;x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=px*.25;x.shadowOffsetY=2}
      x.fillText(ln,cx,y);x.shadowColor='transparent';x.shadowBlur=0;x.shadowOffsetY=0;
    });
  });
  return new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',.9));
}
async function scPublish(){
  if(!SC||SC.busy)return;
  const btn=document.getElementById('scPub');
  if(!SC.file&&!SC.grad){alert('Escolha uma foto, um vídeo ou crie um story de texto.');return}
  if(SC.audience==='close'&&!closeFriends.size){alert('Adicione pessoas à lista de Amigos próximos primeiro.');closeFriendsEditor();return}
  SC.busy=true;if(btn){btn.disabled=true;btn.textContent='Publicando...'}
  try{
    let file=SC.file,caption='';
    if(SC.video){caption=SC.items.filter(i=>i.type==='text').map(i=>i.t).join('\n')}
    else{const blob=await scFlatten();if(!blob)throw new Error('Não foi possível preparar a imagem.');file=new File([blob],'story.jpg',{type:'image/jpeg'})}
    const media=await uploadMedia(file,'stories','story');
    const payload={user_id:me.id,media_url:media,media_type:SC.video?'video':'image',caption,link_url:SC.link||'',music:SC.music||'',expires_at:new Date(Date.now()+86400000).toISOString(),audience:SC.audience};
    let r=await sb.from('stories').insert(payload);
    if(r.error&&/audience/i.test(r.error.message||'')){
      if(SC.audience==='close'){throw new Error('Para usar Amigos próximos, rode o SQL de stories no Supabase (coluna audience).')}
      const {audience,...rest}=payload;r=await sb.from('stories').insert(rest);
    }
    if(r.error)throw r.error;
    scClose();await loadStories();refreshStoryTray();
    if(window.cmCurrentPage!=='home')go('home');
  }catch(e){
    alert(e.message||'Não foi possível publicar o story.');
    if(SC){SC.busy=false}if(btn){btn.disabled=false;btn.textContent='Compartilhar ➤'}
  }
}

start();
