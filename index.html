function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function avatar(name="CM"){return "https://ui-avatars.com/api/?name="+encodeURIComponent(name)+"&background=12384a&color=20df9a&bold=true"}
function profileData(){const m=me?.user_metadata||{};return{name:m.name||m.full_name||me?.email?.split("@")[0]||"Novo usuário",city:m.city||"Cidade não informada",bio:m.bio||"Ainda não adicionou uma descrição.",photo:m.photo||avatar(m.name||"Novo usuário"),cover:m.cover||"mantiqueira-hero.jpg",interests:m.interests||"",links:m.links||"",highlights:Array.isArray(m.highlights)?m.highlights:[],aboutPublic:m.aboutPublic!==false}}
function getPosts(){try{const v=JSON.parse(localStorage.getItem("cm_posts")||"[]");return Array.isArray(v)?v:[]}catch(_){return []}}
function savePosts(posts){localStorage.setItem("cm_posts",JSON.stringify(Array.isArray(posts)?posts:[]))}
function nav(active){return `<nav class="nav"><button class="${active==="home"?"active":""}" onclick="go('home')"><span class="nicon">⌂</span>Início</button><button class="${active==="chat"?"active":""}" onclick="go('chat')"><span class="nicon">◌</span>Bate-papo</button><button class="${active==="explore"?"active":""}" onclick="go('explore')"><span class="nicon">⌕</span>Explorar</button><button class="${active==="profile"?"active":""}" onclick="go('profile')"><span class="nicon">♙</span>Perfil</button></nav>`}
function screen(content,active){return `<main class="screen">${content}</main>${nav(active)}`}
function stories(){const own=getStories().filter(s=>s.owner==="me");return `<div class="sectionHead"><h2>Status</h2><span class="link">24 horas</span></div><div class="stories"><div class="storyCircle" onclick="newStory()"><div class="storyRing storyAdd">+</div><div>Seu status</div></div>${own.length?`<div class="storyCircle" onclick="viewMyStory()"><div class="storyRing"><img src="${own[0].image}"></div><div>Seu status</div></div>`:""}</div>`}
function home(){const p=profileData();const realPeople=getPublicPeople().filter(x=>x.photo).slice(0,12);return screen(`<div class="brand">Conecta <span>Mantiqueira</span></div><div class="heroTitle">Olá, ${esc(p.name)}! 👋</div><div class="sub">Que bom te ver por aqui!</div>${stories()}<input id="homePeopleSearch" class="search" placeholder="⌕  Buscar pessoas, cidades, interesses..." oninput="filterPeopleLive(this.value)" autocomplete="off"><div id="homeSearchResults"></div><div class="grid4"><button class="quick" onclick="go('people')"><div class="ico">♙</div><small>Pessoas<br>da região</small></button><button class="quick" onclick="go('groups')"><div class="ico">♧</div><small>Grupos<br>da região</small></button><button class="quick" onclick="go('business')"><div class="ico">⌂</div><small>Comércios<br>e serviços</small></button><button class="quick" onclick="go('explore')"><div class="ico">•••</div><small>Mais</small></button></div><div class="sectionHead"><h2>Pessoas por cidade</h2><button class="link" onclick="citySearch()">Pesquisar cidades</button></div><div class="cityGrid"><button class="city c1" onclick="go('people','Sapucaí-Mirim')">⌖ Sapucaí-Mirim<small>Ver pessoas</small></button><button class="city c2" onclick="go('people','Santo Antônio do Pinhal')">⌖ Santo Antônio do Pinhal<small>Ver pessoas</small></button><button class="city c3" onclick="go('people','São Bento do Sapucaí')">⌖ São Bento do Sapucaí<small>Ver pessoas</small></button><button class="city c4" onclick="go('people','Paraisópolis')">⌖ Paraisópolis<small>Ver pessoas</small></button></div><div class="sectionHead"><h2>Pessoas da região</h2></div><div class="peopleRow">${realPeople.length?realPeople.map(p=>`<div class="personMini" onclick="publicProfile('${esc(p.id)}')"><img class="avatar" src="${esc(p.photo)}"><small>${esc(p.name.split(" ")[0])}<br>${esc(p.city||"")}</small></div>`).join(""):"<div class='empty'>Ainda não há outros perfis cadastrados. Conforme as pessoas criarem suas contas, elas aparecerão aqui.</div>"}</div><div class="sectionHead"><h2>Grupos da região</h2><button class="link" onclick="go('groups')">Ver todos</button></div>${groupPreview()}</div>`,'home')}
function normText(v){return String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function filterPeopleLive(v){const q=normText((v||"").trim());const el=document.getElementById("homeSearchResults");if(!el)return;if(q.length<2){el.innerHTML="";return}const all=getPublicPeople();const list=all.filter(p=>normText((p.name||"")+" "+(p.city||"")+" "+(p.bio||"")).includes(q));const cityMatches=cities.filter(c=>normText(c).includes(q)).slice(0,8);el.innerHTML=(cityMatches.length?`<div class="card" style="padding:10px;margin:0 0 10px"><b>Cidades encontradas</b>${renderCityButtons(cityMatches)}</div>`:"")+`<div class="list">${renderPeopleList(list,q)}</div>`}
function filterPeopleResults(v){const q=normText((v||"").trim());currentCity=(v||"").trim();const listBox=document.getElementById("peopleResults");const cityBox=document.getElementById("peopleCityResults");if(!listBox)return;const all=getPublicPeople();const list=all.filter(p=>normText((p.name||"")+" "+(p.city||"")+" "+(p.bio||"")).includes(q));const cityMatches=q?cities.filter(c=>normText(c).includes(q)).slice(0,12):[];if(cityBox)cityBox.innerHTML=cityMatches.length?`<div class="small" style="margin:8px 0">Cidades encontradas</div>${renderCityButtons(cityMatches)}`:"";listBox.innerHTML=renderPeopleList(list,q)}
function renderPeopleList(list,q){return list.length?list.map(p=>`<div class="person" onclick="publicProfile('${p.id}')"><img class="avatar" src="${esc(p.photo)}"><div class="personInfo"><b>${esc(p.name)}</b><span>${esc(p.city)}</span><span class="online">● Online agora</span></div><button class="followBtn ${isFollowing(p.id)?"following":""}" onclick="event.stopPropagation();toggleFollow('${p.id}')">${isFollowing(p.id)?"Seguindo":"Seguir"}</button></div>`).join(""):"<div class='empty'>Não encontrei pessoas nessa cidade ou busca. Assim que pessoas se cadastrarem com essa cidade, elas aparecerão aqui.</div>"}
async function loadPublicProfiles(){try{const {data,error}=await sb.from("profiles").select("id,name,city,bio,photo,cover,interests,links").limit(1000);if(!error&&Array.isArray(data))publicProfilesCache=data}catch(_){}}
function getPublicPeople(){let list=[...publicProfilesCache];if(me){const p=profileData();list.unshift({id:me.id,name:p.name,city:p.city,photo:p.photo,bio:p.bio})}const seen=new Set();return list.filter(p=>{if(!p?.id||seen.has(p.id))return false;seen.add(p.id);p.photo=p.photo||avatar(p.name||"Novo usuário");return true})}
function isFollowing(id){return JSON.parse(localStorage.getItem("cm_follows")||"[]").includes(id)}
function toggleFollow(id){let a=JSON.parse(localStorage.getItem("cm_follows")||"[]");a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem("cm_follows",JSON.stringify(a));if(currentPublicUser?.id===id)go("publicProfile");else {const q=currentCity;go("people",q)}}
function people(query=""){currentCity=query;const q=String(query||"");const all=getPublicPeople();const nq=normText(q);const list=all.filter(p=>normText((p.name||"")+" "+(p.city||"")).includes(nq));const cityMatches=q?cities.filter(c=>normText(c).includes(nq)).slice(0,12):[];const html=screen(`<button class="ghost" onclick="go('home')">← Voltar</button><h1>${q?`Pessoas em ${esc(q)}`:"Pessoas da região"}</h1><div class="sub">Digite a cidade ou o nome completo. A busca permanece no mesmo campo enquanto você escreve.</div><input id="peopleSearch" class="search" value="${esc(q)}" placeholder="Pesquisar pessoa ou cidade" oninput="filterPeopleResults(this.value)" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false"><div id="peopleCityResults">${cityMatches.length?`<div class="small" style="margin:8px 0">Cidades encontradas</div>${renderCityButtons(cityMatches)}`:""}</div><div class="grid4" style="margin:12px 0"><button class="quick" onclick="go('people')">Todas</button><button class="quick" onclick="go('people','Sapucaí-Mirim')">Sapucaí</button><button class="quick" onclick="go('people','Santo Antônio do Pinhal')">Santo Antônio</button><button class="quick" onclick="go('people','São Bento do Sapucaí')">São Bento</button></div><div id="peopleResults" class="list">${renderPeopleList(list,q)}</div>`,'explore');setTimeout(async()=>{await loadPublicProfiles();const el=document.getElementById('peopleResults');if(el){const fresh=getPublicPeople().filter(p=>normText((p.name||'')+' '+(p.city||'')).includes(normText(String(currentCity||''))));el.innerHTML=renderPeopleList(fresh,currentCity)}},0);return html}
function citySearch(){openModal(`<div class="modalHead"><h2>Pesquisar cidades</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Digite a cidade inteira ou apenas parte do nome. A lista não fecha enquanto você digita.</div><input id="citySearchInput" class="search" placeholder="Ex.: Campos do Jordão" oninput="filterCityModal(this.value)" autocomplete="off"><div id="citySearchList" class="citySearchList">${renderCityButtons(cities)}</div>`);setTimeout(()=>document.getElementById('citySearchInput')?.focus(),50)}
function renderCityButtons(list){return list.map(c=>`<button class="citySearchItem" onclick="closeModal();go('people','${esc(c)}')">⌖ ${esc(c)}</button>`).join("")||'<div class="empty">Nenhuma cidade encontrada.</div>'}
function filterCityModal(v){const q=normText((v||"").trim());const list=cities.filter(c=>normText(c).includes(q));const el=document.getElementById("citySearchList");if(el)el.innerHTML=renderCityButtons(list)}
function publicProfile(id){const p=getPublicPeople().find(x=>x.id===id);if(!p)return;currentPublicUser=p;go("publicProfile")}
function publicProfileScreen(){const p=currentPublicUser;if(!p)return people();const aboutPublic=p.aboutPublic!==false;const about=aboutPublic?`<div class="card"><h3>Sobre</h3><p class="sub">${esc(p.bio||'Ainda não adicionou uma descrição.')}</p>${p.interests?`<p><b>Interesses:</b><br>${p.interests.split(',').map(x=>`<span class="pill">${esc(x.trim())}</span>`).join(' ')}</p>`:''}${p.links?`<div><b>Links</b>${p.links.split('\n').filter(Boolean).map(x=>{const q=x.split('|');return `<a class="linkBtn" href="${esc(q[1]||q[0])}" target="_blank" rel="noopener">🔗 ${esc(q[0]||'Abrir link')}</a>`}).join('')}</div>`:''}</div>`:`<div class="aboutPrivate">🔒 Este perfil optou por manter as informações da seção Sobre privadas.</div>`;return screen(`<button class="ghost" onclick="go('people')">← Voltar</button><div class="card profileCard"><div class="profileCover" style="background-image:url('${esc(p.cover||'mantiqueira-hero.jpg')}')"></div><div class="profileBody"><img class="profileAvatar" src="${esc(p.photo||avatar(p.name))}"><h1>${esc(p.name)}</h1><div class="sub">⌾ ${esc(p.city)}</div><p class="sub">${esc(p.bio||'Pessoa da região conectada à Mantiqueira. 🌿')}</p><div class="profileActions"><button class="followBtn ${isFollowing(p.id)?"following":""}" onclick="toggleFollow('${p.id}')">${isFollowing(p.id)?"Seguindo ✓":"Seguir"}</button><button class="secondary" onclick="go('conversation')">Mensagem</button></div><div class="stats"><div><b>0</b><span>Publicações</span></div><div><b>${isFollowing(p.id)?1:0}</b><span>Amigos</span></div><div><b>0</b><span>Interesses</span></div></div><div class="tabs"><button class="tab active">Publicações</button><button class="tab">Fotos</button><button class="tab">Sobre</button></div><div class="empty">Ainda não há publicações.</div>${about}</div></div>`,'explore')}
function explore(){return screen(`<h1>Explorar</h1><div class="grid4" style="margin:18px 0"><button class="quick" style="background:var(--green);color:#052018">Feed</button><button class="quick" onclick="go('news')">📰 Notícias</button><button class="quick" onclick="go('groups')">Grupos</button><button class="quick" onclick="go('business')">Comércios</button></div><div class="sectionHead"><h2>Feed da região</h2><button class="link" onclick="newPost()">＋ Publicar</button></div><div class="sub">O Feed mostra somente publicações feitas por pessoas cadastradas no Conecta Mantiqueira. Notícias ficam em uma área própria e nunca se misturam com as publicações.</div><div id="feed"></div>`,'explore')}
function newsScreen(){return screen(`<button class="ghost" onclick="go('explore')">← Voltar</button><h1>📰 Notícias da Mantiqueira</h1><div class="sub">Notícias ficam separadas do Feed. Puxe a tela para baixo para buscar matérias novas.</div><div id="newsPull" class="newsPull">Solte para atualizar notícias ↓</div><div class="newsRefresh"><span id="newsStatus">Atualizando notícias...</span><button class="newsRefreshBtn" onclick="refreshNews(true)">↻ Atualizar</button></div><div id="newsList" class="newsSeparate"></div><div class="small">As manchetes são buscadas em fontes públicas de notícias da região. A matéria completa permanece na fonte original.</div>`,'explore')}
function renderFeed(){const el=document.getElementById("feed");if(!el)return;const all=getPosts();if(!all.length){el.innerHTML='<div class="empty">Ainda não há publicações reais. Seja o primeiro a publicar! 📸</div>';return}el.innerHTML=all.slice().reverse().map(p=>`<article class="card post"><div class="postTop"><img class="avatar" src="${p.photo||avatar(p.name)}"><div><b>${esc(p.name)}</b><span>${esc(p.city||"Mantiqueira")} • agora</span></div></div>${p.text?`<p>${esc(p.text)}</p>`:""}${p.image?`<img src="${p.image}">`:""}<div class="postActions"><button class="action" onclick="likePost('${p.id}')">♥ ${p.likes||0}</button><button class="action" onclick="commentPost('${p.id}')">💬 Comentar</button><button class="action" onclick="sharePost('${p.id}')">↗ Compartilhar</button></div><div class="commentList">${getComments(p.id).map(c=>`<div class="commentItem"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`).join()}</div></article>`).join("")}
function newPost(){openModal(`<div class="modalHead"><h2>Nova publicação</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Publique uma foto e uma descrição, como no Instagram.</div><textarea id="postText" class="textarea" placeholder="Escreva uma legenda..."></textarea><input id="postFile" class="fileInput" type="file" accept="image/*,video/*"><input id="postImage" class="field" placeholder="Ou cole o link de uma foto"><button class="primary" onclick="saveNewPost()">Publicar agora</button>`)}
async function saveNewPost(){const p=profileData(),file=document.getElementById("postFile").files[0],text=document.getElementById("postText").value.trim(),url=document.getElementById("postImage").value.trim();if(!text&&!file&&!url)return alert("Adicione uma foto ou escreva alguma coisa.");const image=file?await fileToData(file):url;const a=getPosts();a.push({id:Date.now().toString(),ownerId:me?.id||'',name:p.name,city:p.city,photo:p.photo,text,image,likes:0,created:Date.now()});savePosts(a);closeModal();go('explore')}
function likePost(id){const a=getPosts(),p=a.find(x=>x.id===id);if(p)p.likes=(p.likes||0)+1;savePosts(a);renderFeed()}
function commentPost(id){const c=prompt("Digite seu comentário:");if(!c)return;const a=getComments(id);const p=profileData();a.push({id:Date.now().toString(),name:p.name,text:c,created:Date.now()});localStorage.setItem("cm_comments_"+id,JSON.stringify(a));if(document.getElementById("profilePages"))go("profile");else renderFeed()}
function sharePost(id){const url=location.href+"#post-"+id;if(navigator.share)navigator.share({title:"Conecta Mantiqueira",text:"Confira esta publicação no Conecta Mantiqueira",url});else{navigator.clipboard?.writeText(url);alert("Link da publicação copiado para compartilhar.")}}
function businessScreen(){return screen(`<h1>Comércios e serviços</h1><div class="sub">Descubra negócios da região, vitrines, produtos e links.</div><input class="search" placeholder="⌕ Buscar por nome ou categoria..."><button class="primary" onclick="newBusiness()">＋ Criar meu comércio</button><div class="sectionHead"><h2>Destaques da região</h2></div><div class="card">${business.map(b=>`<div class="business"><img src="${b[3]}"><div class="businessInfo"><b>${b[0]}</b><span>${b[1]}</span><div class="stars">★ ${b[2]}</div><a class="businessLink" href="${b[4]}" target="_blank">Ver comércio ↗</a></div></div>`).join("")}</div>`,'explore')}

function profile(){const p=profileData(),posts=getPosts().filter(x=>x.ownerId===me?.id || x.name===p.name),photos=posts.filter(x=>x.image);return screen(`<h1>Meu perfil</h1><div class="card profileCard"><div class="profileCover" style="background-image:url('${esc(p.cover)}')"></div><div class="profileBody"><div class="profileAvatarRing" onclick="newStory()" title="Adicionar status"><img class="profileAvatar" src="${esc(p.photo)}"></div><div class="profileTopTools"><button class="profileMiniBtn" onclick="settingsScreen()" title="Configurações">⚙</button></div><h1>${esc(p.name)}</h1><div class="sub">⌾ ${esc(p.city)}</div><p class="sub">${esc(p.bio)}</p><div class="highlightBar"><span class="highlightLabel">Destaques</span><div class="highlightRow compact"><div class="highlight"><div class="highlightCircle highlightAdd" onclick="addHighlight()">+</div></div>${p.highlights.map(h=>`<div class="highlight" onclick="viewHighlight(${JSON.stringify(h.images||[h.image]).replace(/"/g,"&quot;")},${JSON.stringify(h.name).replace(/"/g,"&quot;")})"><img class="highlightCircle" src="${esc(h.image)}"><div>${esc(h.name)}</div></div>`).join('')}</div><button class="publishMini" onclick="newPost()" title="Nova publicação">+</button></div><div class="profileActions"><button class="followBtn" onclick="editProfile()">Editar perfil</button></div><div class="stats"><div><b>${posts.length}</b><span>Publicações</span></div><div><b>0</b><span>Amigos</span></div><div><b>${p.interests?p.interests.split(',').filter(Boolean).length:0}</b><span>Interesses</span></div></div><div class="tabs"><button class="tab active" onclick="profileTab(0)">Publicações</button><button class="tab" onclick="profileTab(1)">Fotos</button><button class="tab" onclick="profileTab(2)">Sobre</button></div><div id="profilePages" class="tabPages"><div class="tabPage">${posts.length?posts.slice().reverse().map(profilePostHtml).join(''):`<div class='empty'>Você ainda não publicou nada.</div>`}</div><div class="tabPage"><button class="photoAdd" onclick="newPhoto()">＋ Publicar nova foto</button>${photos.length?`<div class="photoGrid">${photos.map(x=>`<img src="${esc(x.image)}" onclick="openImage('${encodeURIComponent(x.image)}')">`).join('')}</div>`:`<div class='empty'>Suas fotos aparecerão aqui.</div>`}</div><div class="tabPage"><div class="card"><h3>Sobre</h3><p class="sub">${esc(p.bio)}</p>${p.interests?`<p><b>Interesses:</b><br>${p.interests.split(',').map(x=>`<span class="pill">${esc(x.trim())}</span>`).join(' ')}</p>`:''}${p.links?`<div><b>Links</b>${p.links.split('\n').filter(Boolean).map(x=>{const q=x.split('|');return `<a class="linkBtn" href="${esc(q[1]||q[0])}" target="_blank" rel="noopener">🔗 ${esc(q[0]||'Abrir link')}</a>`}).join('')}</div>`:''}<div class="small" style="margin-top:12px">${p.aboutPublic?'🌎 Estas informações estão públicas para outros usuários.':'🔒 Estas informações estão privadas para outras pessoas.'}</div></div></div></div></div></div>`,'profile')}
function profilePostHtml(x){const comments=getComments(x.id);return `<article class="card post photoPost"><div class="postTop"><img class="avatar" src="${esc(x.photo||avatar(x.name))}"><div><b>${esc(x.name)}</b><span>${esc(x.city||'Mantiqueira')} • publicação</span></div></div>${x.text?`<p>${esc(x.text)}</p>`:""}${x.image?`<img src="${esc(x.image)}">`:''}<div class="postActions"><button class="action ${x.likedByMe?'liked':''}" onclick="likeProfilePost('${x.id}')">♥ ${x.likes||0}</button><button class="action" onclick="commentPost('${x.id}')">💬 Comentar</button><button class="action" onclick="sharePost('${x.id}')">↗ Compartilhar</button></div><div class="commentList">${comments.map(c=>`<div class="commentItem"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`).join('')}</div></article>`}

function newPhoto(){openModal(`<div class="modalHead"><h2>Nova foto</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Escolha uma foto da galeria e publique no seu perfil.</div><input id="photoFile" class="fileInput" type="file" accept="image/*"><textarea id="photoText" class="textarea" placeholder="Escreva uma legenda, se quiser..."></textarea><button class="primary" onclick="saveNewPhoto()">Publicar foto</button>`)}

async function saveProfile(){const meta={...(me?.user_metadata||{}),name:document.getElementById('editName').value.trim(),city:document.getElementById('editCity').value.trim(),photo:document.getElementById('editPhoto').value.trim()||avatar(document.getElementById('editName').value),cover:document.getElementById('editCover').value.trim()||'mantiqueira-hero.jpg',bio:document.getElementById('editBio').value.trim(),interests:document.getElementById('editInterests').value.trim(),links:document.getElementById('editLinks').value.trim(),aboutPublic:document.getElementById('aboutPublicSwitch').classList.contains('on')};const {data,error}=await sb.auth.updateUser({data:meta});if(error)return alert(error.message);me=data.user;try{await sb.from('profiles').upsert({id:me.id,name:meta.name,city:meta.city,photo:meta.photo,cover:meta.cover,bio:meta.bio,interests:meta.interests,links:meta.links,aboutPublic:meta.aboutPublic},{onConflict:'id'})}catch(_){}closeModal();go('profile')}

async function saveHighlight(){const name=document.getElementById('highlightName').value.trim();const files=[...document.getElementById('highlightFiles').files];if(!name)return alert('Digite um nome para o destaque.');if(!files.length)return alert('Selecione pelo menos uma foto.');const images=await Promise.all(files.map(fileToData));const p=profileData(),h=[...p.highlights,{name,images,image:images[0]}];await saveMeta({...p,highlights:h})}
async function saveMeta(obj){const meta={...(me?.user_metadata||{}),name:obj.name,city:obj.city,bio:obj.bio,photo:obj.photo,cover:obj.cover,interests:obj.interests,links:obj.links,highlights:obj.highlights,aboutPublic:obj.aboutPublic!==false};const {data,error}=await sb.auth.updateUser({data:meta});if(error)return alert(error.message);me=data.user;closeModal();go('profile')}
function settingsScreen(){const dark=!document.body.classList.contains('lightTheme'),notif=localStorage.getItem('cm_notifications')!=='off';openModal(`<div class="modalHead"><h2>Configurações</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Personalize sua experiência no Conecta Mantiqueira.</div><div class="settingsGrid"><div class="settingRow"><span><b>Notificações</b><small>Receber avisos de mensagens, interações e novidades.</small></span><button type="button" class="switch ${notif?'on':''}" onclick="toggleSetting(this,'notifications')"><i></i></button></div><div class="settingRow"><span><b>Tema escuro</b><small>Alternar entre tema escuro e claro.</small></span><button type="button" class="switch ${dark?'on':''}" onclick="toggleSetting(this,'theme')"><i></i></button></div></div><button class="secondary" style="width:100%;margin-top:16px" onclick="closeModal()">Fechar</button><button class="secondary" style="width:100%;margin-top:8px;color:#ff9aa1;border-color:#7d3440" onclick="logout()">Sair do aplicativo</button>`)}

function getStories(){const a=JSON.parse(localStorage.getItem('cm_stories')||'[]'),now=Date.now();const fresh=a.filter(x=>now-x.created<86400000);localStorage.setItem('cm_stories',JSON.stringify(fresh));return fresh}
async function newStory(){openModal(`<div class="modalHead"><h2>Novo status</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Escolha uma foto ou vídeo. Depois edite como quiser e publique.</div><div class="storyToolsRow"><button class="storyTool" onclick="document.getElementById('storyCamera').click()">📷 Câmera</button><button class="storyTool" onclick="document.getElementById('storyGallery').click()">🖼 Galeria</button></div><input id="storyCamera" class="hidden" type="file" accept="image/*,video/*" capture="environment" onchange="storyFilePicked(this)"><input id="storyGallery" class="hidden" type="file" accept="image/*,video/*" onchange="storyFilePicked(this)"><div id="storyPreviewWrap" class="hidden"><img id="storyPreview" class="storyPreview" alt="Prévia do status"></div><div id="storyFileName" class="small">Nenhuma mídia escolhida</div><div class="storyToolsRow"><button class="storyTool" onclick="toggleStoryOption('text')">Aa Texto</button><button class="storyTool" onclick="openMusicPicker()">🎵 Música</button><button class="storyTool" onclick="toggleStoryOption('link')">🔗 Link</button><button class="storyTool" onclick="toggleStoryOption('emoji')">😊 Emoji</button><button class="storyTool" onclick="toggleStoryOption('gif')">GIF</button></div><input id="storyText" class="field hidden" placeholder="Escreva algo..." autocomplete="off"><input id="storyLink" class="field hidden" placeholder="Link clicável" inputmode="url" autocomplete="off"><input id="storyEmoji" class="field hidden" placeholder="Digite ou cole um emoji 😊" autocomplete="off"><input id="storyGif" class="field hidden" placeholder="Cole o link de um GIF" inputmode="url" autocomplete="off"><input id="storyMusic" class="hidden" value=""><div id="storyMusicChoice" class="small hidden"></div><div class="storyPublish"><button class="primary" onclick="saveStory()">Publicar novo status</button></div>`)}
function storyFilePicked(input){const file=input.files?.[0];const camera=document.getElementById('storyCamera'),gallery=document.getElementById('storyGallery');if(file){if(camera&&input!==camera)camera.value='';if(gallery&&input!==gallery)gallery.value='';}const el=document.getElementById('storyFileName');if(el)el.textContent=file?.name||'Nenhuma mídia escolhida';const wrap=document.getElementById('storyPreviewWrap'),img=document.getElementById('storyPreview');if(file&&wrap&&img){const r=new FileReader();r.onload=()=>{if(file.type.startsWith('video/')){img.style.display='none';wrap.classList.remove('hidden')}else{img.src=r.result;img.style.display='block';wrap.classList.remove('hidden')}};r.readAsDataURL(file)}}
function toggleStoryOption(which){const id=which==='text'?'storyText':which==='link'?'storyLink':which==='emoji'?'storyEmoji':'storyGif';const el=document.getElementById(id);if(!el)return;el.classList.toggle('hidden');if(!el.classList.contains('hidden'))el.focus()}
const storyMusicList=[['Amanhecer na Serra','Conecta Music','https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3'],['Caminho da Montanha','Conecta Music','https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a734e5.mp3'],['Horizonte','Conecta Music','https://cdn.pixabay.com/download/audio/2022/10/25/audio_9467b0e2c4.mp3'],['Fim de Tarde','Conecta Music','https://cdn.pixabay.com/download/audio/2022/08/23/audio_3f5c7f5f64.mp3']];
function openMusicPicker(){openModal(`<div class="modalHead"><h2>🎵 Escolher música</h2><button class="close" onclick="closeModal();newStory()">×</button></div><div class="sub">Escolha uma faixa da playlist disponível para o status.</div>${storyMusicList.map((m,i)=>`<div class="settingRow" style="margin:8px 0"><span><b>${esc(m[0])}</b><small>${esc(m[1])}</small></span><button class="secondary" onclick="selectStoryMusic(${i})">Adicionar</button></div>`).join('')}<button class="secondary" style="width:100%;margin-top:10px" onclick="closeModal()">Cancelar</button>`)}
function selectStoryMusic(i){const m=storyMusicList[i];closeModal();const choice=document.getElementById('storyMusicChoice');const input=document.getElementById('storyMusic');if(input)input.value=m[0]+'|'+m[2];if(choice){choice.textContent='🎵 '+m[0]+' adicionada ao status';choice.classList.remove('hidden')}}
async function saveStory(){const file=document.getElementById('storyCamera').files[0]||document.getElementById('storyGallery').files[0];if(!file)return alert('Escolha uma foto ou vídeo para o status.');const media=await fileToData(file),p=profileData(),a=getStories();a.push({id:Date.now().toString(),owner:'me',name:p.name,photo:p.photo,image:media,type:file.type.startsWith('video/')?'video':'image',text:document.getElementById('storyText').value.trim(),link:document.getElementById('storyLink').value.trim(),emoji:document.getElementById('storyEmoji').value.trim(),gif:document.getElementById('storyGif').value.trim(),music:document.getElementById('storyMusic').value.trim(),created:Date.now()});localStorage.setItem('cm_stories',JSON.stringify(a));closeModal();go('home')}

function viewMyStory(){const s=getStories().filter(x=>x.owner==='me').pop();if(s)viewStoryData(s)}
function viewStoryData(s){const old=document.getElementById('storyViewer');if(old)old.remove();const media=s.type==='video'?`<video src="${esc(s.image)}" controls autoplay playsinline style="width:min(520px,100%);max-height:72vh;border-radius:20px;background:#000"></video>`:`<img src="${esc(s.image)}">`;document.body.insertAdjacentHTML('beforeend',`<div id="storyViewer" class="storyViewer"><button class="storyClose" onclick="this.parentElement.remove()">×</button><div style="width:min(520px,100%);text-align:center">${media}<h2>${esc(s.name||'Status')}</h2>${s.text?`<p>${esc(s.text)}</p>`:''}${s.link?`<a class="linkBtn" href="${esc(s.link)}" target="_blank" rel="noopener">🔗 Abrir link</a>`:''}${s.music?`<p class="small">🎵 Música adicionada</p>`:''}</div></div>`)}
function viewStory(id,name,photo){viewStoryData({name:decodeURIComponent(name),image:photo,type:'image',text:'Status da região 🌿'})}
function addGroup(){openModal(`<div class="modalHead"><h2>Criar grupo</h2><button class="close" onclick="closeModal()">×</button></div><input id="gName" class="field" placeholder="Nome do grupo"><input id="gSubtitle" class="field" placeholder="Subtítulo"><textarea id="gDesc" class="textarea" placeholder="Descrição do grupo"></textarea><textarea id="gRules" class="textarea" placeholder="Regras do grupo"></textarea><input id="gCover" class="field" placeholder="Link da foto/capa"><div class="sub" style="margin:8px 0 14px">Depois de criar, você poderá adicionar somente pessoas cadastradas no Conecta Mantiqueira.</div><button class="primary" onclick="saveGroup()">Criar grupo</button>`)}
function saveGroup(){const members=[...document.querySelectorAll('.gMember:checked')].map(x=>x.value);const p=profileData();const g={id:Date.now().toString(),name:document.getElementById('gName').value.trim(),subtitle:document.getElementById('gSubtitle').value.trim(),desc:document.getElementById('gDesc').value.trim(),rules:document.getElementById('gRules').value.trim(),cover:document.getElementById('gCover').value.trim()||'mantiqueira-hero.jpg',members,ownerId:me?.id||'',owner:p.name,blockedMembers:[],posts:[]};if(!g.name)return alert('Coloque um nome para o grupo.');const a=getGroups();a.push(g);localStorage.setItem('cm_groups',JSON.stringify(a));closeModal();currentGroup=g;go('group')}
function groupPreview(){const a=getGroups();if(!a.length)return `<div class="empty">Ainda não há grupos criados. <button class="link" onclick="addGroup()">Criar o primeiro</button></div>`;return a.slice(0,2).map(g=>`<button class="card" style="width:100%;text-align:left;color:white" onclick="openGroup('${g.id}')"><div class="groupCover" style="background-image:url('${esc(g.cover)}')"></div><div class="groupMeta"><div><b>${esc(g.name)}</b><div class="small">${esc(g.subtitle||'Grupo da região')} • ${g.members.length} membros</div></div></div></button>`).join('')}
function groups(){return screen(`<button class="ghost" onclick="go('home')">← Voltar</button><div class="sectionHead"><div><h1>Grupos da região</h1><div class="sub">Comunidades da Serra da Mantiqueira para conversar, publicar e compartilhar.</div></div><button class="followBtn" onclick="addGroup()">＋ Criar</button></div>${getGroups().length?getGroups().map(g=>`<button class="card" style="width:100%;text-align:left;color:white" onclick="openGroup('${g.id}')"><div class="groupCover" style="background-image:url('${esc(g.cover)}')"></div><div class="groupMeta"><div><b>${esc(g.name)}</b><div class="small">${esc(g.subtitle||'Grupo da região')} • ${g.members.length} membros</div></div></div><p class="sub">${esc(g.desc||'Sem descrição.')}</p></button>`).join(''):`<div class="empty">Nenhum grupo criado ainda.<br><button class="primary" onclick="addGroup()">＋ Criar meu primeiro grupo</button></div>`}`,'home')}
function openGroup(id){currentGroup=getGroups().find(g=>g.id===id);go('group')}
function isGroupOwner(g){return !!g&&(!!g.ownerId&&g.ownerId===me?.id || !g.ownerId&&g.owner===profileData().name)}
function personById(id){return getPublicPeople().find(p=>p.id===id)||null}
function saveGroups(a){localStorage.setItem('cm_groups',JSON.stringify(a))}
function manageGroup(){const g=currentGroup;if(!g||!isGroupOwner(g))return alert('Somente o responsável pelo grupo pode gerenciar esta comunidade.');openModal(`<div class="modalHead"><h2>Gerenciar grupo</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Você é o responsável por este grupo. Aqui você pode editar a página, bloquear pessoas ou excluir o grupo.</div><input id="mgName" class="field" value="${esc(g.name)}" placeholder="Nome do grupo"><input id="mgSubtitle" class="field" value="${esc(g.subtitle||'')}" placeholder="Subtítulo"><textarea id="mgDesc" class="textarea" placeholder="Descrição">${esc(g.desc||'')}</textarea><textarea id="mgRules" class="textarea" placeholder="Regras">${esc(g.rules||'')}</textarea><input id="mgCover" class="field" value="${esc(g.cover||'')}" placeholder="Link da capa"><button class="primary" onclick="saveGroupEdit()">Salvar alterações</button><h3 style="margin-top:22px">Membros e bloqueios</h3>${g.members.map(id=>{const p=personById(id);const name=p?.name||id;const blocked=(g.blockedMembers||[]).includes(id);return `<div class="memberRow"><img class="avatar" src="${esc(p?.photo||avatar(name))}"><span style="flex:1"><b>${esc(name)}</b><small class="sub">${esc(p?.city||'')}</small></span><button class="secondary" onclick="toggleGroupBlock('${esc(id)}')">${blocked?'Desbloquear':'Bloquear'}</button></div>`}).join('')}<button class="secondary" style="width:100%;margin-top:12px;color:#ff9aa1;border-color:#7d3440" onclick="deleteGroup()">Excluir grupo</button>`)}
function saveGroupEdit(){const g=currentGroup;if(!g||!isGroupOwner(g))return;const a=getGroups(),x=a.find(q=>q.id===g.id);if(!x)return;x.name=document.getElementById('mgName').value.trim()||x.name;x.subtitle=document.getElementById('mgSubtitle').value.trim();x.desc=document.getElementById('mgDesc').value.trim();x.rules=document.getElementById('mgRules').value.trim();x.cover=document.getElementById('mgCover').value.trim()||'mantiqueira-hero.jpg';x.ownerId=x.ownerId||me?.id||'';saveGroups(a);currentGroup=x;closeModal();go('group')}
function toggleGroupBlock(id){const g=currentGroup;if(!g||!isGroupOwner(g)||id===me?.id)return;const a=getGroups(),x=a.find(q=>q.id===g.id);x.blockedMembers=x.blockedMembers||[];x.blockedMembers=x.blockedMembers.includes(id)?x.blockedMembers.filter(v=>v!==id):[...x.blockedMembers,id];saveGroups(a);currentGroup=x;manageGroup()}
function deleteGroup(){const g=currentGroup;if(!g||!isGroupOwner(g))return;if(!confirm('Excluir este grupo? Esta ação não pode ser desfeita.'))return;saveGroups(getGroups().filter(x=>x.id!==g.id));currentGroup=null;closeModal();go('groups')}
function groupScreen(){const g=currentGroup;if(!g)return groups();const owner=isGroupOwner(g);const blocked=(g.blockedMembers||[]).includes(me?.id);return screen(`<button class="ghost" onclick="go('groups')">← Grupos</button><div class="card"><div class="groupCover" style="background-image:url('${esc(g.cover)}')"></div><h1>${esc(g.name)}</h1><div class="sub">${esc(g.subtitle||'Grupo da região')}</div><p>${esc(g.desc||'')}</p><span class="pill">${g.members.length} membros</span><span class="pill">Comunidade Mantiqueira</span>${owner?`<div class="profileActions"><button class="followBtn" onclick="manageGroup()">⚙ Gerenciar grupo</button><button class="secondary" onclick="addGroupMember()">＋ Adicionar pessoas</button><button class="secondary" onclick="newGroupPost()">＋ Publicar</button></div>`:blocked?`<div class="empty">Você foi bloqueado neste grupo pelo responsável.</div>`:`<div class="profileActions"><button class="secondary" onclick="newGroupPost()">＋ Publicar</button></div>`}</div><div class="tabs"><button class="tab active" onclick="groupTab(0)">Publicações</button><button class="tab" onclick="groupTab(1)">Sobre</button></div><div id="groupPages" class="tabPages"><div class="tabPage">${g.posts.length?g.posts.slice().reverse().map(x=>`<article class="card post"><div class="postTop"><img class="avatar" src="${esc(x.photo)}"><div><b>${esc(x.name)}</b><span>no grupo</span></div></div>${x.text?`<p>${esc(x.text)}</p>`:''}${x.image?`<img src="${esc(x.image)}">`:''}<div class="postActions"><button class="action">♥ ${x.likes||0}</button><button class="action">💬 Comentar</button></div></article>`).join(''):`<div class="empty">O grupo ainda não tem publicações. Seja o primeiro.</div>`}</div><div class="tabPage"><div class="card"><h3>Sobre o grupo</h3><p class="sub">${esc(g.desc||'Sem descrição.')}</p><h3>Regras</h3>${(g.rules||'Respeite os outros membros.').split('\n').filter(Boolean).map((r,i)=>`<div class="rule"><b>${i+1}.</b> ${esc(r)}</div>`).join('')}<h3>Membros</h3>${g.members.map(id=>{const p=personById(id);const isBlocked=(g.blockedMembers||[]).includes(id);return `<div class="memberRow"><img class="avatar" src="${esc(p?.photo||avatar(p?.name||id))}"><span>${esc(p?.name||id)}${isBlocked?'<small style="display:block;color:#ff9aa1">Bloqueado</small>':`<small class="sub">${esc(p?.city||'')}</small>`}</span></div>`}).join('')}</div></div></div>`,'home')}
function groupTab(i){const el=document.getElementById('groupPages');if(el)el.scrollTo({left:el.clientWidth*i,behavior:'smooth'});document.querySelectorAll('.tabs .tab').forEach((b,n)=>b.classList.toggle('active',n===i))}
function addGroupMember(){const g=currentGroup;if(!g||!isGroupOwner(g))return alert('Somente o responsável pelo grupo pode adicionar pessoas.');const blocked=g.blockedMembers||[];const people=getPublicPeople().filter(p=>p.id!==me?.id&&!blocked.includes(p.id));openModal(`<div class="modalHead"><h2>Adicionar pessoas</h2><button class="close" onclick="closeModal()">×</button></div><div class="sub">Escolha pessoas cadastradas no Conecta Mantiqueira.</div>${people.map(p=>`<label class="memberRow"><input type="checkbox" class="gmMember" value="${esc(p.id)}" ${g.members.includes(p.id)?'checked disabled':''}><img class="avatar" src="${esc(p.photo||avatar(p.name))}"><span>${esc(p.name)}<small class="sub">${esc(p.city||'')}</small></span></label>`).join('')||'<div class="empty">Nenhuma pessoa disponível ainda.</div>'}<button class="primary" onclick="saveGroupMembers()">Adicionar selecionadas</button>`)}
function saveGroupMembers(){const ids=[...document.querySelectorAll('.gmMember:checked:not(:disabled)')].map(x=>x.value);const a=getGroups(),g=a.find(x=>x.id===currentGroup.id);g.members=[...new Set([...g.members,...ids])];localStorage.setItem('cm_groups',JSON.stringify(a));currentGroup=g;closeModal();go('group')}
function newGroupPost(){openModal(`<div class="modalHead"><h2>Publicar no grupo</h2><button class="close" onclick="closeModal()">×</button></div><textarea id="gpText" class="textarea" placeholder="O que você quer compartilhar?"></textarea><input id="gpFile" class="fileInput" type="file" accept="image/*"><input id="gpImage" class="field" placeholder="Ou cole o link da foto"><button class="primary" onclick="saveGroupPost()">Publicar no grupo</button>`)}
async function saveGroupPost(){const g=currentGroup;if((g?.blockedMembers||[]).includes(me?.id))return alert('Você está bloqueado neste grupo.');const file=document.getElementById('gpFile').files[0],url=document.getElementById('gpImage').value.trim(),text=document.getElementById('gpText').value.trim();if(!text&&!file&&!url)return alert('Adicione texto ou foto.');const p=profileData(),image=file?await fileToData(file):url;const a=getGroups(),x=a.find(q=>q.id===g.id);x.posts=x.posts||[];x.posts.push({id:Date.now().toString(),ownerId:me?.id||'',name:p.name,photo:p.photo,text,image,likes:0});saveGroups(a);currentGroup=x;closeModal();go('group')}
function extractNewsImage(x){const raw=String(x.content||x.description||'');const m=raw.match(/<img[^>]+src=[\"\']([^\"\']+)[\"\']/i);return x.enclosure?.link||m?.[1]||x.thumbnail||''}
function newsImageUrl(src){if(!src)return '';if(/^data:/i.test(src))return src;if(/^https?:\/\//i.test(src))return 'https://images.weserv.nl/?url='+encodeURIComponent(src)+'&w=1200&h=700&fit=cover&output=jpg';return src}
function newsFallbackImage(n){if(!n?.url)return '';return 'https://api.microlink.io/?url='+encodeURIComponent(n.url)+'&meta=true&embed=image.url'}
function renderNews(list=news){const box=document.getElementById('newsList');if(!box)return;box.innerHTML=list.length?list.map(n=>{const original=n.image||'';const primary=original?newsImageUrl(original):newsFallbackImage(n);const fallback=newsFallbackImage(n);return `<a class="news" href="${esc(n.url)}" target="_blank" rel="noopener">${primary?`<img class="newsImage" src="${esc(primary)}" data-original="${esc(original)}" data-fallback="${esc(fallback)}" alt="Imagem da notícia: ${esc(n.title)}" onerror="if(this.dataset.original && this.src!==this.dataset.original){this.src=this.dataset.original;this.dataset.original=''}else if(this.dataset.fallback && this.src!==this.dataset.fallback){this.src=this.dataset.fallback;this.dataset.fallback=''}else{this.outerHTML='<div class=\"newsNoImage\">Imagem da fonte indisponível</div>'}">`:`<div class="newsNoImage">Imagem da fonte indisponível</div>`}<div class="newsBody"><div class="newsTop"><span class="newsSource">${esc(n.source||'Fonte regional')}</span><span class="newsDate">${esc(n.date||'Agora')}</span></div><b>${esc(n.title)}</b><span class="newsSummary">${esc(n.summary||'Veja os detalhes na matéria original.')}</span><div class="newsMeta"><span>📍 ${esc(n.city||'Mantiqueira')}</span><span class="newsRead">Ler matéria completa ↗</span></div></div></a>`}).join(''):'<div class="newsEmpty">Não encontramos uma matéria nova agora. Tente atualizar novamente.</div>'}
function newsDateValue(n){const d=n.pubDate||n.date||'';const t=Date.parse(d);return Number.isNaN(t)?0:t}
function newsDateText(value){const d=new Date(value);if(Number.isNaN(d.getTime()))return '';return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function stripHtml(v){const el=document.createElement('div');el.innerHTML=v||'';return (el.textContent||el.innerText||'').replace(/\s+/g,' ').trim()}
function newsCity(title=''){const t=normText(title);const citiesHit=cities.filter(c=>t.includes(normText(c)));return citiesHit[0]||''}
const newsQueries=['"Campos do Jordão"','"São Bento do Sapucaí"','"Santo Antônio do Pinhal"','"Sapucaí-Mirim"','"Gonçalves MG" OR "Monte Verde MG"','"Itajubá" OR "Maria da Fé" OR "Pouso Alto"','"Extrema MG" OR "Camanducaia"','"Paraisópolis MG" OR "Caxambu" OR "São Lourenço MG"'];
async function fetchNewsQuery(q){const rss='https://news.google.com/rss/search?q='+encodeURIComponent(q+' when:7d')+'&hl=pt-BR&gl=BR&ceid=BR:pt-419';const endpoint='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rss);const res=await fetch(endpoint,{cache:'no-store'});if(!res.ok)throw new Error('Falha ao buscar notícias');const data=await res.json();return Array.isArray(data.items)?data.items.map(x=>({...x,_query:q})):[]}
async function enrichNewsImage(item){try{const u='https://api.microlink.io/?url='+encodeURIComponent(item.link||'')+'&meta=true';const r=await fetch(u,{cache:'no-store'});if(r.ok){const d=await r.json();const image=d?.data?.image?.url||'';if(image)return image}}catch(_){}return extractNewsImage(item)}
async function refreshNews(force=false){const box=document.getElementById('newsList'),status=document.getElementById('newsStatus');if(!box)return;if(box.dataset.loading==='1')return;box.dataset.loading='1';box.classList.add('newsLoading');if(status)status.textContent='Buscando notícias novas de várias cidades...';try{const batches=await Promise.allSettled(newsQueries.map(fetchNewsQuery));let raw=[];batches.forEach(r=>{if(r.status==='fulfilled')raw.push(...r.value)});const seen=new Set();let items=raw.map(x=>{const title=stripHtml(x.title);const url=x.link||x.guid||'';const source=typeof x.author==='string'&&x.author?x.author:(typeof x.source==='string'&&x.source?x.source:(title.includes(' - ')?title.split(' - ').pop():'Fonte regional'));return{source,title:title.replace(/\s+-\s+[^-]+$/,''),summary:stripHtml(x.description||x.content).slice(0,190),url,date:newsDateText(x.pubDate)||'Atualizada recentemente',pubDate:x.pubDate||'',city:newsCity(title)||newsCity(x._query||''),image:extractNewsImage(x)}}).filter(x=>x.title&&x.url).filter(x=>{const k=x.url;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>newsDateValue(b)-newsDateValue(a));const byCity=new Map();items.forEach(x=>{const k=x.city||'Mantiqueira';if(!byCity.has(k))byCity.set(k,[]);byCity.get(k).push(x)});let diverse=[];let added=true;while(added&&diverse.length<16){added=false;for(const arr of byCity.values()){if(!arr.length)continue;diverse.push(arr.shift());added=true;if(diverse.length>=16)break}}if(diverse.length<8)diverse=items.slice(0,16);const enriched=await Promise.all(diverse.slice(0,12).map(async x=>({...x,image:x.image||await enrichNewsImage(x)})));const history=JSON.parse(localStorage.getItem('cm_news_seen')||'{}');const now=Date.now();Object.keys(history).forEach(k=>{if(now-history[k]>30*60*1000)delete history[k]});let fresh=enriched.filter(x=>!history[x.url]);if(fresh.length<8)fresh=enriched;fresh=fresh.slice(0,12);fresh.forEach(x=>{history[x.url]=now});localStorage.setItem('cm_news_seen',JSON.stringify(history));if(fresh.length){news.splice(0,news.length,...fresh);renderNews(news);if(status)status.textContent='Atualizado agora • '+new Set(fresh.map(x=>x.city)).size+' localidades • '+fresh.length+' notícias';localStorage.setItem('cm_news_cache',JSON.stringify(news))}else{renderNews(news);if(status)status.textContent='Não há novidades no momento'}}catch(e){const cached=JSON.parse(localStorage.getItem('cm_news_cache')||'[]').map(x=>({...x,image:(x.image&&/unsplash\.com/.test(x.image))?'':x.image}));if(cached.length){news.splice(0,news.length,...cached);renderNews(news)}if(status)status.textContent='Não foi possível atualizar agora. Tente novamente.'}finally{box.dataset.loading='0';box.classList.remove('newsLoading')}}

let newsRefreshTimer=null,newsPullStart=0,newsPulling=false;
function setupNewsRefresh(){renderNews(news);refreshNews();clearInterval(newsRefreshTimer);newsRefreshTimer=setInterval(()=>{if(document.visibilityState==='visible'&&document.getElementById('newsList'))refreshNews(false)},5*60*1000);const area=document.querySelector('.screen');if(!area)return;area.addEventListener('touchstart',e=>{if(window.scrollY<=5)newsPullStart=e.touches[0].clientY},{passive:true});area.addEventListener('touchmove',e=>{if(!newsPullStart)return;const dy=e.touches[0].clientY-newsPullStart;if(dy>0&&window.scrollY<=5){newsPulling=true;const h=Math.min(48,Math.round(dy*.45));const pull=document.getElementById('newsPull');if(pull){pull.style.height=h+'px';pull.textContent=h>=42?'Solte para atualizar notícias ↓':'Puxe para atualizar notícias…'}}},{passive:true});area.addEventListener('touchend',()=>{if(newsPulling){const pull=document.getElementById('newsPull');if(pull&&parseInt(pull.style.height||'0',10)>=42)refreshNews(true);if(pull){pull.style.height='0px';pull.textContent=''}}newsPullStart=0;newsPulling=false},{passive:true})}
function chat(){const people=getPublicPeople().filter(p=>p.id!==me?.id);return screen(`<h1>Bate-papo</h1><input class="search" placeholder="⌕ Buscar conversas..."><div class="list">${people.length?people.map(p=>`<div class="chatItem" onclick="publicProfile('${esc(p.id)}');setTimeout(()=>go('conversation'),0)"><img class="avatar" src="${esc(p.photo||avatar(p.name))}"><div class="chatInfo"><b>${esc(p.name)}</b><span class="online">● Online agora</span></div><button class="iconBtn">›</button></div>`).join(""):"<div class='empty'>Você ainda não tem outras pessoas cadastradas para conversar.</div>"}</div>`,'chat')}
function conversation(){const p=currentPublicUser;if(!p)return chat();const msgs=JSON.parse(localStorage.getItem('cm_messages_'+p.id)||'[]');return screen(`<div class="chatHead"><button class="ghost" onclick="go('chat')">←</button><img class="avatar" src="${p.photo}"><div style="flex:1"><b>${p.name}</b><div class="small online">Online agora</div></div><button class="iconBtn">☎</button><button class="iconBtn">⋯</button></div><div class="card" style="text-align:center"><img class="profileAvatar" style="margin:0" src="${p.photo}"><h2>${p.name}</h2><div class="sub">${p.city}</div><div class="profileActions" style="justify-content:center"><button class="secondary" onclick="publicProfile('${p.id}')">Ver perfil</button><button class="followBtn" onclick="toggleFollow('${p.id}')">${isFollowing(p.id)?'Seguindo':'Seguir'}</button></div></div><div class="messageList">${msgs.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')}</div><div class="composer"><button class="iconBtn" onclick="alert('Câmera preparada para a próxima integração')">📷</button><input id="msgText" placeholder="Mensagem..."><button class="iconBtn" onclick="sendMessage('${p.id}')">➤</button><button class="iconBtn" onclick="alert('Áudio preparado para a próxima integração')">🎙</button><button class="iconBtn" onclick="alert('Galeria preparada para a próxima integração')">🖼</button><button class="iconBtn" onclick="alert('GIFs preparados para a próxima integração')">GIF</button><button class="iconBtn" onclick="alert('Mais opções')">＋</button></div>`,'chat')}
function sendMessage(id){const el=document.getElementById('msgText'),text=el?.value.trim();if(!text)return;const k='cm_messages_'+id,a=JSON.parse(localStorage.getItem(k)||'[]');a.push({text,mine:true,created:Date.now()});localStorage.setItem(k,JSON.stringify(a));go('conversation')}
function openImage(url){const src=decodeURIComponent(url);document.body.insertAdjacentHTML('beforeend',`<div id="imageModal" class="storyViewer" onclick="this.remove()"><img src="${esc(src)}"></div>`)}
function openModal(content){const old=document.getElementById('modal');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal"><div class="modalBox">${content}</div></div>`)}
function closeModal(){document.getElementById('modal')?.remove()}
function fileToData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function logout(){sb.auth.signOut();me=null;location.reload()}
function go(page,arg=""){const a=document.getElementById('app');if(page==='home')a.innerHTML=home();else if(page==='people')a.innerHTML=people(arg);else if(page==='chat')a.innerHTML=chat();else if(page==='conversation')a.innerHTML=conversation();else if(page==='explore'){a.innerHTML=explore();setTimeout(renderFeed,0)}else if(page==='news'){a.innerHTML=newsScreen();setTimeout(setupNewsRefresh,0)}else if(page==='business')a.innerHTML=businessScreen();else if(page==='profile')a.innerHTML=profile();else if(page==='publicProfile')a.innerHTML=publicProfileScreen();else if(page==='groups')a.innerHTML=groups();else if(page==='group')a.innerHTML=groupScreen()}
function authScreen(){document.getElementById('app').innerHTML=`<div class="auth"><div class="authCard"><div class="brand">Conecta <span>Mantiqueira</span></div><h1 id="authTitle">Criar conta</h1><div class="sub">Entre para fazer parte da região conectada.</div><div id="registerFields"><input id="name" class="field" placeholder="Nome"><input id="city" class="field" placeholder="Cidade"></div><input id="email" class="field" type="email" placeholder="E-mail"><input id="password" class="field" type="password" placeholder="Senha"><div id="error" class="error"></div><button class="primary" onclick="submitAuth()">Continuar</button><button class="ghost" onclick="toggleAuth()">Já tenho uma conta</button></div></div>`;window.mode='register'}
function toggleAuth(){mode=mode==='register'?'login':'register';document.getElementById('authTitle').textContent=mode==='register'?'Criar conta':'Entrar';document.getElementById('registerFields').classList.toggle('hidden',mode!=='register');document.querySelector('.ghost').textContent=mode==='register'?'Já tenho uma conta':'Criar uma conta'}
async function submitAuth(){try{document.getElementById('error').textContent='';const emailInput=document.getElementById('email'),passwordInput=document.getElementById('password'),nameInput=document.getElementById('name'),cityInput=document.getElementById('city');if(mode==='register'){const {data,error}=await sb.auth.signUp({email:emailInput.value.trim(),password:passwordInput.value,options:{data:{name:nameInput?.value.trim()||'',city:cityInput?.value.trim()||'',bio:'',photo:'',cover:'mantiqueira-hero.jpg',interests:'',links:'',highlights:[]}}});if(error)throw error;if(!data.user)throw new Error('Não foi possível criar a conta.');me=data.user;try{await sb.from('profiles').upsert({id:me.id,name:nameInput?.value.trim()||'',city:cityInput?.value.trim()||'',bio:'',photo:'',cover:'mantiqueira-hero.jpg',interests:'',links:''},{onConflict:'id'})}catch(_){} }else{const {data,error}=await sb.auth.signInWithPassword({email:emailInput.value.trim(),password:passwordInput.value});if(error)throw error;me=data.user}go('home')}catch(e){document.getElementById('error').textContent=e.message}}
async function applyTheme(){document.body.classList.toggle('lightTheme',localStorage.getItem('cm_theme')==='light')}
async function start(){applyTheme();const {data}=await sb.auth.getUser();me=data?.user||null;if(me){await loadPublicProfiles();go('home')}else authScreen()}start();
</script>
</body></html>
